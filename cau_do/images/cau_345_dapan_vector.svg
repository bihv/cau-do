<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Light theme default */
      .card-box { fill: #ffffff; stroke: #cbd5e1; }
      .card-text-primary { fill: #0f172a; }
      .card-text-secondary { fill: #64748b; }

      .face-base { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 4,4; opacity: 0.8; }
      .face-left { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 1.5; opacity: 0.85; }
      .face-right { fill: #fef3c7; stroke: #fcd34d; stroke-width: 1.5; opacity: 0.85; }

      .badge-emerald { fill: #ecfdf5; stroke: #10b981; }
      .badge-emerald-text { fill: #047857; }

      .legend-card { fill: #ffffff; stroke: #cbd5e1; }
      .legend-title { fill: #0f172a; }

      /* Dark theme */
      @media (prefers-color-scheme: dark) {
        .card-box { fill: #1e293b; stroke: #475569; }
        .card-text-primary { fill: #f8fafc; }
        .card-text-secondary { fill: #94a3b8; }

        .face-base { fill: rgba(59, 130, 246, 0.15); stroke: #3b82f6; stroke-width: 1.5; stroke-dasharray: 4,4; opacity: 0.9; }
        .face-left { fill: rgba(16, 185, 129, 0.22); stroke: #10b981; stroke-width: 1.5; opacity: 0.9; }
        .face-right { fill: rgba(245, 158, 11, 0.22); stroke: #f59e0b; stroke-width: 1.5; opacity: 0.9; }

        .badge-emerald { fill: #064e3b; stroke: #10b981; }
        .badge-emerald-text { fill: #a7f3d0; }

        .legend-card { fill: #1e293b; stroke: #334155; }
        .legend-title { fill: #f8fafc; }
      }
    ]]></style>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="stickShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>

    <!-- Wood Gradient for Outer Front Matchsticks -->
    <linearGradient id="stickFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Wood Gradient for Base Rear Matchstick -->
    <linearGradient id="stickRear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Red Sulfur Head Gradient -->
    <radialGradient id="headGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Top Winner Badge -->
  <g transform="translate(420, 45)">
    <rect class="badge-emerald" x="-210" y="-18" width="420" height="36" rx="18" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="-185" cy="0" r="10" fill="#10b981"/>
    <path d="M -189 0 L -186 3 L -181 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="badge-emerald-text" x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Khối Tứ Diện Đều 3D (4 mặt tam giác đều)</text>
  </g>

  <!-- TETRAHEDRON 3D MODEL -->
  <!--
    Vertices:
      Apex S: (350, 110)
      Base Left A: (220, 310)
      Base Front B: (350, 380)
      Base Right C: (480, 310)
  -->

  <!-- Faces -->
  <!-- 1. Base Face ABC: A(220, 310), B(350, 380), C(480, 310) -->
  <polygon class="face-base" points="220,310 350,380 480,310"/>

  <!-- 2. Left Front Face SAB: S(350, 110), A(220, 310), B(350, 380) -->
  <polygon class="face-left" points="350,110 220,310 350,380"/>

  <!-- 3. Right Front Face SBC: S(350, 110), B(350, 380), C(480, 310) -->
  <polygon class="face-right" points="350,110 350,380 480,310"/>

  <!-- Face Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800">
    <!-- Left face label -->
    <text x="300" y="270" font-size="13" fill="#047857" text-anchor="middle">Mặt 1</text>
    <!-- Right face label -->
    <text x="400" y="270" font-size="13" fill="#b45309" text-anchor="middle">Mặt 2</text>
    <!-- Base face label -->
    <text x="350" y="345" font-size="12" fill="#2563eb" text-anchor="middle">Mặt 3 (Đáy)</text>
    <!-- Back face indication -->
    <text class="card-text-secondary" x="350" y="210" font-size="12" text-anchor="middle">(Mặt 4 ở phía sau)</text>
  </g>

  <!-- 6 MATCHSTICKS (EDGES) -->
  <!-- Rear Base Edge AC (Dashed hidden line effect, A to C) -->
  <!-- dx = 260, dy = 0. From (220, 310) to (480, 310) -->
  <g filter="url(#stickShadow)">
    <rect x="220" y="306" width="260" height="8" rx="4" fill="url(#stickRear)" stroke="#64748b" stroke-width="1" stroke-dasharray="6,4"/>
  </g>

  <!-- Left Base Edge AB: (220, 310) to (350, 380). dx=130, dy=70. len = sqrt(130^2+70^2) = 147.6. Angle = 28.3 deg -->
  <g transform="translate(220, 310) rotate(28.3)" filter="url(#stickShadow)">
    <rect x="0" y="-5" width="147.6" height="10" rx="5" fill="url(#stickFront)"/>
    <circle cx="147.6" cy="0" r="7" fill="url(#headGrad)"/>
  </g>

  <!-- Right Base Edge BC: (350, 380) to (480, 310). dx=130, dy=-70. len = 147.6. Angle = -28.3 deg -->
  <g transform="translate(350, 380) rotate(-28.3)" filter="url(#stickShadow)">
    <rect x="0" y="-5" width="147.6" height="10" rx="5" fill="url(#stickFront)"/>
    <circle cx="147.6" cy="0" r="7" fill="url(#headGrad)"/>
  </g>

  <!-- Lateral Edge SA: (350, 110) to (220, 310). dx=-130, dy=200. len = sqrt(130^2+200^2) = 238.5. Angle = 123 deg (or from S: 123 deg) -->
  <g transform="translate(350, 110) rotate(123)" filter="url(#stickShadow)">
    <rect x="0" y="-5" width="238.5" height="10" rx="5" fill="url(#stickFront)"/>
    <circle cx="238.5" cy="0" r="7" fill="url(#headGrad)"/>
  </g>

  <!-- Lateral Edge SC: (350, 110) to (480, 310). dx=130, dy=200. len = 238.5. Angle = 57 deg -->
  <g transform="translate(350, 110) rotate(57)" filter="url(#stickShadow)">
    <rect x="0" y="-5" width="238.5" height="10" rx="5" fill="url(#stickFront)"/>
    <circle cx="238.5" cy="0" r="7" fill="url(#headGrad)"/>
  </g>

  <!-- Lateral Center Edge SB: (350, 110) to (350, 380). dx=0, dy=270. Vertical!
       Remember W3C zero-area trap: Use rect rx="5" with width="10" and height="270" -->
  <g filter="url(#stickShadow)">
    <rect x="345" y="110" width="10" height="270" rx="5" fill="url(#stickFront)"/>
    <circle cx="350" cy="380" r="7.5" fill="url(#headGrad)"/>
    <!-- Top Apex Common Head Joint -->
    <circle cx="350" cy="110" r="9" fill="url(#headGrad)"/>
  </g>

  <!-- Right Explanation Cards -->
  <g transform="translate(560, 110)">
    <!-- Card 1: 3D Thinking -->
    <rect class="legend-card" x="0" y="0" width="240" height="85" rx="12" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text class="legend-title" x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">💡 Tư duy không gian 3D:</text>
    <text class="card-text-secondary" x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Trên mặt phẳng 2D: Tối đa 2 tam giác.</text>
    <text class="badge-emerald-text" x="16" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Trong không gian 3D: Đúng 4 tam giác!</text>

    <!-- Card 2: Structure Breakdown -->
    <rect class="legend-card" x="0" y="105" width="240" height="115" rx="12" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text class="legend-title" x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">📐 Cấu trúc hình tứ diện:</text>
    <text class="card-text-secondary" x="16" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">• 6 cạnh = 6 que diêm</text>
    <text class="card-text-secondary" x="16" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">• 4 đỉnh (3 đỉnh đáy + 1 đỉnh chóp)</text>
    <text class="card-text-secondary" x="16" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">• 4 mặt đều là tam giác đều bằng nhau</text>
  </g>

</svg>
