<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Soft shadow filter -->
    <filter id="card-shadow" x="-8%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="target-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>

    <!-- Background Gradients -->
    <linearGradient id="grid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="cell-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="target-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- ==================================================== -->
  <!-- LEFT SIDE: 3x3 IQ MATRIX GRID                        -->
  <!-- Box: x=50, y=45, w=360, h=360                        -->
  <!-- Cell size: 104x104, gap: 12px                        -->
  <!-- ==================================================== -->
  <g filter="url(#card-shadow)">
    <!-- Main Outer Container -->
    <rect x="50" y="45" width="360" height="360" rx="20" fill="url(#grid-bg)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Row 1 -->
    <!-- (1,1): Slash '/' -->
    <rect x="62" y="57" width="104" height="104" rx="12" fill="url(#cell-bg)" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="86" y1="137" x2="142" y2="81" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>

    <!-- (1,2): Vertical '|' -->
    <rect x="178" y="57" width="104" height="104" rx="12" fill="url(#cell-bg)" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="230" y1="73" x2="230" y2="145" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>

    <!-- (1,3): Backslash '\' -->
    <rect x="294" y="57" width="104" height="104" rx="12" fill="url(#cell-bg)" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="318" y1="81" x2="374" y2="137" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>

    <!-- Row 2 -->
    <!-- (2,1): Horizontal '-' -->
    <rect x="62" y="173" width="104" height="104" rx="12" fill="url(#cell-bg)" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="78" y1="225" x2="150" y2="225" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>

    <!-- (2,2): Star Asterisk '*' combining all 4 directions -->
    <rect x="178" y="173" width="104" height="104" rx="12" fill="url(#cell-bg)" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Horizontal -->
    <line x1="194" y1="225" x2="266" y2="225" stroke="#0f172a" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Vertical -->
    <line x1="230" y1="189" x2="230" y2="261" stroke="#0f172a" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Slash / -->
    <line x1="204" y1="251" x2="256" y2="199" stroke="#0f172a" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Backslash \ -->
    <line x1="204" y1="199" x2="256" y2="251" stroke="#0f172a" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Center core dot -->
    <circle cx="230" cy="225" r="4" fill="#0f172a"/>

    <!-- (2,3): Horizontal '-' -->
    <rect x="294" y="173" width="104" height="104" rx="12" fill="url(#cell-bg)" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="310" y1="225" x2="382" y2="225" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>

    <!-- Row 3 -->
    <!-- (3,1): Backslash '\' -->
    <rect x="62" y="289" width="104" height="104" rx="12" fill="url(#cell-bg)" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="86" y1="313" x2="142" y2="369" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>

    <!-- (3,2): Vertical '|' -->
    <rect x="178" y="289" width="104" height="104" rx="12" fill="url(#cell-bg)" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="230" y1="305" x2="230" y2="377" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>

    <!-- (3,3): TARGET EMPTY CELL (with glowing dashed border & '?') -->
    <rect x="294" y="289" width="104" height="104" rx="12" fill="url(#target-bg)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#target-glow)"/>
    <text x="346" y="341" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#d97706" text-anchor="middle" dominant-baseline="central">?</text>
  </g>

  <!-- ==================================================== -->
  <!-- RIGHT SIDE: 4 MULTIPLE CHOICE OPTIONS A, B, C, D     -->
  <!-- 2x2 grid of cards                                    -->
  <!-- ==================================================== -->
  <!-- OPTION A: Backslash '\' -->
  <g filter="url(#card-shadow)">
    <rect x="460" y="55" width="130" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="497" y1="77" x2="553" y2="133" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <text x="525" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">A</text>
  </g>

  <!-- OPTION B: Slash '/' (CORRECT ANSWER) -->
  <g filter="url(#card-shadow)">
    <rect x="620" y="55" width="130" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="657" y1="133" x2="713" y2="77" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <text x="685" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">B</text>
  </g>

  <!-- OPTION C: Vertical '|' -->
  <g filter="url(#card-shadow)">
    <rect x="460" y="235" width="130" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="525" y1="250" x2="525" y2="320" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <text x="525" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">C</text>
  </g>

  <!-- OPTION D: Horizontal '-' -->
  <g filter="url(#card-shadow)">
    <rect x="620" y="235" width="130" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="650" y1="285" x2="720" y2="285" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <text x="685" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">D</text>
  </g>
</svg>
