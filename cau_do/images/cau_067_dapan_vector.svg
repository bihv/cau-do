      <circle cx="140.0" cy="422" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="140.0" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#64748b" text-anchor="middle" dominant-baseline="central">A</text>
    </g>
    <!-- Option B -->
    <g opacity="0.38">
      <rect x="255" y="230" width="170" height="160" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
