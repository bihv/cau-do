<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <defs>
    <!-- Colors for the 4 isosceles triangular pieces -->
    <!-- T1 (Blue) -->
    <linearGradient id="gT1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- T2 (Green) -->
    <linearGradient id="gT2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>

    <!-- T3 (Amber) -->
    <linearGradient id="gT3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- T4 (Purple) -->
    <linearGradient id="gT4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Left: Target Floor Triangle (A) -->
  <!-- Points: L1=(50,260), V1=(230,90), R1=(330,260), H1=(230,260), M1L=(140,175), M1R=(280,175) -->
  <g filter="url(#shadow)">
    <!-- T1: L1(50,260) - M1L(140,175) - H1(230,260) -->
    <polygon points="50,260 140,175 230,260" fill="url(#gT1)" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- T2: V1(230,90) - M1L(140,175) - H1(230,260) -->
    <polygon points="230,90 140,175 230,260" fill="url(#gT2)" stroke="#16a34a" stroke-width="2" stroke-linejoin="round"/>

    <!-- T3: V1(230,90) - H1(230,260) - M1R(280,175) -->
    <polygon points="230,90 230,260 280,175" fill="url(#gT3)" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round"/>

    <!-- T4: R1(330,260) - M1R(280,175) - H1(230,260) -->
    <polygon points="330,260 280,175 230,260" fill="url(#gT4)" stroke="#9333ea" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Labels on Left pieces -->
  <text x="140" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle">1</text>
  <text x="200" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">2</text>
  <text x="250" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#854d0e" text-anchor="middle">3</text>
  <text x="285" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">4</text>
  <text x="190" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0369a1" text-anchor="middle">Nền nhà (A)</text>

  <!-- Right: Carpet Cut into 4 pieces (B) -->
  <!-- Carpet: L2=(430,260), V2=(530,90), R2=(710,260), H2=(530,260), M2L=(480,175), M2R=(620,175) -->
  <!-- Note: In Carpet, the left side corresponds to the right side of A (T3, T4), and the right side corresponds to left of A (T1, T2) -->
  <g filter="url(#shadow)">
    <!-- T4: L2(430,260) - M2L(480,175) - H2(530,260) -->
    <polygon points="430,260 480,175 530,260" fill="url(#gT4)" stroke="#9333ea" stroke-width="2" stroke-linejoin="round"/>

    <!-- T3: V2(530,90) - H2(530,260) - M2L(480,175) -->
    <polygon points="530,90 530,260 480,175" fill="url(#gT3)" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round"/>

    <!-- T2: V2(530,90) - M2R(620,175) - H2(530,260) -->
    <polygon points="530,90 620,175 530,260" fill="url(#gT2)" stroke="#16a34a" stroke-width="2" stroke-linejoin="round"/>

    <!-- T1: R2(710,260) - M2R(620,175) - H2(530,260) -->
    <polygon points="710,260 620,175 530,260" fill="url(#gT1)" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Labels on Right pieces -->
  <text x="475" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b21a8" text-anchor="middle">4</text>
  <text x="510" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#854d0e" text-anchor="middle">3</text>
  <text x="560" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">2</text>
  <text x="620" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle">1</text>
  <text x="570" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">Tấm thảm (B)</text>

  <!-- Center Arrow / Separator -->
  <g transform="translate(380, 175)">
    <circle cx="0" cy="0" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M-6,-4 L-1,0 L-6,4 M1,-4 L6,0 L1,4" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
