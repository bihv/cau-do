<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Light theme default */
      .card-box { fill: #ffffff; stroke: #cbd5e1; }
      .card-text-primary { fill: #0f172a; }
      .card-text-secondary { fill: #64748b; }

      .badge-emerald { fill: #ecfdf5; stroke: #10b981; }
      .badge-emerald-text { fill: #047857; }

      .perspective-badge { fill: #f8fafc; stroke: #cbd5e1; }
      .perspective-text { fill: #475569; }

      .rot-arrow { stroke: #3b82f6; fill: none; }
      .rot-arrow-head { fill: #3b82f6; }
      .rot-text { fill: #2563eb; }

      .correct-glow { fill: #ecfdf5; stroke: #10b981; }

      /* Dark theme */
      @media (prefers-color-scheme: dark) {
        .card-box { fill: #1e293b; stroke: #475569; }
        .card-text-primary { fill: #f8fafc; }
        .card-text-secondary { fill: #94a3b8; }

        .badge-emerald { fill: #064e3b; stroke: #10b981; }
        .badge-emerald-text { fill: #a7f3d0; }

        .perspective-badge { fill: #1e293b; stroke: #334155; }
        .perspective-text { fill: #94a3b8; }

        .rot-arrow { stroke: #60a5fa; fill: none; }
        .rot-arrow-head { fill: #60a5fa; }
        .rot-text { fill: #93c5fd; }

        .correct-glow { fill: rgba(16, 185, 129, 0.2); stroke: #10b981; }
      }
    ]]></style>

    <!-- Matchstick Drop Shadow -->
    <filter id="stickShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Emerald Matchstick Gradient for Correct Answer -->
    <linearGradient id="stickEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Wood Gradient for Inactive / Faded -->
    <linearGradient id="woodFaded" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Red Sulfur Head Gradient -->
    <radialGradient id="headEmerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <radialGradient id="headFaded" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <!-- Arrow Marker -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="rot-arrow-head" d="M 0 1 L 9 5 L 0 9 z"/>
    </marker>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Top Winner Badge -->
  <g transform="translate(420, 45)">
    <rect class="badge-emerald" x="-210" y="-18" width="420" height="36" rx="18" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="-185" cy="0" r="10" fill="#10b981"/>
    <path d="M -189 0 L -186 3 L -181 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="badge-emerald-text" x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Đáp án: 0 lần di chuyển (Xoay góc nhìn 180°)</text>
  </g>

  <!-- Top Faded Original Equation: I + X = IX (y = 120, scale 0.65) -->
  <g transform="translate(180, 120) scale(0.65)" opacity="0.45">
    <text class="card-text-secondary" x="-90" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Ban đầu:</text>
    <!-- I (x = 20) -->
    <rect x="16" y="-35" width="8" height="70" rx="4" fill="url(#woodFaded)"/>
    <!-- + (x = 100) -->
    <rect x="75" y="-4" width="50" height="8" rx="4" fill="url(#woodFaded)"/>
    <rect x="96" y="-25" width="8" height="50" rx="4" fill="url(#woodFaded)"/>
    <!-- X (x = 190) -->
    <g transform="translate(190, -25) rotate(45)"><rect x="-4" y="0" width="8" height="70" rx="4" fill="url(#woodFaded)"/></g>
    <g transform="translate(190, 25) rotate(-45)"><rect x="-4" y="-70" width="8" height="70" rx="4" fill="url(#woodFaded)"/></g>
    <!-- = (x = 290) -->
    <rect x="270" y="-12" width="45" height="8" rx="4" fill="url(#woodFaded)"/>
    <rect x="270" y="6" width="45" height="8" rx="4" fill="url(#woodFaded)"/>
    <!-- IX (x = 370, 430) -->
    <rect x="366" y="-35" width="8" height="70" rx="4" fill="url(#woodFaded)"/>
    <g transform="translate(430, -25) rotate(45)"><rect x="-4" y="0" width="8" height="70" rx="4" fill="url(#woodFaded)"/></g>
    <g transform="translate(430, 25) rotate(-45)"><rect x="-4" y="-70" width="8" height="70" rx="4" fill="url(#woodFaded)"/></g>
    <text class="card-text-secondary" x="520" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">(1 + 10 = 9 ✗)</text>
  </g>

  <!-- Curved Rotation Indicator (Center Y = 168) -->
  <g transform="translate(420, 168)">
    <rect class="perspective-badge" x="-135" y="-14" width="270" height="28" rx="14" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text class="rot-text" x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Xoay góc nhìn 180° sang phía đối diện ↷</text>
    <path class="rot-arrow" d="M -110 22 C -40 33, 40 33, 110 22" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Solution Equation Box: XI = X + I (Center Y = 280) -->
  <g transform="translate(0, 280)" filter="url(#stickShadow)">
    <!-- 1. Roman 'X' of XI (x = 120) -->
    <g transform="translate(120, -35) rotate(45)">
      <rect x="-4" y="0" width="8" height="100" rx="4" fill="url(#stickEmerald)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headEmerald)"/>
    </g>
    <g transform="translate(120, 35) rotate(-45)">
      <rect x="-4" y="-100" width="8" height="100" rx="4" fill="url(#stickEmerald)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headEmerald)"/>
    </g>

    <!-- 2. Roman 'I' of XI (x = 190) -->
    <g transform="translate(190, -45)">
      <rect x="-4" y="0" width="8" height="90" rx="4" fill="url(#stickEmerald)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headEmerald)"/>
    </g>

    <!-- 3. Equal Sign '=' (x = 290) -->
    <g transform="translate(290, 0)">
      <rect x="-30" y="-16" width="60" height="8" rx="4" fill="url(#stickEmerald)"/>
      <circle cx="30" cy="-12" r="6" fill="url(#headEmerald)"/>
      <rect x="-30" y="8" width="60" height="8" rx="4" fill="url(#stickEmerald)"/>
      <circle cx="30" cy="12" r="6" fill="url(#headEmerald)"/>
    </g>

    <!-- 4. Roman 'X' (x = 400) -->
    <g transform="translate(400, -35) rotate(45)">
      <rect x="-4" y="0" width="8" height="100" rx="4" fill="url(#stickEmerald)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headEmerald)"/>
    </g>
    <g transform="translate(400, 35) rotate(-45)">
      <rect x="-4" y="-100" width="8" height="100" rx="4" fill="url(#stickEmerald)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headEmerald)"/>
    </g>

    <!-- 5. Plus Sign '+' (x = 510) -->
    <g transform="translate(510, 0)">
      <rect x="-35" y="-4" width="70" height="8" rx="4" fill="url(#stickEmerald)"/>
      <circle cx="35" cy="0" r="6" fill="url(#headEmerald)"/>
      <rect x="-4" y="-35" width="8" height="70" rx="4" fill="url(#stickEmerald)"/>
      <circle cx="0" cy="-35" r="6" fill="url(#headEmerald)"/>
    </g>

    <!-- 6. Roman 'I' (x = 610) -->
    <g transform="translate(610, -45)">
      <rect x="-4" y="0" width="8" height="90" rx="4" fill="url(#stickEmerald)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headEmerald)"/>
    </g>
  </g>

  <!-- Numerical Value Subtitles for Solution -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" text-anchor="middle">
    <text class="badge-emerald-text" x="155" y="375">11 (XI)</text>
    <text class="badge-emerald-text" x="290" y="375">=</text>
    <text class="badge-emerald-text" x="400" y="375">10 (X)</text>
    <text class="badge-emerald-text" x="510" y="375">+</text>
    <text class="badge-emerald-text" x="610" y="375">1 (I)</text>
  </g>

  <!-- Success Confirmation -->
  <text class="badge-emerald-text" x="420" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">✓ Đẳng thức đúng 100% mà không cần di chuyển bất kỳ que diêm nào!</text>
</svg>
