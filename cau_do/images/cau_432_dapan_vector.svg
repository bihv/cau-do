<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <pattern id="diagStripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="2.5"/>
    </pattern>
    <style><![CDATA[
      /* Transparent Canvas & Adaptive Dual-Mode Styling */
      .card-bg { fill: rgba(148, 163, 184, 0.05); stroke: #64748b; stroke-width: 1.2; }
      .cut-line { stroke: #0f172a; stroke-linecap: round; }
      .text-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .text-dim { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .text-body { fill: #334155; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
      
      .proof-card { fill: rgba(148, 163, 184, 0.06); stroke: #64748b; stroke-width: 1.2; }
      .proof-header-red { fill: rgba(239, 68, 68, 0.12); stroke: rgba(239, 68, 68, 0.3); stroke-width: 1; }
      .proof-header-green { fill: rgba(16, 185, 129, 0.12); stroke: rgba(16, 185, 129, 0.3); stroke-width: 1; }
      .header-green-text { fill: #065f46; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 800; }
      
      .formula-box { fill: rgba(16, 185, 129, 0.15); stroke: #10b981; stroke-width: 1.5; }
      .formula-text { fill: #059669; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 800; }

      @media (prefers-color-scheme: dark) {
        .card-bg { fill: rgba(30, 41, 59, 0.35); stroke: #475569; }
        .cut-line { stroke: #f8fafc; }
        .text-title { fill: #f8fafc; }
        .text-dim { fill: #94a3b8; }
        .text-body { fill: #cbd5e1; }
        
        .proof-card { fill: rgba(30, 41, 59, 0.45); stroke: #475569; }
        .proof-header-red { fill: rgba(239, 68, 68, 0.2); stroke: #ef4444; }
        .proof-header-green { fill: rgba(16, 185, 129, 0.2); stroke: #10b981; }
        .header-green-text { fill: #34d399; }
        .formula-box { fill: rgba(16, 185, 129, 0.25); stroke: #34d399; }
        .formula-text { fill: #34d399; }
      }
    ]]></style>
  </defs>

  <!-- Left: Reassembled Rectangle & The Missing Strip Demonstration -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Base card: transparent background with ample vertical space -->
    <rect x="0" y="0" width="360" height="350" rx="12" class="card-bg"/>

    <!-- Top Dimension Labels -->
    <text x="160" y="14" class="text-dim" font-size="13" text-anchor="middle">Chiều dài tưởng tượng = 25 cm</text>
    <line x1="300" y1="16" x2="326" y2="16" stroke="#dc2626" stroke-width="1.5"/>
    <text x="313" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">+ 1/23 cm</text>

    <!-- Nominal 25 x 23 rectangle -->
    <rect x="20" y="22" width="280" height="260" fill="rgba(59, 130, 246, 0.08)" stroke="#3b82f6" stroke-width="2" rx="4"/>

    <!-- Piece A area -->
    <polygon points="20,22 20,282 300,282" fill="rgba(59, 130, 246, 0.28)"/>
    <text x="100" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#2563eb">Mảnh A</text>

    <!-- Piece B area -->
    <polygon points="20,22 300,22 300,282" fill="rgba(16, 185, 129, 0.28)"/>
    <text x="210" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#059669">Mảnh B</text>

    <!-- Diagonal boundary -->
    <line x1="20" y1="22" x2="300" y2="282" stroke-width="2.5" class="cut-line"/>

    <!-- THE EXTRA STRIP of width 1/23 cm (Area = 1 cm²) -->
    <rect x="300" y="22" width="26" height="260" fill="url(#diagStripes)" stroke="#dc2626" stroke-width="2" rx="2"/>

    <!-- Strip callout directly under strip (Row 1) -->
    <line x1="300" y1="287" x2="326" y2="287" stroke="#dc2626" stroke-width="1.5"/>
    <text x="313" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle">+ 1/23 cm</text>

    <!-- Height label on left -->
    <text x="10" y="152" class="text-dim" font-size="13" text-anchor="middle" transform="rotate(-90 10 152)">23 cm</text>

    <!-- Total length bracket & label (Row 2 - completely separated from + 1/23 cm) -->
    <line x1="20" y1="314" x2="326" y2="314" stroke-width="1.5" class="cut-line"/>
    <line x1="20" y1="310" x2="20" y2="318" stroke-width="1.5" class="cut-line"/>
    <line x1="326" y1="310" x2="326" y2="318" stroke-width="1.5" class="cut-line"/>
    <text x="173" y="334" class="text-title" font-size="13" text-anchor="middle">Chiều dài thực = 24 + 24/23 = 25,0435 cm</text>
  </g>

  <!-- Right: Mathematical Proof & Logic Cards -->
  <g transform="translate(480, 50)">
    <!-- Card 1: Paradox Explained -->
    <g filter="url(#shadow)">
      <rect width="380" height="155" rx="12" class="proof-card"/>
      <rect width="380" height="38" rx="12" class="proof-header-red"/>
      <circle cx="24" cy="19" r="6" fill="#ef4444"/>
      <text x="40" y="24" class="text-title" font-size="14">VÌ SAO LẠI "MẤT" 1 CM²?</text>

      <text x="24" y="66" class="text-body" font-size="13">• Hình vuông ban đầu: 24 × 24 = 576 cm²</text>
      <text x="24" y="92" class="text-body" font-size="13">• Hình chữ nhật lầm tưởng: 25 × 23 = 575 cm²</text>
      <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#dc2626">• Sai số ảo giác: 576 − 575 = 1 cm²</text>
      <text x="24" y="140" class="text-dim" font-size="12" font-style="italic">→ Do lầm tưởng chiều dài cạnh đáy tròn trĩnh 25 cm!</text>
    </g>

    <!-- Card 2: Exact Mathematical Conservation -->
    <g transform="translate(0, 175)" filter="url(#shadow)">
      <rect width="380" height="235" rx="12" class="proof-card"/>
      <rect width="380" height="38" rx="12" class="proof-header-green"/>
      <circle cx="24" cy="19" r="6" fill="#10b981"/>
      <text x="40" y="24" class="header-green-text">BẢO TOÀN DIỆN TÍCH TUYỆT ĐỐI</text>

      <!-- Step 1 -->
      <text x="24" y="66" class="text-body" font-size="13">1. Độ dốc đường cắt ban đầu: tan θ = 24 / 23</text>
      
      <!-- Step 2 -->
      <text x="24" y="94" class="text-body" font-size="13">2. Khi trượt B lên 1 cm theo phương đứng:</text>
      <text x="40" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#2563eb">Độ trượt ngang = 1 × (24/23) = 24/23 cm</text>

      <!-- Step 3 -->
      <text x="24" y="146" class="text-body" font-size="13">3. Chiều dài thực tế của hình chữ nhật:</text>
      <text x="40" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#059669">L = 24 + 24/23 = 25 + 1/23 cm</text>

      <!-- Step 4 -->
      <rect x="24" y="184" width="332" height="38" rx="8" class="formula-box"/>
      <text x="190" y="208" class="formula-text" text-anchor="middle">S = 23 × (24 + 24/23) = 576 cm²</text>
    </g>
  </g>
</svg>