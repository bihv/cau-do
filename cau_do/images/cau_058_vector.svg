<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <filter id="board-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="success-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
    <filter id="target-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.55"/>
    </filter>
    <style><![CDATA[
      /* Universal Dual-Mode Styling: Seamless on both Light and Dark backgrounds */
      .matrix-bezel { fill: rgba(99, 102, 241, 0.04); stroke: #6366f1; stroke-width: 2.2; }
      .matrix-inner-frame { fill: rgba(148, 163, 184, 0.05); stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 3; }
      
      .cell-tile { fill: rgba(148, 163, 184, 0.08); stroke: #64748b; stroke-width: 1.5; }
      .cell-shaded { fill: rgba(100, 116, 139, 0.18); stroke: #64748b; stroke-width: 1.5; }
      .hatch-stroke { stroke: #64748b; }

      /* Dual-Contrast Shapes: Perfectly legible on both white and black */
      .shape-white { fill: #ffffff; stroke: #0f172a; stroke-width: 2.6; stroke-linejoin: round; }
      .shape-dark { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.8; stroke-linejoin: round; }
      .line-draw { stroke: #0284c7; stroke-width: 4.5; stroke-linecap: round; }

      /* Option Cards */
      .card-option { fill: rgba(148, 163, 184, 0.07); stroke: #64748b; stroke-width: 1.8; }
      .card-option-muted { fill: rgba(148, 163, 184, 0.03); stroke: #64748b; stroke-width: 1.2; opacity: 0.65; }
      .card-option-winner { fill: rgba(16, 185, 129, 0.14); stroke: #10b981; stroke-width: 2.8; }

      .badge-opt-bg { fill: rgba(99, 102, 241, 0.18); stroke: #6366f1; stroke-width: 1.2; }
      .badge-opt-text { fill: #6366f1; font-weight: 800; }
      .badge-muted-bg { fill: rgba(148, 163, 184, 0.12); stroke: #64748b; stroke-width: 1; }
      .badge-muted-text { fill: #94a3b8; font-weight: 700; }
      .badge-winner-bg { fill: #10b981; }
      .badge-winner-text { fill: #ffffff; font-weight: 800; }

      .target-empty-bg { fill: rgba(245, 158, 11, 0.09); stroke: #f59e0b; stroke-width: 2.8; stroke-dasharray: 6 4; }
      .target-empty-text { fill: #f59e0b; font-weight: 800; font-size: 46px; }
      .target-solved-bg { fill: rgba(16, 185, 129, 0.14); stroke: #10b981; stroke-width: 2.8; }
    ]]></style>
  </defs>

  <!-- LEFT 3x3 MATRIX CONTAINER (TRANSPARENT OUTLINED STRUCTURE - NO SOLID BACKGROUND) -->
  <g filter="url(#board-shadow)">
    <!-- Thin Indigo Structural Outline (fill=none) -->
    <rect x="52" y="47" width="364" height="364" rx="18" fill="none" stroke="#6366f1" stroke-width="2"/>

    <!-- Row 1 -->
    <g>
      <rect x="64" y="59" width="108" height="108" rx="12" class="cell-tile"/>
      <line x1="84" y1="147" x2="152" y2="79" class="line-draw"/>
    </g>
    <g>
      <rect x="180" y="59" width="108" height="108" rx="12" class="cell-tile"/>
      <line x1="200" y1="79" x2="268" y2="147" class="line-draw"/>
    </g>
    <g>
      <rect x="296" y="59" width="108" height="108" rx="12" class="cell-tile"/>
      <line x1="316" y1="113" x2="384" y2="113" class="line-draw"/>
    </g>

    <!-- Row 2 -->
    <g>
      <rect x="64" y="175" width="108" height="108" rx="12" class="cell-tile"/>
      <line x1="84" y1="195" x2="152" y2="263" class="line-draw"/>
    </g>
    <g>
      <rect x="180" y="175" width="108" height="108" rx="12" class="cell-tile"/>
      <line x1="200" y1="263" x2="268" y2="195" class="line-draw"/>
    </g>
    <g>
      <rect x="296" y="175" width="108" height="108" rx="12" class="cell-tile"/>
      <line x1="350" y1="195" x2="350" y2="263" class="line-draw"/>
    </g>

    <!-- Row 3 -->
    <g>
      <rect x="64" y="291" width="108" height="108" rx="12" class="cell-tile"/>
      <line x1="84" y1="345" x2="152" y2="345" class="line-draw"/>
    </g>
    <g>
      <rect x="180" y="291" width="108" height="108" rx="12" class="cell-tile"/>
      <line x1="234" y1="311" x2="234" y2="379" class="line-draw"/>
    </g>
    <!-- Cell (3,3): TARGET EMPTY CELL (Question Mark) -->
    <g filter="url(#target-glow)">
      <rect x="296" y="291" width="108" height="108" rx="12" class="target-empty-bg"/>
      <text x="350" y="347" font-family="-apple-system, sans-serif" class="target-empty-text" text-anchor="middle" dominant-baseline="central">?</text>
    </g>
  </g>

  <!-- RIGHT OPTIONS -->
  <g>
    <!-- OPTION A -->
    <g class="card-option" filter="url(#card-shadow)">
      <rect x="460" y="65" width="140" height="120" rx="14"/>
      <circle cx="492" cy="125" r="16" class="badge-opt-bg"/>
      <text x="492" y="125" font-family="-apple-system, sans-serif" font-size="20" class="badge-opt-text" text-anchor="middle" dominant-baseline="central">A</text>
      <line x1="535" y1="95" x2="575" y2="155" class="line-draw"/>
    </g>
    <!-- OPTION B -->
    <g class="card-option" filter="url(#card-shadow)">
      <rect x="630" y="65" width="140" height="120" rx="14"/>
      <line x1="685" y1="155" x2="725" y2="95" class="line-draw"/>
      <circle cx="738" cy="125" r="16" class="badge-opt-bg"/>
      <text x="738" y="125" font-family="-apple-system, sans-serif" font-size="20" class="badge-opt-text" text-anchor="middle" dominant-baseline="central">B</text>
    </g>
    <!-- OPTION C -->
    <g class="card-option" filter="url(#card-shadow)">
      <rect x="460" y="250" width="140" height="120" rx="14"/>
      <circle cx="492" cy="310" r="16" class="badge-opt-bg"/>
      <text x="492" y="310" font-family="-apple-system, sans-serif" font-size="20" class="badge-opt-text" text-anchor="middle" dominant-baseline="central">C</text>
      <line x1="525" y1="310" x2="585" y2="310" class="line-draw"/>
    </g>
    <!-- OPTION D -->
    <g class="card-option" filter="url(#card-shadow)">
      <rect x="630" y="250" width="140" height="120" rx="14"/>
      <line x1="695" y1="280" x2="695" y2="340" class="line-draw"/>
      <circle cx="738" cy="310" r="16" class="badge-opt-bg"/>
      <text x="738" y="310" font-family="-apple-system, sans-serif" font-size="20" class="badge-opt-text" text-anchor="middle" dominant-baseline="central">D</text>
    </g>
  </g>
</svg>