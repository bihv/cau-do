<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="112%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="holePattern" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ef4444" stroke-width="2"/>
    </pattern>
    <style><![CDATA[
      .grid-bg { fill: rgba(148, 163, 184, 0.05); stroke: #64748b; stroke-width: 1.5; }
      .grid-line { stroke: rgba(148, 163, 184, 0.45); stroke-width: 0.85; }
      .cut-line { stroke: #0f172a; stroke-width: 2.6; stroke-linecap: round; }
      .border-line { stroke: #6366f1; stroke-width: 2.2; fill: none; }
      
      .proof-card { fill: rgba(148, 163, 184, 0.07); stroke: #64748b; stroke-width: 1.6; }
      .proof-badge { fill: rgba(16, 185, 129, 0.15); stroke: #10b981; stroke-width: 1.5; }
    ]]></style>
  </defs>

  <!-- LEFT: FIGURE B WITH HOLE -->
  <g transform="translate(40, 45)" filter="url(#shadow)">
    <text x="130.0" y="-16" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#ef4444" text-anchor="middle">
      Hình B (Khuyết −2)
    </text>

    <rect width="260.0" height="312.0" rx="8" class="grid-bg"/>

    <polygon points="130.0,0 130.0,182.0 52.0,182.0" fill="rgba(59, 130, 246, 0.28)" stroke="#3b82f6" stroke-width="1.8"/>
    <polygon points="130.0,0 130.0,182.0 208.0,182.0" fill="rgba(59, 130, 246, 0.28)" stroke="#3b82f6" stroke-width="1.8"/>
    <polygon points="52.0,182.0 52.0,312.0 0,312.0" fill="rgba(16, 185, 129, 0.28)" stroke="#10b981" stroke-width="1.8"/>
    <polygon points="208.0,182.0 208.0,312.0 260.0,312.0" fill="rgba(16, 185, 129, 0.28)" stroke="#10b981" stroke-width="1.8"/>
    <polygon points="104.0,182.0 208.0,182.0 208.0,312.0 156.0,312.0 156.0,234.0 104.0,234.0" fill="rgba(245, 158, 11, 0.28)" stroke="#f59e0b" stroke-width="1.8"/>
    <polygon points="52.0,182.0 104.0,182.0 104.0,260.0 156.0,260.0 156.0,312.0 52.0,312.0" fill="rgba(139, 92, 246, 0.28)" stroke="#8b5cf6" stroke-width="1.8"/>

    <rect x="104.0" y="234.0" width="52.0" height="26.0" fill="rgba(239, 68, 68, 0.3)" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="104.0" y="234.0" width="52.0" height="26.0" fill="url(#holePattern)"/>
    <text x="130.0" y="252.2" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#ef4444" text-anchor="middle">−2</text>

    <!-- Correct local grid lines -->
    <g class="grid-line">
      <line x1="0.0" y1="0" x2="0.0" y2="312.0"/>
      <line x1="26.0" y1="0" x2="26.0" y2="312.0"/>
      <line x1="52.0" y1="0" x2="52.0" y2="312.0"/>
      <line x1="78.0" y1="0" x2="78.0" y2="312.0"/>
      <line x1="104.0" y1="0" x2="104.0" y2="312.0"/>
      <line x1="130.0" y1="0" x2="130.0" y2="312.0"/>
      <line x1="156.0" y1="0" x2="156.0" y2="312.0"/>
      <line x1="182.0" y1="0" x2="182.0" y2="312.0"/>
      <line x1="208.0" y1="0" x2="208.0" y2="312.0"/>
      <line x1="234.0" y1="0" x2="234.0" y2="312.0"/>
      <line x1="260.0" y1="0" x2="260.0" y2="312.0"/>
      <line x1="0" y1="0.0" x2="260.0" y2="0.0"/>
      <line x1="0" y1="26.0" x2="260.0" y2="26.0"/>
      <line x1="0" y1="52.0" x2="260.0" y2="52.0"/>
      <line x1="0" y1="78.0" x2="260.0" y2="78.0"/>
      <line x1="0" y1="104.0" x2="260.0" y2="104.0"/>
      <line x1="0" y1="130.0" x2="260.0" y2="130.0"/>
      <line x1="0" y1="156.0" x2="260.0" y2="156.0"/>
      <line x1="0" y1="182.0" x2="260.0" y2="182.0"/>
      <line x1="0" y1="208.0" x2="260.0" y2="208.0"/>
      <line x1="0" y1="234.0" x2="260.0" y2="234.0"/>
      <line x1="0" y1="260.0" x2="260.0" y2="260.0"/>
      <line x1="0" y1="286.0" x2="260.0" y2="286.0"/>
      <line x1="0" y1="312.0" x2="260.0" y2="312.0"/>
    </g>

    <rect width="260.0" height="312.0" rx="8" class="border-line"/>

    <g transform="translate(130.0, 338.0)">
      <rect x="-44" y="-13" width="88" height="26" rx="13" fill="#ef4444"/>
      <text y="5" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">ΔS = −2</text>
    </g>
  </g>

  <!-- RIGHT: SLOPE PROOF CARD -->
  <g transform="translate(360, 45)" filter="url(#shadow)">
    <rect width="400" height="320" rx="16" class="proof-card"/>
    <rect width="400" height="40" rx="16" class="proof-badge"/>
    <circle cx="24" cy="20" r="7" fill="#10b981"/>
    <text x="42" y="25" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#10b981">CHỨNG MINH NGHỊCH LÝ: ΔS = −2</text>

    <g transform="translate(20, 60)" font-family="-apple-system, sans-serif">
      <text x="0" y="20" font-size="13" font-weight="800" fill="#94a3b8">So sánh độ dốc (hệ số góc):</text>
      <text x="10" y="46" font-size="12.5" font-weight="800" fill="#10b981">• Tam giác 2 × 5: hệ số góc = 5 / 2 = 2,500</text>
      <text x="10" y="72" font-size="12.5" font-weight="800" fill="#3b82f6">• Tam giác 3 × 7: hệ số góc = 7 / 3 ≈ 2,333</text>
      <text x="10" y="98" font-size="12" font-weight="700" fill="#ef4444">• 2,500 ≠ 2,333 ⟹ Cạnh huyền bị gãy khúc</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="360" height="50" rx="10" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1.8"/>
      <text x="180" y="20" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#ef4444" text-anchor="middle">Lỗ hổng khuyết bên trong:</text>
      <text x="180" y="39" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="900" fill="#ef4444" text-anchor="middle">Diện tích khuyết = −2 đơn vị²</text>
    </g>

    <g transform="translate(20, 248)">
      <rect width="360" height="48" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.5"/>
      <text x="180" y="19" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#10b981" text-anchor="middle">Bảo toàn diện tích thực tế:</text>
      <text x="180" y="38" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="900" fill="#10b981" text-anchor="middle">Phần phình cong ra ngoài = 2 đơn vị²</text>
    </g>
  </g>
</svg>