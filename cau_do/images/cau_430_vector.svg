<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="112%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style><![CDATA[
      .grid-bg { fill: rgba(148, 163, 184, 0.05); stroke: #64748b; stroke-width: 1.5; }
      .grid-line { stroke: rgba(148, 163, 184, 0.45); stroke-width: 0.85; }
      .cut-line { stroke: #0f172a; stroke-width: 2.6; stroke-linecap: round; }
      
      .proof-card { fill: rgba(148, 163, 184, 0.07); stroke: #64748b; stroke-width: 1.6; }
      .proof-badge { fill: rgba(16, 185, 129, 0.15); stroke: #10b981; stroke-width: 1.5; }
    ]]></style>
  </defs>

  <!-- ==================== LEFT: 8x8 GRID (S = 64) ==================== -->
  <g id="grid_8x8" filter="url(#shadow)">
    <text x="154.0" y="52.0" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#6366f1" text-anchor="middle">
      8 × 8 = 64
    </text>

    <rect x="50.0" y="70.0" width="208.0" height="208.0" class="grid-bg"/>

    <!-- Pieces Fills -->
    <polygon points="50.0,70.0 258.0,148.0 50.0,148.0"
             fill="rgba(245, 158, 11, 0.28)" stroke="#f59e0b" stroke-width="1.8"/>
    <polygon points="50.0,70.0 258.0,70.0 258.0,148.0"
             fill="rgba(139, 92, 246, 0.28)" stroke="#8b5cf6" stroke-width="1.8"/>
    <polygon points="50.0,148.0 180.0,148.0 128.0,278.0 50.0,278.0"
             fill="rgba(59, 130, 246, 0.28)" stroke="#3b82f6" stroke-width="1.8"/>
    <polygon points="180.0,148.0 258.0,148.0 258.0,278.0 128.0,278.0"
             fill="rgba(16, 185, 129, 0.28)" stroke="#10b981" stroke-width="1.8"/>

    <!-- Square Grid Lines -->
    <g class="grid-line">
      <line x1="50.0" y1="70.0" x2="50.0" y2="278.0"/>
      <line x1="76.0" y1="70.0" x2="76.0" y2="278.0"/>
      <line x1="102.0" y1="70.0" x2="102.0" y2="278.0"/>
      <line x1="128.0" y1="70.0" x2="128.0" y2="278.0"/>
      <line x1="154.0" y1="70.0" x2="154.0" y2="278.0"/>
      <line x1="180.0" y1="70.0" x2="180.0" y2="278.0"/>
      <line x1="206.0" y1="70.0" x2="206.0" y2="278.0"/>
      <line x1="232.0" y1="70.0" x2="232.0" y2="278.0"/>
      <line x1="258.0" y1="70.0" x2="258.0" y2="278.0"/>
      <line x1="50.0" y1="70.0" x2="258.0" y2="70.0"/>
      <line x1="50.0" y1="96.0" x2="258.0" y2="96.0"/>
      <line x1="50.0" y1="122.0" x2="258.0" y2="122.0"/>
      <line x1="50.0" y1="148.0" x2="258.0" y2="148.0"/>
      <line x1="50.0" y1="174.0" x2="258.0" y2="174.0"/>
      <line x1="50.0" y1="200.0" x2="258.0" y2="200.0"/>
      <line x1="50.0" y1="226.0" x2="258.0" y2="226.0"/>
      <line x1="50.0" y1="252.0" x2="258.0" y2="252.0"/>
      <line x1="50.0" y1="278.0" x2="258.0" y2="278.0"/>
    </g>

    <!-- Thick Cut Lines -->
    <line x1="50.0" y1="148.0" x2="258.0" y2="148.0" class="cut-line"/>
    <line x1="50.0" y1="70.0" x2="258.0" y2="148.0" class="cut-line"/>
    <line x1="180.0" y1="148.0" x2="128.0" y2="278.0" class="cut-line"/>

    <!-- Badges -->
    <g transform="translate(120.2, 122.0)">
      <circle r="12" fill="#f59e0b"/><text y="4" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    </g>
    <g transform="translate(187.79999999999998, 96.0)">
      <circle r="12" fill="#8b5cf6"/><text y="4" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
    </g>
    <g transform="translate(104.6, 213.0)">
      <circle r="12" fill="#3b82f6"/><text y="4" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    </g>
    <g transform="translate(203.4, 213.0)">
      <circle r="12" fill="#10b981"/><text y="4" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    </g>
  </g>

  <!-- Transition Arrow -->
  <g transform="translate(315, 174)">
    <circle cx="0" cy="0" r="18" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M -5,-6 L 3,0 L -5,6" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== RIGHT: 5x13 GRID (S = 65 ?) ==================== -->
  <g id="grid_5x13" filter="url(#shadow)">
    <text x="536.0" y="96.0" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#f59e0b" text-anchor="middle">
      5 × 13 = 65 (?)
    </text>

    <rect x="380.0" y="114.0" width="312.0" height="120.0" class="grid-bg"/>

    <!-- Reassembled Pieces Fills -->
    <polygon points="380.0,114.0 500.0,162.0 500.0,234.0 380.0,234.0"
             fill="rgba(59, 130, 246, 0.28)" stroke="#3b82f6" stroke-width="1.8"/>
    <polygon points="500.0,162.0 692.0,234.0 500.0,234.0"
             fill="rgba(139, 92, 246, 0.28)" stroke="#8b5cf6" stroke-width="1.8"/>
    <polygon points="380.0,114.0 572.0,114.0 572.0,186.0"
             fill="rgba(245, 158, 11, 0.28)" stroke="#f59e0b" stroke-width="1.8"/>
    <polygon points="572.0,114.0 692.0,114.0 692.0,234.0 572.0,186.0"
             fill="rgba(16, 185, 129, 0.28)" stroke="#10b981" stroke-width="1.8"/>

    <!-- Square Grid Lines -->
    <g class="grid-line">
      <line x1="380.0" y1="114.0" x2="380.0" y2="234.0"/>
      <line x1="404.0" y1="114.0" x2="404.0" y2="234.0"/>
      <line x1="428.0" y1="114.0" x2="428.0" y2="234.0"/>
      <line x1="452.0" y1="114.0" x2="452.0" y2="234.0"/>
      <line x1="476.0" y1="114.0" x2="476.0" y2="234.0"/>
      <line x1="500.0" y1="114.0" x2="500.0" y2="234.0"/>
      <line x1="524.0" y1="114.0" x2="524.0" y2="234.0"/>
      <line x1="548.0" y1="114.0" x2="548.0" y2="234.0"/>
      <line x1="572.0" y1="114.0" x2="572.0" y2="234.0"/>
      <line x1="596.0" y1="114.0" x2="596.0" y2="234.0"/>
      <line x1="620.0" y1="114.0" x2="620.0" y2="234.0"/>
      <line x1="644.0" y1="114.0" x2="644.0" y2="234.0"/>
      <line x1="668.0" y1="114.0" x2="668.0" y2="234.0"/>
      <line x1="692.0" y1="114.0" x2="692.0" y2="234.0"/>
      <line x1="380.0" y1="114.0" x2="692.0" y2="114.0"/>
      <line x1="380.0" y1="138.0" x2="692.0" y2="138.0"/>
      <line x1="380.0" y1="162.0" x2="692.0" y2="162.0"/>
      <line x1="380.0" y1="186.0" x2="692.0" y2="186.0"/>
      <line x1="380.0" y1="210.0" x2="692.0" y2="210.0"/>
      <line x1="380.0" y1="234.0" x2="692.0" y2="234.0"/>
    </g>

    <!-- Cut lines representing boundary between pieces in apparent straight assembly -->
    <line x1="380.0" y1="114.0" x2="692.0" y2="234.0" class="cut-line" stroke-width="2.8"/>
    <line x1="500.0" y1="162.0" x2="500.0" y2="234.0" class="cut-line"/>
    <line x1="572.0" y1="114.0" x2="572.0" y2="186.0" class="cut-line"/>

    <!-- Badges -->
    <g transform="translate(428.0, 193.2)">
      <circle r="12" fill="#3b82f6"/><text y="4" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    </g>
    <g transform="translate(507.2, 142.8)">
      <circle r="12" fill="#f59e0b"/><text y="4" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    </g>
    <g transform="translate(564.8, 214.8)">
      <circle r="12" fill="#8b5cf6"/><text y="4" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
    </g>
    <g transform="translate(644.0, 159.6)">
      <circle r="12" fill="#10b981"/><text y="4" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    </g>
  </g>

  <g transform="translate(536.0, 279.0)">
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.8"/>
    <text y="5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#f59e0b" text-anchor="middle">
      64 = 65 ? (ΔS = +1)
    </text>
  </g>
</svg>