<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Light theme default */
      .card-box { fill: #ffffff; stroke: #cbd5e1; }
      .card-text-primary { fill: #0f172a; }
      .card-text-secondary { fill: #64748b; }
      .badge-rose { fill: #fff1f2; stroke: #fda4af; }
      .badge-rose-text { fill: #be123c; }
      .math-note { fill: #64748b; }

      /* Dark theme */
      @media (prefers-color-scheme: dark) {
        .card-box { fill: #1e293b; stroke: #475569; }
        .card-text-primary { fill: #f8fafc; }
        .card-text-secondary { fill: #94a3b8; }
        .badge-rose { fill: #4c0519; stroke: #f43f5e; }
        .badge-rose-text { fill: #fecdd3; }
        .math-note { fill: #94a3b8; }
      }
    ]]></style>

    <!-- Matchstick Drop Shadow -->
    <filter id="stickShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>

    <!-- Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Red Sulfur Head Gradient -->
    <radialGradient id="headGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Top Badge: Challenge Title -->
  <g transform="translate(400, 45)">
    <rect class="badge-rose" x="-220" y="-18" width="440" height="36" rx="18" stroke-width="1.5"/>
    <text class="badge-rose-text" x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Biểu thức que diêm sai: 1 + 10 = 9 (Cần sửa ít lần nhất)</text>
  </g>

  <!-- MATCHSTICK EQUATION: I + X = IX -->
  <!-- Center Y = 190. Match length = 90, thickness = 8 -->
  <g transform="translate(0, 190)" filter="url(#stickShadow)">

    <!-- 1. Roman 'I' (x = 120) -->
    <!-- Vertical match: from (120, -45) to (120, 45) -->
    <g transform="translate(120, -45)">
      <rect x="-4" y="0" width="8" height="90" rx="4" fill="url(#woodGrad)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headGrad)"/>
    </g>

    <!-- 2. Plus Sign '+' (x = 220) -->
    <!-- Horizontal match: length = 70 -->
    <g transform="translate(220, 0)">
      <rect x="-35" y="-4" width="70" height="8" rx="4" fill="url(#woodGrad)"/>
      <circle cx="35" cy="0" r="6" fill="url(#headGrad)"/>
      <!-- Vertical match: length = 70 -->
      <rect x="-4" y="-35" width="8" height="70" rx="4" fill="url(#woodGrad)"/>
      <circle cx="0" cy="-35" r="6" fill="url(#headGrad)"/>
    </g>

    <!-- 3. Roman 'X' (x = 330) -->
    <!-- Diagonal 1 (-45 deg): len = 100 -->
    <g transform="translate(330, -35) rotate(45)">
      <rect x="-4" y="0" width="8" height="100" rx="4" fill="url(#woodGrad)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headGrad)"/>
    </g>
    <!-- Diagonal 2 (+45 deg): len = 100 -->
    <g transform="translate(330, 35) rotate(-45)">
      <rect x="-4" y="-100" width="8" height="100" rx="4" fill="url(#woodGrad)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headGrad)"/>
    </g>

    <!-- 4. Equal Sign '=' (x = 460) -->
    <g transform="translate(460, 0)">
      <!-- Top bar -->
      <rect x="-30" y="-16" width="60" height="8" rx="4" fill="url(#woodGrad)"/>
      <circle cx="30" cy="-12" r="6" fill="url(#headGrad)"/>
      <!-- Bottom bar -->
      <rect x="-30" y="8" width="60" height="8" rx="4" fill="url(#woodGrad)"/>
      <circle cx="30" cy="12" r="6" fill="url(#headGrad)"/>
    </g>

    <!-- 5. Roman 'I' (x = 570) -->
    <g transform="translate(570, -45)">
      <rect x="-4" y="0" width="8" height="90" rx="4" fill="url(#woodGrad)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headGrad)"/>
    </g>

    <!-- 6. Roman 'X' (x = 670) -->
    <g transform="translate(670, -35) rotate(45)">
      <rect x="-4" y="0" width="8" height="100" rx="4" fill="url(#woodGrad)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headGrad)"/>
    </g>
    <g transform="translate(670, 35) rotate(-45)">
      <rect x="-4" y="-100" width="8" height="100" rx="4" fill="url(#woodGrad)"/>
      <circle cx="0" cy="0" r="6" fill="url(#headGrad)"/>
    </g>
  </g>

  <!-- Numerical Value Subtitles -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text class="math-note" x="120" y="290">1</text>
    <text class="math-note" x="220" y="290">+</text>
    <text class="math-note" x="330" y="290">10</text>
    <text class="badge-rose-text" x="460" y="290">≠</text>
    <text class="math-note" x="620" y="290">9</text>
  </g>

  <!-- Bottom Question -->
  <text class="card-text-primary" x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Cần di chuyển ít nhất bao nhiêu que diêm để biểu thức trở nên đúng?</text>

</svg>
