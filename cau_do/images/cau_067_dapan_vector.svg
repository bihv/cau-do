        <polygon points="358.0,65.0 394.0,93.0 394.0,165.0 358.0,137.0" fill="url(#right-fill)" stroke="#475569" stroke-width="2.0" stroke-linejoin="round"/>
        <polygon points="286.0,65.0 358.0,65.0 358.0,137.0 286.0,137.0" fill="url(#front-fill)" stroke="#334155" stroke-width="2.0" stroke-linejoin="round"/>
        <polygon points="304.4,141.4 316.4,141.4 322.4,146.1 310.4,146.1" fill="#f8fafc"/>
        <polygon points="331.0,148.7 343.0,148.7 349.0,153.3 337.0,153.3" fill="#f8fafc"/>
