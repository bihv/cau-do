<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 45 520 230" width="100%" height="100%">
  <defs>
    <!-- Long Rod Gradient (Indigo/Cyan) -->
    <linearGradient id="longRodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Short Rod Gradient (Amber/Orange) -->
    <linearGradient id="shortRodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Rod Shadow -->
    <filter id="rodShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 4 Long Rods (Length 2a = 180px, width 8px, y from 70 to 250) -->
  <g filter="url(#rodShadow)">
    <rect x="130" y="70" width="8" height="180" rx="4" fill="url(#longRodGrad)" stroke="#0284c7" stroke-width="0.5"/>
    <rect x="180" y="70" width="8" height="180" rx="4" fill="url(#longRodGrad)" stroke="#0284c7" stroke-width="0.5"/>
    <rect x="230" y="70" width="8" height="180" rx="4" fill="url(#longRodGrad)" stroke="#0284c7" stroke-width="0.5"/>
    <rect x="280" y="70" width="8" height="180" rx="4" fill="url(#longRodGrad)" stroke="#0284c7" stroke-width="0.5"/>
  </g>

  <!-- 4 Short Rods (Length a = 90px, width 8px, y from 160 to 250) -->
  <g filter="url(#rodShadow)">
    <rect x="430" y="160" width="8" height="90" rx="4" fill="url(#shortRodGrad)" stroke="#d97706" stroke-width="0.5"/>
    <rect x="480" y="160" width="8" height="90" rx="4" fill="url(#shortRodGrad)" stroke="#d97706" stroke-width="0.5"/>
    <rect x="530" y="160" width="8" height="90" rx="4" fill="url(#shortRodGrad)" stroke="#d97706" stroke-width="0.5"/>
    <rect x="580" y="160" width="8" height="90" rx="4" fill="url(#shortRodGrad)" stroke="#d97706" stroke-width="0.5"/>
  </g>
</svg>