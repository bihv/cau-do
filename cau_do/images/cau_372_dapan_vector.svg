      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="board-bezel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d11"/>
      <stop offset="50%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#120602"/>
    </linearGradient>
