<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Light theme default */
      .acrobat-head { fill: #1e293b; }
      .acrobat-body { stroke: #1e293b; fill: none; }
      .acrobat-shoulder { stroke: #2563eb; fill: none; }
      .acrobat-joint { fill: #2563eb; }
      .floor-line { stroke: #94a3b8; }
      .floor-ground { fill: #f1f5f9; }
      .tier-badge { fill: #f8fafc; stroke: #cbd5e1; }
      .tier-text { fill: #475569; }
      .tier-count { fill: #2563eb; }

      /* Dark theme */
      @media (prefers-color-scheme: dark) {
        .acrobat-head { fill: #60a5fa; }
        .acrobat-body { stroke: #3b82f6; fill: none; }
        .acrobat-shoulder { stroke: #60a5fa; fill: none; }
        .acrobat-joint { fill: #93c5fd; }
        .floor-line { stroke: #475569; }
        .floor-ground { fill: #1e293b; }
        .tier-badge { fill: #1e293b; stroke: #334155; }
        .tier-text { fill: #94a3b8; }
        .tier-count { fill: #93c5fd; }
      }
    ]]></style>

    <!-- Shadow filter (objectBoundingBox) -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Reusable Acrobat Symbol: Center origin (0, 0) at neck/torso top -->
    <!-- Head center at (0, -20), r=12. Torso from (0, -8) to (0, 24).
         Shoulders from (-26, -4) to (26, -4).
         Left leg from (0, 24) to (-24, 60). Right leg from (0, 24) to (24, 60). -->
    <g id="acrobat">
      <!-- Head -->
      <circle class="acrobat-head" cx="0" cy="-22" r="12"/>
      <!-- Torso -->
      <line class="acrobat-body" x1="0" y1="-10" x2="0" y2="24" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Shoulders (Platform for feet of acrobat above) -->
      <line class="acrobat-shoulder" x1="-28" y1="-4" x2="28" y2="-4" stroke-width="5" stroke-linecap="round"/>
      <!-- Shoulder contact points -->
      <circle class="acrobat-joint" cx="-24" cy="-4" r="3.5"/>
      <circle class="acrobat-joint" cx="24" cy="-4" r="3.5"/>
      <!-- Legs -->
      <line class="acrobat-body" x1="0" y1="24" x2="-24" y2="60" stroke-width="4.5" stroke-linecap="round"/>
      <line class="acrobat-body" x1="0" y1="24" x2="24" y2="60" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Tier Labels on Left -->
  <g transform="translate(60, 0)">
    <!-- Tier 4 -->
    <g transform="translate(0, 95)">
      <rect class="tier-badge" x="0" y="-16" width="130" height="32" rx="8" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text class="tier-text" x="15" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Tầng 4</text>
      <text class="tier-count" x="115" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="end">(1 người)</text>
    </g>
    <!-- Tier 3 -->
    <g transform="translate(0, 185)">
      <rect class="tier-badge" x="0" y="-16" width="130" height="32" rx="8" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text class="tier-text" x="15" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Tầng 3</text>
      <text class="tier-count" x="115" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="end">(2 người)</text>
    </g>
    <!-- Tier 2 -->
    <g transform="translate(0, 275)">
      <rect class="tier-badge" x="0" y="-16" width="130" height="32" rx="8" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text class="tier-text" x="15" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Tầng 2</text>
      <text class="tier-count" x="115" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="end">(3 người)</text>
    </g>
    <!-- Tier 1 -->
    <g transform="translate(0, 365)">
      <rect class="tier-badge" x="0" y="-16" width="130" height="32" rx="8" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text class="tier-text" x="15" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Tầng 1 (Đất)</text>
      <text class="tier-count" x="115" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="end">(4 người)</text>
    </g>
  </g>

  <!-- Ground Floor Line (y = 425) -->
  <line class="floor-line" x1="220" y1="425" x2="740" y2="425" stroke-width="3" stroke-linecap="round"/>

  <!-- ACROBAT PYRAMID -->
  <!--
    Level spacing: dy = 90
    Level 1 (Ground): y = 365. Acrobat feet reach 365 + 60 = 425 (Ground).
    Shoulders at 365 - 4 = 361.
    Acrobat spacing: dx = 100
    Level 1 center X: 330, 430, 530, 630.
    Level 2 (y = 275): feet reach 275 + 60 = 335 -> 361.
    Level 2 centers: 380, 480, 580.
      Feet of 380: left = 380 - 24 = 356 (rests on 330 right shoulder: 330+24 = 354!)
                   right = 380 + 24 = 404 (rests on 430 left shoulder: 430-24 = 406!)
      Feet of 480: left = 480 - 24 = 456 (rests on 430 right shoulder: 430+24 = 454!)
                   right = 480 + 24 = 504 (rests on 530 left shoulder: 530-24 = 506!)
      Feet of 580: left = 580 - 24 = 556 (rests on 530 right shoulder: 530+24 = 554!)
                   right = 580 + 24 = 604 (rests on 630 left shoulder: 630-24 = 606!)
    Level 3 (y = 185): centers 430, 530.
      Feet of 430: left = 406 (rests on 380 right: 404), right = 454 (rests on 480 left: 456)
      Feet of 530: left = 506 (rests on 480 right: 504), right = 604 (rests on 580 left: 556 -> wait, 530-24=506, 530+24=554)
    Level 4 (y = 95): center 480.
      Feet of 480: left = 456 (rests on 430 right: 454), right = 504 (rests on 530 left: 506).
  -->

  <!-- TẦNG 1 (4 người) -->
  <use href="#acrobat" x="330" y="365"/>
  <use href="#acrobat" x="430" y="365"/>
  <use href="#acrobat" x="530" y="365"/>
  <use href="#acrobat" x="630" y="365"/>

  <!-- TẦNG 2 (3 người) -->
  <use href="#acrobat" x="380" y="275"/>
  <use href="#acrobat" x="480" y="275"/>
  <use href="#acrobat" x="580" y="275"/>

  <!-- TẦNG 3 (2 người) -->
  <use href="#acrobat" x="430" y="185"/>
  <use href="#acrobat" x="530" y="185"/>

  <!-- TẦNG 4 (1 người) -->
  <use href="#acrobat" x="480" y="95"/>

</svg>
