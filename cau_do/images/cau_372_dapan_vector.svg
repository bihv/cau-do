                <style><![CDATA[
      /* Light theme: Classic Luxury Wood Sudoku Board */
      .board-bezel { fill: url(#board-bezel-light); stroke: #3b1402; stroke-width: 2.5; }
      .grid-base { fill: #fdf8eb; stroke: #78350f; }
      .diag-cell { fill: #fde68a; opacity: 0.65; }
      .line-thin { stroke: #a16207; stroke-width: 1; opacity: 0.45; }
      .line-thick { stroke: #78350f; stroke-width: 2.5; }
      .num-given { fill: #0f172a; font-weight: 800; }
      .num-solution { fill: #047857; font-weight: 800; }

      /* Dark theme: Midnight Ebony & Smoked Rosewood */
      @media (prefers-color-scheme: dark) {
        .board-bezel { fill: url(#board-bezel-dark); stroke: #5a2810; stroke-width: 2.5; }
        .grid-base { fill: #2d180c; stroke: #5a2810; }
        .diag-cell { fill: #451a03; opacity: 0.9; }
        .line-thin { stroke: #120703; stroke-width: 1; opacity: 0.85; }
        .line-thick { stroke: #854d0e; stroke-width: 2.5; }
        .num-given { fill: #f8fafc; font-weight: 800; }
        .num-solution { fill: #34d399; font-weight: 800; }
      }
    ]]></style>
        <!-- Wood Board Gradients -->
    <linearGradient id="board-bezel-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
