<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Card Shadow (objectBoundingBox) -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Coin Drop Shadow (objectBoundingBox) -->
    <filter id="coinShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>

    <!-- Coin Outer Rim Gradient (Gold/Bronze Metallic) -->
    <linearGradient id="coinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Coin Face Radial Gradient -->
    <radialGradient id="coinFace" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Intersection Center: (400, 225) -->
  <!-- Coin Macro: 32px radius -->

  <!-- Guide Lines for Row & Column -->
  <line x1="400" y1="75" x2="400" y2="375" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="250" y1="225" x2="485" y2="225" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 8 COINS -->
  <!-- Vertical Column: 5 coins at y = 97, 161, 225, 289, 353 (step = 64) -->
  <!-- Horizontal Row: 4 coins at x = 272, 336, 400, 464 (step = 64) -->

  <!-- Helper definition for 1 Coin -->
  <!-- We render each coin directly for full control -->

  <!-- 1. V1 (Top): (400, 97) -->
  <g transform="translate(400, 97)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 2. V2: (400, 161) -->
  <g transform="translate(400, 161)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 3. H1 (Leftmost): (272, 225) -->
  <g transform="translate(272, 225)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 4. H2: (336, 225) -->
  <g transform="translate(336, 225)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 5. CENTER (Intersection: V3 / H3): (400, 225) -->
  <g transform="translate(400, 225)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 6. H4 (Rightmost): (464, 225) -->
  <g transform="translate(464, 225)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 7. V4: (400, 289) -->
  <g transform="translate(400, 289)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 8. V5 (Bottom): (400, 353) -->
  <g transform="translate(400, 353)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- Dimension / Count Indicators -->
  <!-- Vertical Count Badge: 5 coins -->
  <g transform="translate(480, 97)">
    <rect x="0" y="0" width="115" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Hàng dọc: 5 xu</text>
  </g>

  <!-- Horizontal Count Badge: 4 coins -->
  <g transform="translate(130, 260)">
    <rect x="0" y="0" width="125" height="32" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
    <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#b45309">Hàng ngang: 4 xu</text>
  </g>

  <!-- Target Question Prompt -->
  <g transform="translate(635, 225)">
    <rect x="-85" y="-35" width="170" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="0" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">Di chuyển đúng 1 xu</text>
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">Dọc = 5, Ngang = 5 ?</text>
  </g>
</svg>
