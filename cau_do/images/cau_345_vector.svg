<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Light theme default */
      .card-box { fill: #ffffff; stroke: #cbd5e1; }
      .card-text-primary { fill: #0f172a; }
      .card-text-secondary { fill: #64748b; }
      .triangle-wire { stroke: #cbd5e1; fill: none; }
      .badge-amber { fill: #fffbeb; stroke: #f59e0b; }
      .badge-amber-text { fill: #b45309; }

      /* Dark theme */
      @media (prefers-color-scheme: dark) {
        .card-box { fill: #1e293b; stroke: #475569; }
        .card-text-primary { fill: #f8fafc; }
        .card-text-secondary { fill: #94a3b8; }
        .triangle-wire { stroke: #334155; fill: none; }
        .badge-amber { fill: #451a03; stroke: #f59e0b; }
        .badge-amber-text { fill: #fde68a; }
      }
    ]]></style>

    <!-- Matchstick Drop Shadow -->
    <filter id="stickShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>

    <!-- Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Red Sulfur Head Gradient -->
    <radialGradient id="headGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Top Instruction Pill -->
  <g transform="translate(400, 45)">
    <rect class="badge-amber" x="-180" y="-18" width="360" height="36" rx="18" stroke-width="1.5"/>
    <text class="badge-amber-text" x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Xếp 6 que diêm thành 4 hình tam giác đều?</text>
  </g>

  <!-- Left Side: 3 matches forming 1 equilateral triangle (Side = 130) -->
  <!-- Center around (240, 240) -->
  <g transform="translate(240, 240)" filter="url(#stickShadow)">
    <!-- Base Match (Horizontal): from (-65, 45) to (65, 45) -->
    <rect x="-65" y="40" width="130" height="10" rx="5" fill="url(#woodGrad)"/>
    <circle cx="65" cy="45" r="7" fill="url(#headGrad)"/>

    <!-- Left Match (Angled 60 deg up): from (-65, 45) to (0, -68) -->
    <!-- Length = 130, angle = -60 deg from (-65, 45) -->
    <g transform="translate(-65, 45) rotate(-60)">
      <rect x="0" y="-5" width="130" height="10" rx="5" fill="url(#woodGrad)"/>
      <circle cx="130" cy="0" r="7" fill="url(#headGrad)"/>
    </g>

    <!-- Right Match (Angled 120 deg up): from (65, 45) to (0, -68) -->
    <!-- Angle = -120 deg from (65, 45) -->
    <g transform="translate(65, 45) rotate(-120)">
      <rect x="0" y="-5" width="130" height="10" rx="5" fill="url(#woodGrad)"/>
      <circle cx="130" cy="0" r="7" fill="url(#headGrad)"/>
    </g>

    <!-- Subtitle -->
    <text class="card-text-secondary" x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">3 que diêm = 1 tam giác đều</text>
  </g>

  <!-- Plus Sign in Middle -->
  <g transform="translate(400, 240)">
    <circle class="card-box" cx="0" cy="0" r="22" stroke-width="1.5"/>
    <path d="M -10 0 L 10 0 M 0 -10 L 0 10" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Right Side: 3 remaining matches on table -->
  <!-- Center around (560, 240) -->
  <g transform="translate(560, 240)" filter="url(#stickShadow)">
    <!-- Match 4 (Horizontal) -->
    <rect x="-65" y="-45" width="130" height="10" rx="5" fill="url(#woodGrad)"/>
    <circle cx="65" cy="-40" r="7" fill="url(#headGrad)"/>

    <!-- Match 5 (Horizontal) -->
    <rect x="-65" y="-5" width="130" height="10" rx="5" fill="url(#woodGrad)"/>
    <circle cx="65" cy="0" r="7" fill="url(#headGrad)"/>

    <!-- Match 6 (Horizontal) -->
    <rect x="-65" y="35" width="130" height="10" rx="5" fill="url(#woodGrad)"/>
    <circle cx="65" cy="40" r="7" fill="url(#headGrad)"/>

    <!-- Subtitle -->
    <text class="card-text-secondary" x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Còn lại 3 que diêm</text>
  </g>

  <!-- Bottom Question / Challenge -->
  <text class="card-text-primary" x="400" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Làm thế nào để tạo được 4 tam giác đều bằng nhau?</text>
</svg>
