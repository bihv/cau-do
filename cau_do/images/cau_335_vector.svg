<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 475" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.75"/>
    </filter>
    <filter id="target-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="cake-sponge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <pattern id="cutout-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" class="hatch-line"/>
    </pattern>

    <style><![CDATA[
      /* Universal Dual-Mode Styling */
      .plate-tray { fill: rgba(148, 163, 184, 0.07); stroke: #64748b; stroke-width: 1.6; }
      .math-label { fill: #6366f1; font-weight: 900; font-style: italic; }
      .hatch-line { stroke: #64748b; stroke-width: 1.8; }
    ]]></style>
  </defs>

  <!-- LEFT TRAY: ORIGINAL CAKE WITH CENTER O1 -->
  <rect x="75" y="40" width="290" height="370" rx="16" class="plate-tray" filter="url(#shadow)"/>
  <!-- Sponge Rectangular Cake -->
  <rect x="120" y="80" width="200" height="280" rx="12" fill="url(#cake-sponge)" stroke="#d97706" stroke-width="2.5"/>
  <!-- Symmetry axes through O1 (220, 220) -->
  <g stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6,4">
    <line x1="95" y1="220" x2="345" y2="220"/>
    <line x1="220" y1="55" x2="220" y2="385"/>
  </g>
  <!-- Center marker O1 -->
  <circle cx="220" cy="220" r="5.5" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
  <text x="235" y="215" font-family="-apple-system, sans-serif" font-size="15" class="math-label">O₁</text>

  <!-- MIDDLE TRANSITION ARROW -->
  <g transform="translate(432, 225)">
    <circle cx="0" cy="0" r="18" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M -5,-6 L 3,0 L -5,6" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

    <!-- RIGHT TRAY: MISSING CORNER CAKE & QUESTION -->
    <rect x="495" y="40" width="310" height="370" rx="16" class="plate-tray"/>

    <!-- Cutout missing corner with hatch pattern -->
    <rect x="550" y="80" width="110" height="85" rx="6" fill="url(#cutout-hatch)" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6,4"/>

    <!-- L-Shaped Remaining Cake -->
    <path d="M 660,80 L 738,80 Q 750,80 750,92 L 750,348 Q 750,360 738,360 L 562,360 Q 550,360 550,348 L 550,165 L 660,165 Z"
          fill="url(#cake-sponge)" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Question Mark Glow Badge -->
    <g transform="translate(650, 235)" filter="url(#target-glow)">
      <circle cx="0" cy="0" r="28" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="0" y="10" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#f59e0b">?</text>
    </g>

    <!-- Formula pill -->
    <g transform="translate(550, 420)">
      <rect width="200" height="34" rx="17" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="2"/>
      <text x="100" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#f59e0b" text-anchor="middle">1 nhát cắt ⟹ S₁ = S₂ ?</text>
    </g>
</svg>