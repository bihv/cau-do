<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" width="100%" height="100%">
  <defs>
    <radialGradient id="pointGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <radialGradient id="centerPointGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>

    <filter id="glowLine" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- The 10 Lines -->
  <g stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowLine)">
    <!-- 1. Horizontal top: A1 - A2 - A3 -->
    <line x1="100" y1="100" x2="460" y2="100"/>

    <!-- 2. Horizontal middle: B1 - B2 - B3 -->
    <line x1="190" y1="310" x2="370" y2="310"/>

    <!-- 3. Horizontal bottom: C1 - C2 - C3 -->
    <line x1="100" y1="520" x2="460" y2="520"/>

    <!-- 4. Vertical center: A2 - B2 - C2 -->
    <line x1="280" y1="100" x2="280" y2="520"/>

    <!-- 5. Main Diagonal: A1 - B2 - C3 -->
    <line x1="100" y1="100" x2="460" y2="520"/>

    <!-- 6. Main Anti-Diagonal: A3 - B2 - C1 -->
    <line x1="460" y1="100" x2="100" y2="520"/>

    <!-- 7. Butterfly Wing 1: A1 - B1 - C2 -->
    <line x1="100" y1="100" x2="280" y2="520"/>

    <!-- 8. Butterfly Wing 2: C1 - B1 - A2 -->
    <line x1="100" y1="520" x2="280" y2="100"/>

    <!-- 9. Butterfly Wing 3: A3 - B3 - C2 -->
    <line x1="460" y1="100" x2="280" y2="520"/>

    <!-- 10. Butterfly Wing 4: C3 - B3 - A2 -->
    <line x1="460" y1="520" x2="280" y2="100"/>
  </g>

  <!-- The 9 Points with labels -->
  <g filter="url(#shadow)">
    <!-- A1 -->
    <circle cx="100" cy="100" r="10" fill="url(#pointGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="75" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0284c7">A₁</text>

    <!-- A2 -->
    <circle cx="280" cy="100" r="10" fill="url(#pointGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0284c7" text-anchor="middle">A₂</text>

    <!-- A3 -->
    <circle cx="460" cy="100" r="10" fill="url(#pointGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="485" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0284c7">A₃</text>

    <!-- B1 -->
    <circle cx="190" cy="310" r="10" fill="url(#pointGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="165" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0284c7" text-anchor="end">B₁</text>

    <!-- B2 (Center) -->
    <circle cx="280" cy="310" r="12" fill="url(#centerPointGrad)" stroke="#ffffff" stroke-width="2.5"/>
    <text x="302" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#059669">B₂</text>

    <!-- B3 -->
    <circle cx="370" cy="310" r="10" fill="url(#pointGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="395" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0284c7">B₃</text>

    <!-- C1 -->
    <circle cx="100" cy="520" r="10" fill="url(#pointGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="75" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0284c7">C₁</text>

    <!-- C2 -->
    <circle cx="280" cy="520" r="10" fill="url(#pointGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0284c7" text-anchor="middle">C₂</text>

    <!-- C3 -->
    <circle cx="460" cy="520" r="10" fill="url(#pointGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="485" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0284c7">C₃</text>
  </g>

  <!-- Title Pill at Top -->
  <g transform="translate(280, 35)" filter="url(#shadow)">
    <rect x="-95" y="-15" width="190" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">9 Points • 10 Lines (3/line)</text>
  </g>
</svg>
