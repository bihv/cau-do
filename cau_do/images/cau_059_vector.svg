<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <!-- Soft Shadows -->
    <filter id="box-shadow" x="-8%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="target-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
    <filter id="shape-depth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Premium Dark Fill (Deep Indigo Slate) -->
    <linearGradient id="dark-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Target Cell Gradient -->
    <linearGradient id="target-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Shaded Cell Base Gradient -->
    <linearGradient id="shaded-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Modern Diagonal Hatching Pattern -->
    <pattern id="modern-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#475569" stroke-width="2.2" stroke-linecap="square"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- ==================================================== -->
  <!-- LEFT SIDE: 3x3 IQ MATRIX CONTAINER                   -->
  <!-- Box: x=60, y=55, w=348, h=348                        -->
  <!-- Cell Size: 116x116 each                              -->
  <!-- ==================================================== -->
  <g filter="url(#box-shadow)">
    <!-- Matrix Outer Card Frame -->
    <rect x="60" y="55" width="348" height="348" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>

    <!-- Shaded Cell (1,2) Background & Hatching Pattern -->
    <rect x="176" y="55" width="116" height="116" fill="url(#shaded-base)"/>
    <rect x="176" y="55" width="116" height="116" fill="url(#modern-hatch)"/>

    <!-- Target Empty Cell (3,2) Warm Glow Styling -->
    <rect x="180" y="291" width="108" height="108" rx="12" fill="url(#target-bg)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#target-glow)"/>
    <text x="234" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#d97706" text-anchor="middle" dominant-baseline="central">?</text>

    <!-- Grid Divider Lines -->
    <line x1="176" y1="55" x2="176" y2="403" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="292" y1="55" x2="292" y2="403" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="60" y1="171" x2="408" y2="171" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="60" y1="287" x2="408" y2="287" stroke="#cbd5e1" stroke-width="2"/>

    <!-- ================= ROW 1 (Rectangles) ================= -->
    <!-- Cell (1,1): Diamond white + Rectangle black -->
    <g filter="url(#shape-depth)">
      <polygon points="118,74 131,88 118,102 105,88" fill="#ffffff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
      <rect x="89" y="127" width="58" height="26" rx="4" fill="url(#dark-fill)"/>
    </g>

    <!-- Cell (1,3): Plus black + Rectangle white -->
    <g filter="url(#shape-depth)">
      <path d="M 345.5 75 H 354.5 V 83.5 H 363 V 92.5 H 354.5 V 101 H 345.5 V 92.5 H 337 V 83.5 H 345.5 Z" fill="url(#dark-fill)"/>
      <rect x="321" y="127" width="58" height="26" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
    </g>

    <!-- ================= ROW 2 (Circles) ================= -->
    <!-- Cell (2,1): Plus black + Circle white -->
    <g filter="url(#shape-depth)">
      <path d="M 113.5 191 H 122.5 V 199.5 H 131 V 208.5 H 122.5 V 217 H 113.5 V 208.5 H 105 V 199.5 H 113.5 Z" fill="url(#dark-fill)"/>
      <circle cx="118" cy="252" r="20" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
    </g>

    <!-- Cell (2,2): Diamond white + Circle black -->
    <g filter="url(#shape-depth)">
      <polygon points="234,190 247,204 234,218 221,204" fill="#ffffff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="234" cy="252" r="20" fill="url(#dark-fill)"/>
    </g>

    <!-- Cell (2,3): Dot black + Circle white -->
    <g filter="url(#shape-depth)">
      <circle cx="350" cy="204" r="8.5" fill="url(#dark-fill)"/>
      <circle cx="350" cy="252" r="20" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
    </g>

    <!-- ================= ROW 3 (Squares) ================= -->
    <!-- Cell (3,1): Dot black + Square white -->
    <g filter="url(#shape-depth)">
      <circle cx="118" cy="320" r="8.5" fill="url(#dark-fill)"/>
      <rect x="100" y="350" width="36" height="36" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
    </g>

    <!-- Cell (3,3): Diamond white + Square black -->
    <g filter="url(#shape-depth)">
      <polygon points="350,306 363,320 350,334 337,320" fill="#ffffff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
      <rect x="332" y="350" width="36" height="36" rx="4" fill="url(#dark-fill)"/>
    </g>
  </g>

  <!-- ==================================================== -->
  <!-- RIGHT SIDE: 4 MULTIPLE CHOICE OPTIONS A, B, C, D     -->
  <!-- Modern aesthetic with card backdrop & badges         -->
  <!-- ==================================================== -->
  <g filter="url(#box-shadow)">
    <!-- OPTION A (Top Left) -->
    <g>
      <!-- Option Card Backing -->
      <rect x="460" y="65" width="140" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Letter 'A' Badge on LEFT -->
      <circle cx="492" cy="125" r="16" fill="#eff6ff"/>
      <text x="492" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="central">A</text>
      <!-- Shapes for A (center x=555) -->
      <circle cx="555" cy="100" r="8.5" fill="url(#dark-fill)"/>
      <rect x="526" y="128" width="58" height="26" rx="4" fill="url(#dark-fill)"/>
    </g>

    <!-- OPTION B (Top Right) -->
    <g>
      <!-- Option Card Backing -->
      <rect x="630" y="65" width="140" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Shapes for B (center x=675) -->
      <path d="M 670.5 87 H 679.5 V 95.5 H 688 V 104.5 H 679.5 V 113 H 670.5 V 104.5 H 662 V 95.5 H 670.5 Z" fill="url(#dark-fill)"/>
      <rect x="657" y="123" width="36" height="36" rx="4" fill="url(#dark-fill)"/>
      <!-- Letter 'B' Badge on RIGHT -->
      <circle cx="738" cy="125" r="16" fill="#eff6ff"/>
      <text x="738" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="central">B</text>
    </g>

    <!-- OPTION C (Bottom Left) -->
    <g>
      <!-- Option Card Backing -->
      <rect x="460" y="250" width="140" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Letter 'C' Badge on LEFT -->
      <circle cx="492" cy="310" r="16" fill="#eff6ff"/>
      <text x="492" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="central">C</text>
      <!-- Shapes for C (center x=555) -->
      <polygon points="555,272 568,286 555,300 542,286" fill="#ffffff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="555" cy="330" r="20" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
    </g>

    <!-- OPTION D (Bottom Right - The Answer) -->
    <g>
      <!-- Option Card Backing -->
      <rect x="630" y="250" width="140" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Shapes for D (center x=675) -->
      <path d="M 670.5 272 H 679.5 V 280.5 H 688 V 289.5 H 679.5 V 298 H 670.5 V 289.5 H 662 V 280.5 H 670.5 Z" fill="url(#dark-fill)"/>
      <rect x="657" y="308" width="36" height="36" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
      <!-- Letter 'D' Badge on RIGHT -->
      <circle cx="738" cy="310" r="16" fill="#eff6ff"/>
      <text x="738" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="central">D</text>
    </g>
  </g>
</svg>
