<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <!-- Soft Shadows & Glows -->
    <filter id="box-shadow" x="-10%" y="-10%" width="120%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="success-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
    <filter id="shape-depth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- Premium Dark Fill (Deep Indigo Slate) -->
    <linearGradient id="dark-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Success Cell Gradient -->
    <linearGradient id="success-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <!-- ==================================================== -->
  <!-- TOP ROW: SEQUENCE OF 4 CARDS (WITH SOLVED CARD 4)    -->
  <!-- Box Centers: 184, 328, 472, 616 (y=110)              -->
  <!-- Sequence: 45° -> 90° -> 135° -> 180° (Straight line) -->
  <!-- ==================================================== -->
  <g filter="url(#box-shadow)">
    <!-- Card 1: 45° Acute Angle -->
    <rect x="124" y="50" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 172 135 L 172 100 L 197 125" fill="none" stroke="url(#dark-fill)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#shape-depth)"/>

    <!-- Card 2: 90° Right Angle -->
    <rect x="268" y="50" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 316 135 L 316 100 L 351 100" fill="none" stroke="url(#dark-fill)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#shape-depth)"/>

    <!-- Card 3: 135° Obtuse Angle -->
    <rect x="412" y="50" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 460 135 L 460 100 L 485 75" fill="none" stroke="url(#dark-fill)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#shape-depth)"/>

    <!-- Card 4: SOLVED TARGET CELL (180° Straight line - Emerald) -->
    <g filter="url(#success-glow)">
      <rect x="556" y="50" width="120" height="120" rx="16" fill="url(#success-bg)" stroke="#10b981" stroke-width="2.8"/>
      <!-- Aligned with joint x=604 (616-12) or centered in cell -->
      <rect x="600.5" y="75" width="7" height="70" rx="3.5" fill="#047857"/>
      <!-- Small Victory Badge at top-right of Card 4 -->
      <circle cx="662" cy="64" r="10" fill="#10b981"/>
      <path d="M 658 64 L 661 67 L 666 61" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ==================================================== -->
  <!-- BOTTOM ROW: 4 MULTIPLE CHOICE OPTIONS WITH B WON     -->
  <!-- Box Centers: 184, 328, 472, 616 (y=270)              -->
  <!-- ==================================================== -->
  <g filter="url(#box-shadow)">
    <!-- Option A (Inactive) -->
    <g opacity="0.38">
      <rect x="124" y="210" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 171 235 L 196 260 L 196 295" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="184" cy="368" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="184" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#64748b" text-anchor="middle" dominant-baseline="central">A</text>
    </g>

    <!-- Option B (WINNER HIGHLIGHTED - MINT GREEN) -->
    <g filter="url(#success-glow)">
      <!-- Winner Card Backing -->
      <rect x="268" y="210" width="120" height="120" rx="16" fill="url(#success-bg)" stroke="#10b981" stroke-width="2.8"/>
      <!-- 180° Vertical Line in Emerald -->
      <rect x="324.5" y="235" width="7" height="70" rx="3.5" fill="#047857"/>
      <!-- Letter 'B' Badge in Emerald -->
      <circle cx="328" cy="368" r="16" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
      <text x="328" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#047857" text-anchor="middle" dominant-baseline="central">B</text>
      <!-- Checkmark Badge on Winner Card -->
      <circle cx="374" cy="224" r="11" fill="#10b981"/>
      <path d="M 370 224 L 372.5 226.5 L 378 221" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Option C (Inactive) -->
    <g opacity="0.38">
      <rect x="412" y="210" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 449 252 L 484 252 L 484 287" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="472" cy="368" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="472" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#64748b" text-anchor="middle" dominant-baseline="central">C</text>
    </g>

    <!-- Option D (Inactive) -->
    <g opacity="0.38">
      <rect x="556" y="210" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 626 245 L 601 270 L 626 295" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="616" cy="368" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="616" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#64748b" text-anchor="middle" dominant-baseline="central">D</text>
    </g>
  </g>
</svg>
