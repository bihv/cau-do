<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 55 655 430" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <!-- Clock Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Clock Face Gradient -->
    <radialGradient id="faceGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- Card Shadow -->
    <!-- Clock Shadow -->
    <filter id="clockShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>

    <!-- Emerald Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>

    <!-- Clip Path for Clock Face -->
    <clipPath id="clockFaceClip">
      <circle cx="310" cy="270" r="180"/>
    </clipPath>
  </defs>

  <!-- Clock Outer Rim & Body (Center at x=310, y=270, r=180) -->
  <g filter="url(#clockShadow)">
    <circle cx="310" cy="270" r="195" fill="url(#rimGrad)"/>
    <circle cx="310" cy="270" r="186" fill="#475569" stroke="#64748b" stroke-width="1"/>
    <circle cx="310" cy="270" r="180" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- 6 Colored Strips on Clock Face (Rotated by 15 deg) -->
  <g clip-path="url(#clockFaceClip)" transform="rotate(15 310 270)">
    <!-- Strip 1: 12 + 1 -->
    <rect x="110" y="90" width="400" height="58" fill="#dbeafe" opacity="0.45"/>
    <!-- Strip 2: 11 + 2 -->
    <rect x="110" y="148" width="400" height="60" fill="#ede9fe" opacity="0.45"/>
    <!-- Strip 3: 10 + 3 -->
    <rect x="110" y="208" width="400" height="62" fill="#dcfce7" opacity="0.5"/>
    <!-- Strip 4: 9 + 4 -->
    <rect x="110" y="270" width="400" height="62" fill="#fef3c7" opacity="0.5"/>
    <!-- Strip 5: 8 + 5 -->
    <rect x="110" y="332" width="400" height="60" fill="#fee2e2" opacity="0.45"/>
    <!-- Strip 6: 7 + 6 -->
    <rect x="110" y="392" width="400" height="60" fill="#e0f2fe" opacity="0.45"/>

    <!-- 5 Dividing Lines -->
    <line x1="110" y1="148" x2="510" y2="148" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="208" x2="510" y2="208" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="270" x2="510" y2="270" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="332" x2="510" y2="332" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="392" x2="510" y2="392" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Clock Center Pivot Pin -->
  <circle cx="310" cy="270" r="7" fill="#0f172a"/>
  <circle cx="310" cy="270" r="3" fill="#94a3b8"/>

  <!-- 12 Hour Numbers (Center at 310, 270) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
    <text x="310" y="134">12</text>
    <text x="379" y="153">1</text>
    <text x="429" y="203">2</text>
    <text x="447" y="270">3</text>
    <text x="429" y="337">4</text>
    <text x="379" y="387">5</text>
    <text x="310" y="406">6</text>
    <text x="241" y="387">7</text>
    <text x="191" y="337">8</text>
    <text x="173" y="270">9</text>
    <text x="191" y="203">10</text>
    <text x="241" y="153">11</text>
  </g>

  <!-- Side Panel: 6 Pairs Summing to 13 -->
  <g transform="translate(540, 75)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="185" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="92" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#065f46" text-anchor="middle">Tổng mỗi phần = 13</text>

    <!-- Formula Cards -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">
      <!-- Pair 1 -->
      <rect x="0" y="48" width="185" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="22" cy="69" r="8" fill="#3b82f6"/>
      <text x="40" y="74" fill="#1e293b">12 + 1 = <tspan fill="#059669" font-weight="800">13</tspan></text>

      <!-- Pair 2 -->
      <rect x="0" y="98" width="185" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="22" cy="119" r="8" fill="#8b5cf6"/>
      <text x="40" y="124" fill="#1e293b">11 + 2 = <tspan fill="#059669" font-weight="800">13</tspan></text>

      <!-- Pair 3 -->
      <rect x="0" y="148" width="185" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="22" cy="169" r="8" fill="#10b981"/>
      <text x="40" y="174" fill="#1e293b">10 + 3 = <tspan fill="#059669" font-weight="800">13</tspan></text>

      <!-- Pair 4 -->
      <rect x="0" y="198" width="185" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="22" cy="219" r="8" fill="#f59e0b"/>
      <text x="40" y="224" fill="#1e293b">9 + 4 = <tspan fill="#059669" font-weight="800">13</tspan></text>

      <!-- Pair 5 -->
      <rect x="0" y="248" width="185" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="22" cy="269" r="8" fill="#ef4444"/>
      <text x="40" y="274" fill="#1e293b">8 + 5 = <tspan fill="#059669" font-weight="800">13</tspan></text>

      <!-- Pair 6 -->
      <rect x="0" y="298" width="185" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="22" cy="319" r="8" fill="#06b6d4"/>
      <text x="40" y="324" fill="#1e293b">7 + 6 = <tspan fill="#059669" font-weight="800">13</tspan></text>

      <!-- Summary Note -->
      <rect x="0" y="352" width="185" height="36" rx="8" fill="#f1f5f9"/>
      <text x="92" y="375" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Tổng 12 số: 78 ÷ 6 = 13</text>
    </g>
  </g>
</svg>
