<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 510" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadows & Glows -->
    <filter id="grid-shadow" x="-8%" y="-8%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <filter id="symbol-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>

    <filter id="success-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#059669" flood-opacity="0.3"/>
    </filter>

    <!-- Canvas Background Gradient -->
    <!-- Target Column Highlight Gradient -->
    <linearGradient id="col-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>

    <!-- 5 VIBRANT JEWEL-TONED GRADIENTS -->
    <!-- 1. Star: Radiant Amber Gold -->
    <radialGradient id="star-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <!-- 2. Crescent Moon: Royal Indigo Sapphire -->
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- 3. Snowflake: Cyan Ice Aquamarine -->
    <linearGradient id="snow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- 4. Diamond: Vivid Amethyst Purple -->
    <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <!-- 5. Heart: Passionate Ruby Crimson -->
    <radialGradient id="heart-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="35%" stop-color="#f87171"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- SYMBOL DEFINITIONS (Origin at center 0,0) -->
    <!-- 1. Star (★) -->
    <g id="sym-star" filter="url(#symbol-shadow)">
      <polygon points="0,-25 6.4,-8.8 23.8,-7.7 10.5,3.3 14.7,20.3 0,11.0 -14.7,20.3 -10.5,3.3 -23.8,-7.7 -6.4,-8.8"
               fill="url(#star-grad)" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="0,-16 3.8,-5.5 15,-4.8 6.6,2.1 9.3,12.8 0,7.0 -9.3,12.8 -6.6,2.1 -15,-4.8 -3.8,-5.5"
               fill="#fef9c3" opacity="0.45"/>
    </g>

    <!-- 2. Crescent Moon (☽) - CĂN GIỮA HOÀN HẢO (Centered horizontally) -->
    <g id="sym-moon" filter="url(#symbol-shadow)">
      <path d="M 14 -24 C -5 -21 -15 -12 -15 0 C -15 12 -5 21 14 24 C 2 17 -3 9 -3 0 C -3 -9 2 -17 14 -24 Z"
            fill="url(#moon-grad)" stroke="#312e81" stroke-width="1.6" stroke-linejoin="round"/>
      <!-- Inner crescent highlight arc -->
      <path d="M 11 -19 C -1 -16 -8 -9 -8 0 C -8 9 -1 16 11 19 C 3 13 -1 7 -1 0 C -1 -7 3 -13 11 -19 Z"
            fill="#c7d2fe" opacity="0.4"/>
    </g>

    <!-- 3. Snowflake / 8-pointed star (❄) -->
    <g id="sym-snow" filter="url(#symbol-shadow)">
      <g fill="url(#snow-grad)" stroke="#075985" stroke-width="1.2" stroke-linejoin="round">
        <polygon points="0,0 -3.8,-11 0,-25 3.8,-11"/>
        <polygon points="0,0 -3.8,-11 0,-25 3.8,-11" transform="rotate(45)"/>
        <polygon points="0,0 -3.8,-11 0,-25 3.8,-11" transform="rotate(90)"/>
        <polygon points="0,0 -3.8,-11 0,-25 3.8,-11" transform="rotate(135)"/>
        <polygon points="0,0 -3.8,-11 0,-25 3.8,-11" transform="rotate(180)"/>
        <polygon points="0,0 -3.8,-11 0,-25 3.8,-11" transform="rotate(225)"/>
        <polygon points="0,0 -3.8,-11 0,-25 3.8,-11" transform="rotate(270)"/>
        <polygon points="0,0 -3.8,-11 0,-25 3.8,-11" transform="rotate(315)"/>
      </g>
      <circle cx="0" cy="0" r="4.5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="2.0" fill="#ffffff"/>
    </g>

    <!-- 4. Diamond (♦) -->
    <g id="sym-diamond" filter="url(#symbol-shadow)">
      <polygon points="0,-24 24,0 0,24 -24,0"
               fill="url(#diamond-grad)" stroke="#581c87" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="0,-16 16,0 0,16 -16,0"
               fill="#fae8ff" opacity="0.38"/>
    </g>

    <!-- 5. Heart (♥) -->
    <g id="sym-heart" filter="url(#symbol-shadow)">
      <path d="M 0 -8 C 0 -20 -20 -24 -22 -8 C -24 7 -8 16 0 23 C 8 16 24 7 22 -8 C 20 -24 0 -20 0 -8 Z"
            fill="url(#heart-grad)" stroke="#881337" stroke-width="1.6" stroke-linejoin="round"/>
      <ellipse cx="-8" cy="-10" rx="4" ry="2.5" transform="rotate(-30, -8, -10)" fill="#fee2e2" opacity="0.6"/>
    </g>
  </defs>

  <!-- ==================================================== -->
  <!-- STEPPED GRID CONTAINER (STAIRCASE)                   -->
  <!-- cw = 84, ch = 84, gx = 135, gy = 45                  -->
  <!-- ==================================================== -->

  <!-- Outer stepped white board with shadow -->
  <path d="M 135 45 
           L 219 45 
           L 219 129 
           L 303 129 
           L 303 213 
           L 387 213 
           L 387 297 
           L 471 297 
           L 471 381 
           L 135 381 Z"
        fill="#ffffff" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"
        filter="url(#grid-shadow)"/>

  <!-- Column 2 (Target Column) Highlighted Background -->
  <rect x="219" y="129" width="84" height="252" fill="url(#col-highlight)"/>

  <!-- Internal Grid Lines -->
  <!-- Horizontal Dividers -->
  <line x1="135" y1="129" x2="219" y2="129" stroke="#334155" stroke-width="2.4"/>
  <line x1="135" y1="213" x2="303" y2="213" stroke="#334155" stroke-width="2.4"/>
  <line x1="135" y1="297" x2="387" y2="297" stroke="#334155" stroke-width="2.4"/>

  <!-- Vertical Dividers -->
  <line x1="219" y1="129" x2="219" y2="381" stroke="#334155" stroke-width="2.4"/>
  <line x1="303" y1="213" x2="303" y2="381" stroke="#334155" stroke-width="2.4"/>
  <line x1="387" y1="297" x2="387" y2="381" stroke="#334155" stroke-width="2.4"/>

  <!-- Column 2 Highlight Border -->
  <rect x="219" y="129" width="84" height="252" fill="none" stroke="#10b981" stroke-width="2.6"/>

  <!-- ==================================================== -->
  <!-- 10 VIBRANT SYMBOLS IN THE GRID CELLS                 -->
  <!-- ==================================================== -->

  <!-- Row 1 -->
  <!-- Col 1: Gold Star -->
  <use href="#sym-star" x="177" y="87"/>

  <!-- Row 2 -->
  <!-- Col 1: Indigo Moon (CĂN GIỮA Ô) -->
  <use href="#sym-moon" x="177" y="171"/>
  <!-- Col 2: Cyan Snowflake -->
  <use href="#sym-snow" x="261" y="171"/>

  <!-- Row 3 -->
  <!-- Col 1: Ruby Heart -->
  <use href="#sym-heart" x="177" y="255"/>
  <!-- Col 2: Purple Diamond -->
  <use href="#sym-diamond" x="261" y="255"/>
  <!-- Col 3: Ruby Heart -->
  <use href="#sym-heart" x="345" y="255"/>

  <!-- Row 4 -->
  <!-- Col 1: Gold Star -->
  <use href="#sym-star" x="177" y="339"/>
  <!-- Col 2: Indigo Moon (CĂN GIỮA Ô) -->
  <use href="#sym-moon" x="261" y="339"/>
  <!-- Col 3: Cyan Snowflake -->
  <use href="#sym-snow" x="345" y="339"/>
  <!-- Col 4: Gold Star -->
  <use href="#sym-star" x="429" y="339"/>

  <!-- ==================================================== -->
  <!-- NUMBERS ON THE LEFT (ROW SUMS)                       -->
  <!-- ==================================================== -->
  <text x="78" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#1e293b" text-anchor="middle">12</text>
  <!-- Row 2 revealed bonus sum in Emerald -->
  <text x="78" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#10b981" text-anchor="middle">16</text>
  <text x="78" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#1e293b" text-anchor="middle">11</text>
  <text x="78" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#1e293b" text-anchor="middle">40</text>

  <!-- ==================================================== -->
  <!-- NUMBERS AT THE BOTTOM (COLUMN SUMS)                  -->
  <!-- ==================================================== -->
  <text x="177" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#1e293b" text-anchor="middle">36</text>

  <!-- Col 2 Answer 21 with Victory Checkmark in Emerald -->
  <g filter="url(#success-glow)">
    <text x="261" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#047857" text-anchor="middle">21</text>
    <circle cx="288" cy="416" r="9" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 284.5 416 L 287 418.5 L 291.5 413.5" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="345" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#1e293b" text-anchor="middle">10</text>
  <text x="429" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#1e293b" text-anchor="middle">12</text>

  <!-- ==================================================== -->
  <!-- SUMMARY CALCULATION PILL                             -->
  <!-- ==================================================== -->
  <g transform="translate(270, 476)">
    <rect x="-175" y="-16" width="350" height="32" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">
      Cột 2: 7 (❄) + 5 (♦) + 9 (☽) = 21
    </text>
  </g>
</svg>
