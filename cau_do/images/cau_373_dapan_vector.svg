<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%">
  <defs>
    <!-- Table Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Window View Gradient -->
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Card Gradients -->
    <!-- B: Gray (Nga - Xám) -->
    <linearGradient id="cardB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- D: Blue (Anh - Xanh) Spy -->
    <linearGradient id="cardD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <!-- A: Brown (Đức - Nâu) -->
    <linearGradient id="cardA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- C: Black (Mỹ - Đen) -->
    <linearGradient id="cardC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <filter id="glowSpy" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Train Window on the Right -->
  <g transform="translate(560, 110)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="70" height="220" rx="12" fill="#334155"/>
    <!-- Glass Pane -->
    <rect x="8" y="8" width="54" height="204" rx="8" fill="url(#winGrad)"/>
    <!-- Window reflection line -->
    <line x1="14" y1="180" x2="56" y2="40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- Train track / horizon lines outside -->
    <line x1="8" y1="120" x2="62" y2="120" stroke="#38bdf8" stroke-width="2"/>
    <line x1="8" y1="140" x2="62" y2="140" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- Central Table -->
  <g transform="translate(130, 150)" filter="url(#shadow)">
    <rect x="0" y="0" width="370" height="140" rx="14" fill="url(#tableGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Table center divider / runner -->
    <rect x="180" y="10" width="10" height="120" rx="4" fill="#e2e8f0"/>
    <!-- Water glasses / mugs -->
    <circle cx="90" cy="50" r="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="280" cy="50" r="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="90" cy="90" r="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="280" cy="90" r="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Passenger B: Top Left (Nga, áo xám) -->
  <g transform="translate(140, 30)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="95" rx="12" fill="url(#cardB)" stroke="#64748b" stroke-width="2"/>
    <!-- Avatar circle -->
    <circle cx="35" cy="48" r="22" fill="#64748b"/>
    <text x="35" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
    <!-- Coat Color swatch -->
    <circle cx="75" cy="40" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <text x="92" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#334155">RUS</text>
    <!-- Details text -->
    <text x="75" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">Grey Coat</text>
  </g>

  <!-- Passenger D: Top Right (Anh, áo xanh) -> SPY! -->
  <g transform="translate(340, 30)" filter="url(#glowSpy)">
    <rect x="0" y="0" width="160" height="95" rx="12" fill="url(#cardD)" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Avatar circle with badge -->
    <circle cx="35" cy="48" r="22" fill="#0284c7"/>
    <text x="35" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
    <!-- Coat swatch -->
    <circle cx="75" cy="38" r="8" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="92" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369a1">GBR</text>
    <!-- Spy badge -->
    <rect x="72" y="55" width="76" height="22" rx="6" fill="#0284c7"/>
    <text x="110" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">SPY ★</text>
  </g>

  <!-- D look-at-window gaze arrow -->
  <path d="M 505,78 C 525,78 535,95 548,115" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="551,118 543,115 547,109" fill="#0284c7"/>

  <!-- Passenger A: Bottom Left (Đức, áo nâu) -->
  <g transform="translate(140, 315)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="95" rx="12" fill="url(#cardA)" stroke="#d97706" stroke-width="2"/>
    <!-- Avatar circle -->
    <circle cx="35" cy="48" r="22" fill="#b45309"/>
    <text x="35" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Coat swatch -->
    <circle cx="75" cy="40" r="8" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
    <text x="92" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#78350f">DEU</text>
    <text x="75" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#92400e">Brown Coat</text>
  </g>

  <!-- Passenger C: Bottom Right (Mỹ, áo đen) -->
  <g transform="translate(340, 315)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="95" rx="12" fill="url(#cardC)" stroke="#334155" stroke-width="2"/>
    <!-- Avatar circle -->
    <circle cx="35" cy="48" r="22" fill="#0f172a"/>
    <text x="35" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
    <!-- Coat swatch -->
    <circle cx="75" cy="40" r="8" fill="#0f172a" stroke="#000000" stroke-width="1.5"/>
    <text x="92" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a">USA</text>
    <text x="75" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#475569">Black Coat</text>
  </g>
</svg>
