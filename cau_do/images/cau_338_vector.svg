<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Multi-tier Drop Shadows & Glows -->
    <filter id="node-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>

    <!-- Canvas Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Deep Indigo Slate Node Gradient -->
    <linearGradient id="dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- ==================== 9 CIRCULAR DOTS (3x3 GRID - PERFECTLY CENTERED) ==================== -->
  <g id="nine-dots" filter="url(#node-shadow)">
    <!-- Row 1: Top (y = 240) -->
    <!-- Dot (1,1): Top-Left (240, 240) -->
    <g transform="translate(240, 240)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#dot-grad)" stroke="#1e293b" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (1,2): Top-Middle (400, 240) -->
    <g transform="translate(400, 240)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#dot-grad)" stroke="#1e293b" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (1,3): Top-Right (560, 240) -->
    <g transform="translate(560, 240)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#dot-grad)" stroke="#1e293b" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Row 2: Middle (y = 400) -->
    <!-- Dot (2,1): Middle-Left (240, 400) -->
    <g transform="translate(240, 400)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#dot-grad)" stroke="#1e293b" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (2,2): Center (400, 400) -->
    <g transform="translate(400, 400)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#dot-grad)" stroke="#1e293b" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (2,3): Middle-Right (560, 400) -->
    <g transform="translate(560, 400)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#dot-grad)" stroke="#1e293b" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Row 3: Bottom (y = 560) -->
    <!-- Dot (3,1): Bottom-Left (240, 560) -->
    <g transform="translate(240, 560)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#dot-grad)" stroke="#1e293b" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (3,2): Bottom-Middle (400, 560) -->
    <g transform="translate(400, 560)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#dot-grad)" stroke="#1e293b" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (3,3): Bottom-Right (560, 560) -->
    <g transform="translate(560, 560)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#dot-grad)" stroke="#1e293b" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>
  </g>
</svg>
