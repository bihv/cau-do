<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 70 640 280" width="100%" height="100%">
  <!-- Transition Arrow -->
  <g transform="translate(400, 210)" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-24" y1="0" x2="24" y2="0"/>
    <polyline points="14,-8 24,0 14,8"/>
  </g>

  <!-- LEFT: GREEK CROSS WITH 2 CUTS AND TARGET RECTANGLE OVERLAY (cx=210, cy=210) -->
  <g transform="translate(210, 210)">
    <!-- Target Rectangle Overlay (as in original scan) -->
    <polygon points="-32.5,97.5 32.5,-97.5 130.0,-65.0 65.0,130.0" fill="#eff6ff" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Cross Pieces -->
    <g stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round">
      <polygon points="-32.5,97.5 32.5,97.5 32.5,32.5 97.5,32.5 97.5,-32.5 32.5,-32.5 32.5,-97.5" fill="#38bdf8"/>
      <polygon points="0,0 -97.5,-32.5 -32.5,-32.5 -32.5,-97.5 32.5,-97.5" fill="#34d399"/>
      <polygon points="0,0 -32.5,97.5 -32.5,32.5 -97.5,32.5 -97.5,-32.5" fill="#fbbf24"/>

      <!-- Cut lines highlighted in white -->
      <line x1="-32.5" y1="97.5" x2="32.5" y2="-97.5" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5,4"/>
      <line x1="-97.5" y1="-32.5" x2="0" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5,4"/>
    </g>
  </g>

  <!-- RIGHT: ASSEMBLED 2:1 RECTANGLE (cx=590, cy=210) -->
  <g transform="translate(590, 210)" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round">
    <polygon points="-81.25,81.25 -16.25,81.25 -16.25,16.25 48.75,16.25 48.75,-48.75 -16.25,-48.75 -16.25,-113.75" fill="#38bdf8"/>
    <polygon points="81.25,-81.25 48.75,16.25 48.75,-48.75 -16.25,-48.75 -16.25,-113.75" fill="#fbbf24"/>
    <polygon points="16.25,113.75 -81.25,81.25 -16.25,81.25 -16.25,16.25 48.75,16.25" fill="#34d399"/>

    <!-- Outer Rectangle Boundary Reinforcement -->
    <polygon points="-81.25,81.25 -16.25,-113.75 81.25,-81.25 16.25,113.75" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  </g>
</svg>