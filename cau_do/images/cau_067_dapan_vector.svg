        <polygon points="158.0,93.0 194.0,65.0 194.0,137.0 158.0,165.0" fill="url(#right-fill)" stroke="#475569" stroke-width="2.0" stroke-linejoin="round"/>
        <polygon points="86.0,93.0 158.0,93.0 158.0,165.0 86.0,165.0" fill="url(#front-fill)" stroke="#334155" stroke-width="2.0" stroke-linejoin="round"/>
        <polygon points="104.4,88.6 116.4,88.6 122.4,83.9 110.4,83.9" fill="#f8fafc"/>
        <polygon points="131.0,81.3 143.0,81.3 149.0,76.7 137.0,76.7" fill="#f8fafc"/>
        <polygon points="157.6,74.1 169.6,74.1 175.6,69.4 163.6,69.4" fill="#f8fafc"/>
