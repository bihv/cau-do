<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <pattern id="diagStripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="2.5"/>
    </pattern>
  </defs>

  <!-- Left: Reassembled Rectangle & The Missing Strip Demonstration -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Main rectangle representation -->
    <!-- Scale: width 25 cm = 320 px, height 23 cm = 294.4 px -->
    <!-- Exact width is 25 + 1/23 cm = 320 + 13.9 px (exaggerated slightly for crystal-clear visual comprehension) -->
    
    <!-- White background card -->
    <rect x="0" y="0" width="360" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Nominal 25 x 23 rectangle -->
    <rect x="20" y="20" width="280" height="260" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="4"/>

    <!-- Piece A area -->
    <polygon points="20,20 20,280 300,280" fill="#dbeafe" fill-opacity="0.6"/>
    <text x="100" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#2563eb">Mảnh A</text>

    <!-- Piece B area -->
    <polygon points="20,20 300,20 300,280" fill="#d1fae5" fill-opacity="0.6"/>
    <text x="210" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#059669">Mảnh B</text>

    <!-- Diagonal boundary -->
    <line x1="20" y1="20" x2="300" y2="280" stroke="#0f172a" stroke-width="2.5"/>

    <!-- THE EXTRA STRIP of width 1/23 cm (Area = 1 cm²) -->
    <rect x="300" y="20" width="26" height="260" fill="url(#diagStripes)" stroke="#dc2626" stroke-width="2" rx="2"/>

    <!-- Strip callout -->
    <line x1="313" y1="285" x2="313" y2="302" stroke="#dc2626" stroke-width="1.5"/>
    <text x="313" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">+ 1/23 cm</text>

    <!-- Dimension labels -->
    <text x="160" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Chiều dài tưởng tượng = 25 cm</text>
    <text x="10" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" transform="rotate(-90 10 155)">23 cm</text>

    <!-- Total length bracket -->
    <line x1="20" y1="288" x2="326" y2="288" stroke="#0f172a" stroke-width="1.5"/>
    <text x="173" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">Chiều dài thực = 24 + 24/23 = 25,0435 cm</text>
  </g>

  <!-- Right: Mathematical Proof & Logic Cards -->
  <g transform="translate(480, 50)">
    <!-- Card 1: Paradox Explained -->
    <g filter="url(#shadow)">
      <rect width="380" height="155" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="380" height="38" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="24" cy="19" r="6" fill="#ef4444"/>
      <text x="40" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0f172a">VÌ SAO LẠI "MẤT" 1 CM²?</text>

      <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">• Hình vuông ban đầu: 24 × 24 = 576 cm²</text>
      <text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">• Hình chữ nhật lầm tưởng: 25 × 23 = 575 cm²</text>
      <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#dc2626">• Sai số ảo giác: 576 − 575 = 1 cm²</text>
      <text x="24" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic" fill="#64748b">→ Do lầm tưởng chiều dài cạnh đáy tròn trĩnh 25 cm!</text>
    </g>

    <!-- Card 2: Exact Mathematical Conservation -->
    <g transform="translate(0, 175)" filter="url(#shadow)">
      <rect width="380" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="380" height="38" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <circle cx="24" cy="19" r="6" fill="#10b981"/>
      <text x="40" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#065f46">BẢO TOÀN DIỆN TÍCH TUYỆT ĐỐI</text>

      <!-- Step 1 -->
      <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">1. Độ dốc đường cắt ban đầu: tan θ = 24 / 23</text>
      
      <!-- Step 2 -->
      <text x="24" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">2. Khi trượt B lên 1 cm theo phương đứng:</text>
      <text x="40" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#2563eb">Độ trượt ngang = 1 × (24/23) = 24/23 cm</text>

      <!-- Step 3 -->
      <text x="24" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">3. Chiều dài thực tế của hình chữ nhật:</text>
      <text x="40" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#059669">L = 24 + 24/23 = 25 + 1/23 cm</text>

      <!-- Step 4 -->
      <rect x="24" y="184" width="332" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="190" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#15803d" text-anchor="middle">S = 23 × (24 + 24/23) = 576 cm²</text>
    </g>
  </g>
</svg>