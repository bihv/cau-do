<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <filter id="center-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>

    <style><![CDATA[
      /* Center Square: High contrast, never blends into dark mode background */
      .center-square {
        fill: #0284c7;
        stroke: #38bdf8;
        stroke-width: 2;
      }

      /* Grapefruit Trees */
      .tree-trunk {
        fill: #15803d;
        stroke: #14532d;
        stroke-width: 2;
      }
      .tree-highlight {
        fill: #86efac;
      }

      @media (prefers-color-scheme: dark) {
        .center-square {
          fill: #38bdf8;
          stroke: #f0f9ff;
          stroke-width: 2;
        }
        .tree-trunk {
          fill: #22c55e;
          stroke: #166534;
        }
        .tree-highlight {
          fill: #dcfce7;
        }
      }
    ]]></style>
  </defs>
