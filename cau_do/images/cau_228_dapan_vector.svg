<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Light theme default */
      .card-box { fill: #ffffff; stroke: #cbd5e1; }
      .card-text { fill: #0f172a; }
      .card-emerald { fill: #ecfdf5; stroke: #10b981; }
      .card-emerald-text { fill: #047857; }
      .card-emerald-sub { fill: #065f46; }
      .tri-body { fill: #ffffff; stroke: #1e293b; }

      /* Dark theme: dark slate cards and glowing light text */
      @media (prefers-color-scheme: dark) {
        .card-box { fill: #1e293b; stroke: #475569; }
        .card-text { fill: #f8fafc; }
        .card-emerald { fill: rgba(16, 185, 129, 0.18); stroke: #10b981; }
        .card-emerald-text { fill: #34d399; }
        .card-emerald-sub { fill: #6ee7b7; }
        .tri-body { fill: #1e293b; stroke: #94a3b8; }
      }
    ]]></style>

    <!-- Soft shadow for triangles -->
    <filter id="triShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Badge shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Glow for Winner Solution -->
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>

    <!-- Triangle 1: 3 Dots on RIGHT slant edge -->
    <g id="triRight" filter="url(#triShadow)">
      <polygon class="tri-body" points="0,-30 35,30 -35,30" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 3 bead dots on right edge -->
      <circle cx="9.8" cy="-13.2" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="9" cy="-14" r="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="18.55" cy="1.8" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="17.75" cy="1" r="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="27.3" cy="16.8" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="26.5" cy="16" r="1.5" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Triangle 2: 3 Dots on LEFT slant edge -->
    <g id="triLeft" filter="url(#triShadow)">
      <polygon class="tri-body" points="0,-30 35,30 -35,30" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 3 bead dots on left edge -->
      <circle cx="-9.8" cy="-13.2" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="-10.6" cy="-14" r="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="-18.55" cy="1.8" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="-19.35" cy="1" r="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="-27.3" cy="16.8" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="-28.1" cy="16" r="1.5" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Triangle 3: 3 Dots on BOTTOM horizontal edge -->
    <g id="triBottom" filter="url(#triShadow)">
      <polygon class="tri-body" points="0,-30 35,30 -35,30" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 3 bead dots on bottom edge -->
      <circle cx="-17.5" cy="30" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="-18.3" cy="29.2" r="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="0" cy="30" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="-0.8" cy="29.2" r="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="17.5" cy="30" r="5" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="16.7" cy="29.2" r="1.5" fill="#ffffff" opacity="0.6"/>
    </g>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Subtle Row Dividers -->
  <line x1="45" y1="98" x2="735" y2="98" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,5" opacity="0.35"/>
  <line x1="45" y1="183" x2="735" y2="183" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,5" opacity="0.35"/>
  <line x1="45" y1="268" x2="735" y2="268" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,5" opacity="0.35"/>

  <!-- ==================== ROW 1: T1 + T2 + T3 = 1368 ==================== -->
  <g transform="translate(0, 55)">
    <!-- Col 1: Triangle 1 -->
    <use href="#triRight" x="95" y="0"/>
    <!-- Op 1: + -->
    <text x="195" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#3b82f6" text-anchor="middle">+</text>
    <!-- Col 2: Triangle 2 -->
    <use href="#triLeft" x="295" y="0"/>
    <!-- Op 2: + -->
    <text x="395" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#3b82f6" text-anchor="middle">+</text>
    <!-- Col 3: Triangle 3 -->
    <use href="#triBottom" x="495" y="0"/>
    <!-- Equal: = -->
    <text x="590" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#94a3b8" text-anchor="middle">=</text>
    <!-- Value: 1368 -->
    <g transform="translate(680, 0)">
      <rect class="card-box" x="-48" y="-22" width="96" height="44" rx="10" stroke-width="1.5" filter="url(#badgeShadow)"/>
      <text class="card-text" x="0" y="9" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" text-anchor="middle">1368</text>
    </g>
  </g>

  <!-- ==================== ROW 2: T1 - T2 - T3 = 210 ==================== -->
  <g transform="translate(0, 140)">
    <!-- Col 1: Triangle 1 -->
    <use href="#triRight" x="95" y="0"/>
    <!-- Op 1: - -->
    <text x="195" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" fill="#f43f5e" text-anchor="middle">−</text>
    <!-- Col 2: Triangle 2 -->
    <use href="#triLeft" x="295" y="0"/>
    <!-- Op 2: - -->
    <text x="395" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" fill="#f43f5e" text-anchor="middle">−</text>
    <!-- Col 3: Triangle 3 -->
    <use href="#triBottom" x="495" y="0"/>
    <!-- Equal: = -->
    <text x="590" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#94a3b8" text-anchor="middle">=</text>
    <!-- Value: 210 -->
    <g transform="translate(680, 0)">
      <rect class="card-box" x="-48" y="-22" width="96" height="44" rx="10" stroke-width="1.5" filter="url(#badgeShadow)"/>
      <text class="card-text" x="0" y="9" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" text-anchor="middle">210</text>
    </g>
  </g>

  <!-- ==================== ROW 3: T1 + T2 - T3 = 1122 ==================== -->
  <g transform="translate(0, 225)">
    <!-- Col 1: Triangle 1 -->
    <use href="#triRight" x="95" y="0"/>
    <!-- Op 1: + -->
    <text x="195" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#3b82f6" text-anchor="middle">+</text>
    <!-- Col 2: Triangle 2 -->
    <use href="#triLeft" x="295" y="0"/>
    <!-- Op 2: - -->
    <text x="395" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" fill="#f43f5e" text-anchor="middle">−</text>
    <!-- Col 3: Triangle 3 -->
    <use href="#triBottom" x="495" y="0"/>
    <!-- Equal: = -->
    <text x="590" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#94a3b8" text-anchor="middle">=</text>
    <!-- Value: 1122 -->
    <g transform="translate(680, 0)">
      <rect class="card-box" x="-48" y="-22" width="96" height="44" rx="10" stroke-width="1.5" filter="url(#badgeShadow)"/>
      <text class="card-text" x="0" y="9" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" text-anchor="middle">1122</text>
    </g>
  </g>

  <!-- ==================== ROW 4: T1 - T2 + T3 = 456 (SOLUTION) ==================== -->
  <g transform="translate(0, 310)">
    <!-- Col 1: Triangle 1 -->
    <use href="#triRight" x="95" y="0"/>
    <!-- Op 1: - -->
    <text x="195" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" fill="#f43f5e" text-anchor="middle">−</text>
    <!-- Col 2: Triangle 2 -->
    <use href="#triLeft" x="295" y="0"/>
    <!-- Op 2: + -->
    <text x="395" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#3b82f6" text-anchor="middle">+</text>
    <!-- Col 3: Triangle 3 -->
    <use href="#triBottom" x="495" y="0"/>
    <!-- Equal: = -->
    <text x="590" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#94a3b8" text-anchor="middle">=</text>
    <!-- Value Solution: 456 in Emerald Badge -->
    <g transform="translate(680, 0)">
      <rect class="card-emerald" x="-48" y="-22" width="96" height="44" rx="10" stroke-width="2" filter="url(#glowEmerald)"/>
      <text class="card-emerald-text" x="0" y="9" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle">456</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SOLUTION SUMMARY ==================== -->
  <line x1="45" y1="358" x2="735" y2="358" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Card 1: Triangle Right = 789 -->
  <g transform="translate(50, 375)">
    <rect class="card-box" x="0" y="0" width="155" height="74" rx="12" stroke-width="1.5" filter="url(#badgeShadow)"/>
    <use href="#triRight" transform="translate(35, 37) scale(0.65)"/>
    <text class="card-text" x="75" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">= 789</text>
  </g>

  <!-- Card 2: Triangle Left = 456 -->
  <g transform="translate(225, 375)">
    <rect class="card-box" x="0" y="0" width="155" height="74" rx="12" stroke-width="1.5" filter="url(#badgeShadow)"/>
    <use href="#triLeft" transform="translate(35, 37) scale(0.65)"/>
    <text class="card-text" x="75" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">= 456</text>
  </g>

  <!-- Card 3: Triangle Bottom = 123 -->
  <g transform="translate(400, 375)">
    <rect class="card-box" x="0" y="0" width="155" height="74" rx="12" stroke-width="1.5" filter="url(#badgeShadow)"/>
    <use href="#triBottom" transform="translate(35, 37) scale(0.65)"/>
    <text class="card-text" x="75" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">= 123</text>
  </g>

  <!-- Card 4: Equation Breakdown = 456 -->
  <g transform="translate(575, 375)">
    <rect class="card-emerald" x="0" y="0" width="165" height="74" rx="12" stroke-width="1.5" filter="url(#badgeShadow)"/>
    <text class="card-emerald-text" x="82" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">789 − 456 + 123</text>
    <text class="card-emerald-sub" x="82" y="56" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">= 456 ✓</text>
  </g>
</svg>
