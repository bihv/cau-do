<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Light theme default */
      .badge-purple { fill: #f5f3ff; stroke: #c4b5fd; }
      .badge-purple-text { fill: #6d28d9; }
      .badge-blue { fill: #eff6ff; stroke: #93c5fd; }
      .badge-blue-text { fill: #1d4ed8; }
      .badge-amber { fill: #fffbeb; stroke: #fcd34d; }
      .badge-amber-text { fill: #b45309; }
      .badge-rose { fill: #fff1f2; stroke: #fda4af; }
      .badge-rose-text { fill: #be123c; }

      .solution-zone { fill: #ecfdf5; stroke: #10b981; opacity: 0.85; }
      .summary-box { fill: #f1f5f9; stroke: #cbd5e1; }
      .summary-text { fill: #64748b; }
      .summary-winner { fill: #d1fae5; stroke: #10b981; }
      .summary-winner-text { fill: #047857; }

      /* Dark theme: solid opaque badge backgrounds and glowing texts */
      @media (prefers-color-scheme: dark) {
        .badge-purple { fill: #1e1b4b; stroke: #8b5cf6; }
        .badge-purple-text { fill: #ddd6fe; }
        .badge-blue { fill: #172554; stroke: #3b82f6; }
        .badge-blue-text { fill: #bfdbfe; }
        .badge-amber { fill: #451a03; stroke: #f59e0b; }
        .badge-amber-text { fill: #fde68a; }
        .badge-rose { fill: #4c0519; stroke: #f43f5e; }
        .badge-rose-text { fill: #fecdd3; }

        .solution-zone { fill: rgba(16, 185, 129, 0.18); stroke: #10b981; opacity: 1; }
        .summary-box { fill: #1e293b; stroke: #334155; }
        .summary-text { fill: #94a3b8; }
        .summary-winner { fill: rgba(16, 185, 129, 0.25); stroke: #10b981; }
        .summary-winner-text { fill: #34d399; }
      }
    ]]></style>

    <!-- Shadow Filter (objectBoundingBox) -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <filter id="glowSuccess" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>

    <!-- Arrow Marker Right -->
    <marker id="arrowRight" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRightBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRightAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrowRightRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowLeftPurple" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Grid Guide Lines -->
  <!-- Axis positions: x=0 -> 120, x=1 -> 200, x=5 -> 360, x=10 -> 520, x=20 -> 680 -->

  <!-- Solution Highlight Zone: x < 1 (from 120 to 200) -->
  <rect class="solution-zone" x="120" y="45" width="80" height="265" rx="8" stroke-width="2" stroke-dasharray="6,4" filter="url(#glowSuccess)"/>

  <!-- Winner Badge for x < 1 -->
  <g transform="translate(160, 45)">
    <rect x="-55" y="-18" width="110" height="32" rx="16" fill="#10b981" filter="url(#cardShadow)"/>
    <!-- Checkmark icon -->
    <circle cx="-35" cy="-2" r="9" fill="#ffffff"/>
    <path d="M -39 -2 L -36 1 L -31 -5" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Label -->
    <text x="5" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">x &lt; 1</text>
  </g>

  <!-- 4 Intervals (Ranges) of 4 people -->

  <!-- 1. Bính: x < 20 (y = 95) -->
  <g>
    <!-- Interval bar tracks (split around badge 225..355) -->
    <rect x="70" y="92.5" width="155" height="5" rx="2.5" fill="#8b5cf6" opacity="0.3"/>
    <rect x="355" y="92.5" width="325" height="5" rx="2.5" fill="#8b5cf6" opacity="0.3"/>
    <!-- Lines (split so they don't cross under badge) -->
    <line x1="680" y1="95" x2="355" y2="95" stroke="#7c3aed" stroke-width="3.5"/>
    <line x1="225" y1="95" x2="70" y2="95" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#arrowLeftPurple)"/>
    <!-- Open circle at 20 -->
    <circle cx="680" cy="95" r="7" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <!-- Label Badge -->
    <rect class="badge-purple" x="225" y="81" width="130" height="28" rx="14" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text class="badge-purple-text" x="290" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Bính: x &lt; 20</text>
  </g>

  <!-- 2. Đinh: x >= 1 (y = 145) -->
  <g>
    <!-- Interval bar tracks (split around badge 225..355) -->
    <rect x="200" y="142.5" width="25" height="5" rx="2.5" fill="#3b82f6" opacity="0.3"/>
    <rect x="355" y="142.5" width="375" height="5" rx="2.5" fill="#3b82f6" opacity="0.3"/>
    <!-- Lines (split so they don't cross under badge) -->
    <line x1="200" y1="145" x2="225" y2="145" stroke="#2563eb" stroke-width="3.5"/>
    <line x1="355" y1="145" x2="730" y2="145" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrowRightBlue)"/>
    <!-- Solid circle at 1 -->
    <circle cx="200" cy="145" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <!-- Label Badge -->
    <rect class="badge-blue" x="225" y="131" width="130" height="28" rx="14" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text class="badge-blue-text" x="290" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Đinh: x ≥ 1</text>
  </g>

  <!-- 3. Giáp: x >= 5 (y = 195) -->
  <g>
    <!-- Interval bar tracks (split around badge 385..515) -->
    <rect x="360" y="192.5" width="25" height="5" rx="2.5" fill="#f59e0b" opacity="0.3"/>
    <rect x="515" y="192.5" width="215" height="5" rx="2.5" fill="#f59e0b" opacity="0.3"/>
    <!-- Lines (split so they don't cross under badge) -->
    <line x1="360" y1="195" x2="385" y2="195" stroke="#d97706" stroke-width="3.5"/>
    <line x1="515" y1="195" x2="730" y2="195" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrowRightAmber)"/>
    <!-- Solid circle at 5 -->
    <circle cx="360" cy="195" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
    <!-- Label Badge -->
    <rect class="badge-amber" x="385" y="181" width="130" height="28" rx="14" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text class="badge-amber-text" x="450" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Giáp: x ≥ 5</text>
  </g>

  <!-- 4. Ất: x >= 10 (y = 245) -->
  <g>
    <!-- Interval bar tracks (split around badge 545..675) -->
    <rect x="520" y="242.5" width="25" height="5" rx="2.5" fill="#f43f5e" opacity="0.3"/>
    <rect x="675" y="242.5" width="55" height="5" rx="2.5" fill="#f43f5e" opacity="0.3"/>
    <!-- Lines (split so they don't cross under badge) -->
    <line x1="520" y1="245" x2="545" y2="245" stroke="#e11d48" stroke-width="3.5"/>
    <line x1="675" y1="245" x2="730" y2="245" stroke="#e11d48" stroke-width="3.5" marker-end="url(#arrowRightRose)"/>
    <!-- Solid circle at 10 -->
    <circle cx="520" cy="245" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2"/>
    <!-- Label Badge -->
    <rect class="badge-rose" x="545" y="231" width="130" height="28" rx="14" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text class="badge-rose-text" x="610" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Ất: x ≥ 10</text>
  </g>

  <!-- Main Number Axis (y = 310) -->
  <g>
    <!-- Axis line -->
    <line x1="60" y1="310" x2="745" y2="310" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowRight)"/>

    <!-- Vertical tick lines up through ranges -->
    <!-- Tick 0 -->
    <line x1="120" y1="70" x2="120" y2="318" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="120" cy="310" r="4.5" fill="#94a3b8" stroke="#ffffff" stroke-width="1.2"/>
    <text x="120" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">0</text>

    <!-- Tick 1 -->
    <line x1="200" y1="70" x2="200" y2="318" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="200" cy="310" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
    <text x="200" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#3b82f6" text-anchor="middle">1</text>

    <!-- Tick 5 -->
    <line x1="360" y1="70" x2="360" y2="318" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="360" cy="310" r="4.5" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/>
    <text x="360" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#f59e0b" text-anchor="middle">5</text>

    <!-- Tick 10 -->
    <line x1="520" y1="70" x2="520" y2="318" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="520" cy="310" r="4.5" fill="#e11d48" stroke="#ffffff" stroke-width="1.2"/>
    <text x="520" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#f43f5e" text-anchor="middle">10</text>

    <!-- Tick 20 -->
    <line x1="680" y1="70" x2="680" y2="318" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="680" cy="310" r="4.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.2"/>
    <text x="680" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#a855f7" text-anchor="middle">20</text>

    <!-- Axis Unit Label: Positioned above arrow at y=298 so it NEVER collides with tick 20 -->
    <text x="745" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="end">(triệu đồng)</text>
  </g>

  <!-- Summary Count Bar under Axis -->
  <g transform="translate(0, 360)">
    <!-- Zone 1: x < 1 (width 80 from 120) -->
    <rect class="summary-winner" x="120" y="0" width="80" height="24" rx="6" stroke-width="1.5"/>
    <text class="summary-winner-text" x="160" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1 người (✓)</text>

    <!-- Zone 2: 1 <= x < 5 (width 160 from 200) -->
    <rect class="summary-box" x="204" y="0" width="152" height="24" rx="6" stroke-width="1"/>
    <text class="summary-text" x="280" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">2 người</text>

    <!-- Zone 3: 5 <= x < 10 (width 160 from 360) -->
    <rect class="summary-box" x="364" y="0" width="152" height="24" rx="6" stroke-width="1"/>
    <text class="summary-text" x="440" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">3 người</text>

    <!-- Zone 4: 10 <= x < 20 (width 160 from 520) -->
    <rect class="summary-box" x="524" y="0" width="152" height="24" rx="6" stroke-width="1"/>
    <text class="summary-text" x="600" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">4 người</text>

    <!-- Zone 5: x >= 20 (width 60 from 680) -->
    <rect class="summary-box" x="684" y="0" width="55" height="24" rx="6" stroke-width="1"/>
    <text class="summary-text" x="711" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">3 người</text>
  </g>
</svg>
