<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" width="100%" height="100%">
  <defs>
    <!-- Shadow filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="gem-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.45"/>
    </filter>
    <filter id="moved-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>

    <!-- Gold Gradients -->
    <linearGradient id="gold-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="gold-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="bezel-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Sapphire Gem Gradients -->
    <radialGradient id="gem-body" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="85%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="gem-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Reusable Gem Component -->
    <g id="sapphire-gem">
      <circle cx="0" cy="0" r="16" fill="url(#bezel-gold)" filter="url(#gem-glow)"/>
      <circle cx="0" cy="0" r="14.5" fill="#713f12"/>
      <circle cx="0" cy="0" r="13.5" fill="url(#gem-body)"/>
      <polygon points="0,-12 8,-4 0,-1 -8,-4" fill="#60a5fa" opacity="0.6"/>
      <polygon points="0,12 8,4 0,1 -8,4" fill="#172554" opacity="0.7"/>
      <polygon points="-12,0 -4,-8 -1,0 -4,8" fill="#3b82f6" opacity="0.5"/>
      <polygon points="12,0 4,-8 1,0 4,8" fill="#1e40af" opacity="0.7"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8" opacity="0.75"/>
      <ellipse cx="-4" cy="-5" rx="4" ry="2.5" transform="rotate(-30 -4 -5)" fill="url(#gem-highlight)"/>
      <circle cx="4" cy="4" r="1.2" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Relocated Gem Component -->
    <g id="relocated-gem">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,2"/>
      <circle cx="0" cy="0" r="16" fill="url(#bezel-gold)" filter="url(#moved-glow)"/>
      <circle cx="0" cy="0" r="14.5" fill="#78350f"/>
      <circle cx="0" cy="0" r="13.5" fill="url(#gem-body)"/>
      <polygon points="0,-12 8,-4 0,-1 -8,-4" fill="#93c5fd" opacity="0.8"/>
      <polygon points="0,12 8,4 0,1 -8,4" fill="#172554" opacity="0.7"/>
      <circle cx="0" cy="0" r="5" fill="#67e8f9" opacity="0.85"/>
      <ellipse cx="-4" cy="-5" rx="4" ry="2.5" transform="rotate(-30 -4 -5)" fill="url(#gem-highlight)"/>
      <circle cx="4" cy="4" r="1.2" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Empty Socket Component -->
    <g id="empty-socket">
      <circle cx="0" cy="0" r="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="3,3"/>
      <circle cx="0" cy="0" r="4" fill="#e2e8f0"/>
    </g>
  </defs>

  <!-- Cross Group -->
  <g filter="url(#drop-shadow)">
    <!-- Outer Gold Rim -->
    <path d="
      M 356,12 L 444,12
      L 444,226 L 759,226
      L 759,314 L 444,314
      L 444,699 L 356,699
      L 356,314 L 41,314
      L 41,226 L 356,226
      Z"
      fill="url(#gold-outer)" stroke="#854d0e" stroke-width="4" stroke-linejoin="round"/>

    <!-- Inner Cream/Ivory Body -->
    <path d="
      M 364,20 L 436,20
      L 436,234 L 751,234
      L 751,306 L 436,306
      L 436,691 L 364,691
      L 364,306 L 49,306
      L 49,234 L 364,234
      Z"
      fill="url(#gold-inner)" stroke="#ca8a04" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Decorative Filigree Border -->
    <path d="
      M 370,26 L 430,26
      L 430,240 L 745,240
      L 745,300 L 430,300
      L 430,685 L 370,685
      L 370,300 L 55,300
      L 55,240 L 370,240
      Z"
      fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="6,3"/>
  </g>

  <!-- Gemstones Placement: Trường hợp 1 (25 viên - No Text) -->
  <g id="gems-solution-2vien">
    <!-- Center (1) -->
    <use href="#sapphire-gem" x="400" y="270"/>

    <!-- Top Arm (6) -->
    <use href="#sapphire-gem" x="400" y="228"/>
    <use href="#sapphire-gem" x="400" y="190"/>
    <use href="#sapphire-gem" x="400" y="152"/>
    <use href="#sapphire-gem" x="400" y="114"/>
    <use href="#sapphire-gem" x="400" y="76"/>
    <use href="#relocated-gem" x="400" y="38"/>

    <!-- Left Arm (6) -->
    <use href="#sapphire-gem" x="356" y="270"/>
    <use href="#sapphire-gem" x="312" y="270"/>
    <use href="#sapphire-gem" x="268" y="270"/>
    <use href="#sapphire-gem" x="224" y="270"/>
    <use href="#sapphire-gem" x="180" y="270"/>
    <use href="#sapphire-gem" x="136" y="270"/>
    <use href="#empty-socket" x="92" y="270"/>

    <!-- Right Arm (6) -->
    <use href="#sapphire-gem" x="444" y="270"/>
    <use href="#sapphire-gem" x="488" y="270"/>
    <use href="#sapphire-gem" x="532" y="270"/>
    <use href="#sapphire-gem" x="576" y="270"/>
    <use href="#sapphire-gem" x="620" y="270"/>
    <use href="#sapphire-gem" x="664" y="270"/>
    <use href="#empty-socket" x="708" y="270"/>

    <!-- Bottom Arm (6) -->
    <use href="#sapphire-gem" x="400" y="314"/>
    <use href="#sapphire-gem" x="400" y="358"/>
    <use href="#sapphire-gem" x="400" y="402"/>
    <use href="#sapphire-gem" x="400" y="446"/>
    <use href="#sapphire-gem" x="400" y="490"/>
    <use href="#sapphire-gem" x="400" y="534"/>
    <use href="#empty-socket" x="400" y="578"/>

    <!-- Subtle Transfer Indicator Arrow (No Text) -->
    <path d="M 370,578 C 310,578 310,38 368,38" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="6,4"/>
    <polygon points="368,34 378,38 368,42" fill="#f59e0b"/>
  </g>
</svg>
