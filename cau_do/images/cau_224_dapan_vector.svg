<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      .badge-blue { fill: #eff6ff; stroke: #3b82f6; }
      .badge-blue-title { fill: #1d4ed8; }
      .badge-emerald { fill: #f0fdf4; stroke: #10b981; }
      .badge-emerald-title { fill: #047857; }
      .badge-sub { fill: #64748b; }

      @media (prefers-color-scheme: dark) {
        .badge-blue { fill: rgba(59, 130, 246, 0.2); stroke: #60a5fa; }
        .badge-blue-title { fill: #93c5fd; }
        .badge-emerald { fill: rgba(16, 185, 129, 0.2); stroke: #10b981; }
        .badge-emerald-title { fill: #34d399; }
        .badge-sub { fill: #94a3b8; }
      }
    ]]></style>
    <!-- Card Shadow (objectBoundingBox) -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Coin Drop Shadow -->
    <filter id="coinShadow" x="-25%" y="-25%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>

    <!-- Top Stacked Coin Shadow onto Bottom Coin -->
    <filter id="stackShadow" x="-25%" y="-25%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="-2" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>

    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>

    <!-- Coin Outer Rim Gradient (Gold/Bronze Metallic) -->
    <linearGradient id="coinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Coin Face Radial Gradient -->
    <radialGradient id="coinFace" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>

    <!-- Arrow Marker -->
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Guide Lines for Row & Column -->
  <line x1="400" y1="75" x2="400" y2="310" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="250" y1="225" x2="485" y2="225" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Ghost Outline of Moved Coin (V5 at bottom: 400, 353) -->
  <g transform="translate(400, 353)">
    <circle cx="0" cy="0" r="31" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Vị trí cũ</text>
  </g>

  <!-- Motion Curved Arrow from (400, 353) to (400, 225) -->
  <path d="M 435 345 C 530 320 530 250 445 228" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="7,4" marker-end="url(#arrowEmerald)" filter="url(#glowEmerald)"/>
  
  <!-- Motion Annotation Badge -->
  <g transform="translate(545, 290)">
    <rect class="badge-emerald" x="-65" y="-18" width="130" height="38" rx="10" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text class="badge-emerald-title" x="0" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Di chuyển 1 xu</text>
    <text class="badge-sub" x="0" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">đặt chồng lên tâm</text>
  </g>

  <!-- 6 FLAT COINS (Unchanged Positions) -->
  <!-- 1. V1 (Top): (400, 97) -->
  <g transform="translate(400, 97)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 2. V2: (400, 161) -->
  <g transform="translate(400, 161)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 3. H1 (Leftmost): (272, 225) -->
  <g transform="translate(272, 225)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 4. H2: (336, 225) -->
  <g transform="translate(336, 225)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 5. H4 (Rightmost): (464, 225) -->
  <g transform="translate(464, 225)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 6. V4: (400, 289) -->
  <g transform="translate(400, 289)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="-1" cy="-1" r="9" fill="none" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- 7 & 8: THE STACKED COINS AT CENTER (Intersection: 400, 225) -->
  <!-- Bottom Coin at Center -->
  <g transform="translate(398, 227)" filter="url(#coinShadow)">
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
  </g>

  <!-- Top Coin at Center (Stacked, offset slightly with shadow and Emerald Glow) -->
  <g transform="translate(403, 221)" filter="url(#stackShadow)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="33" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#glowEmerald)"/>
    <circle cx="0" cy="0" r="31" fill="url(#coinRim)"/>
    <circle cx="0" cy="0" r="28" fill="url(#coinFace)"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,2"/>
    <!-- "x2" badge inside center of stacked coin -->
    <circle cx="0" cy="0" r="12" fill="#047857"/>
    <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">2×</text>
  </g>

  <!-- Badges Indicating the 5 & 5 Result -->
  <!-- Vertical Count Badge: 5 coins -->
  <g transform="translate(480, 97)">
    <rect class="badge-blue" x="0" y="0" width="145" height="42" rx="10" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text class="badge-blue-title" x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">Hàng dọc: 5 xu</text>
    <text class="badge-sub" x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">(3 vị trí 1 xu + 1 vị trí 2 xu)</text>
  </g>

  <!-- Horizontal Count Badge: 5 coins -->
  <g transform="translate(100, 260)">
    <rect class="badge-emerald" x="0" y="0" width="145" height="42" rx="10" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text class="badge-emerald-title" x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">Hàng ngang: 5 xu</text>
    <text class="badge-sub" x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">(3 vị trí 1 xu + 1 vị trí 2 xu)</text>
  </g>

  <!-- Winner Banner Top Left -->
  <g transform="translate(35, 45)">
    <rect x="0" y="0" width="235" height="38" rx="19" fill="#10b981" filter="url(#cardShadow)"/>
    <circle cx="22" cy="19" r="11" fill="#ffffff"/>
    <path d="M 17 19 L 20 22 L 26 16" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Đạt chuẩn: 5 dọc, 5 ngang!</text>
  </g>
</svg>
