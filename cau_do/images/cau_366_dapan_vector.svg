<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" width="100%" height="100%">
  <defs>
    <!-- Metallic Pulley Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Brass / Weight Gradient -->
    <linearGradient id="weightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Monkey Brown Gradient -->
    <linearGradient id="monkeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="monkeyFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ceiling Mount -->
  <rect x="240" y="20" width="100" height="12" rx="4" fill="#334155"/>
  <rect x="284" y="32" width="12" height="35" fill="#64748b"/>

  <!-- Pulley Wheel -->
  <g filter="url(#shadow)">
    <circle cx="290" cy="105" r="42" fill="url(#metalGrad)" stroke="#0f172a" stroke-width="2"/>
    <circle cx="290" cy="105" r="36" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    
    <line x1="290" y1="68" x2="290" y2="142" stroke="#64748b" stroke-width="2.5"/>
    <line x1="253" y1="105" x2="327" y2="105" stroke="#64748b" stroke-width="2.5"/>
    <line x1="264" y1="79" x2="316" y2="131" stroke="#64748b" stroke-width="2.5"/>
    <line x1="264" y1="131" x2="316" y2="79" stroke="#64748b" stroke-width="2.5"/>

    <circle cx="290" cy="105" r="13" fill="url(#metalGrad)"/>
    <circle cx="290" cy="105" r="4" fill="#f1f5f9"/>
  </g>

  <!-- Rope -->
  <path d="M 248,105 A 42,42 0 0,1 332,105" fill="none" stroke="#d97706" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left hanging segment -->
  <line x1="248" y1="105" x2="248" y2="280" stroke="#d97706" stroke-width="4" stroke-dasharray="8,2"/>
  <!-- Right hanging segment -->
  <line x1="332" y1="105" x2="332" y2="450" stroke="#d97706" stroke-width="4" stroke-dasharray="8,2"/>

  <!-- Initial Position (Ghost line) -->
  <line x1="180" y1="390" x2="400" y2="390" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Current Equal Level Reference Line (Green) -->
  <line x1="140" y1="310" x2="440" y2="310" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Left Side: 10kg Counterweight (Elevated to y=300) -->
  <g filter="url(#shadow)">
    <circle cx="248" cy="286" r="8" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M 238,294 L 258,294 L 276,355 L 220,355 Z" fill="url(#weightGrad)" stroke="#78350f" stroke-width="2" stroke-linejoin="round"/>
    <rect x="216" y="355" width="64" height="8" rx="3" fill="#92400e"/>
    <text x="248" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#451a03" text-anchor="middle">10 kg</text>
  </g>

  <!-- Force Vectors on Weight -->
  <!-- Tension T (Upward) -->
  <g transform="translate(210, 270)">
    <line x1="0" y1="30" x2="0" y2="0" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-4,8 0,0 4,8" fill="#10b981"/>
    <text x="-12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#047857">T</text>
  </g>
  <!-- Gravity P (Downward) -->
  <g transform="translate(210, 370)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-4,22 0,30 4,22" fill="#ef4444"/>
    <text x="-14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">P</text>
  </g>
  <!-- Velocity v (Upward) -->
  <g transform="translate(175, 310)">
    <line x1="0" y1="30" x2="0" y2="-10" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-4,-2 0,-10 4,-2" fill="#3b82f6"/>
    <text x="-14" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#1d4ed8">v₁</text>
  </g>

  <!-- Right Side: 10kg Monkey (Elevated to y=300) -->
  <g transform="translate(332, 300)" filter="url(#shadow)">
    <!-- Tail -->
    <path d="M 12,25 C 35,40 45,75 25,95 C 15,105 5,95 10,85 C 15,75 25,60 10,40" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Arm & Hand holding rope -->
    <path d="M -5,-15 Q -15,-20 0,-30" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-30" r="5" fill="#fdba74"/>

    <!-- Right Arm & Hand holding rope -->
    <path d="M 5,-10 Q -5,0 0,10" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="5" fill="#fdba74"/>

    <!-- Legs & Feet holding rope -->
    <path d="M -5,15 Q -15,30 0,35" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
    <path d="M 8,15 Q 15,30 0,40" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="35" r="5" fill="#fdba74"/>
    <circle cx="0" cy="40" r="5" fill="#fdba74"/>

    <!-- Body -->
    <ellipse cx="6" cy="5" rx="16" ry="22" fill="url(#monkeyGrad)"/>
    <ellipse cx="6" cy="5" rx="10" ry="15" fill="url(#monkeyFace)"/>

    <!-- Ears -->
    <circle cx="-6" cy="-28" r="7" fill="#78350f"/>
    <circle cx="-6" cy="-28" r="4" fill="#fdba74"/>
    <circle cx="26" cy="-28" r="7" fill="#78350f"/>
    <circle cx="26" cy="-28" r="4" fill="#fdba74"/>

    <!-- Head -->
    <circle cx="10" cy="-28" r="16" fill="url(#monkeyGrad)"/>
    <ellipse cx="7" cy="-26" rx="6" ry="8" fill="url(#monkeyFace)"/>
    <ellipse cx="13" cy="-26" rx="6" ry="8" fill="url(#monkeyFace)"/>
    <ellipse cx="10" cy="-22" rx="7" ry="6" fill="url(#monkeyFace)"/>

    <circle cx="7" cy="-26" r="2.5" fill="#1e293b"/>
    <circle cx="13" cy="-26" r="2.5" fill="#1e293b"/>
    <path d="M 8,-19 Q 10,-16 12,-19" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Weight badge on Monkey -->
    <rect x="28" y="-5" width="48" height="22" rx="6" fill="#3b82f6" filter="url(#shadow)"/>
    <text x="52" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">10 kg</text>
  </g>

  <!-- Force Vectors on Monkey -->
  <!-- Tension T (Upward) -->
  <g transform="translate(370, 240)">
    <line x1="0" y1="30" x2="0" y2="0" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-4,8 0,0 4,8" fill="#10b981"/>
    <text x="8" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#047857">T</text>
  </g>
  <!-- Gravity P (Downward) -->
  <g transform="translate(370, 360)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-4,22 0,30 4,22" fill="#ef4444"/>
    <text x="8" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">P</text>
  </g>
  <!-- Velocity v (Upward) -->
  <g transform="translate(420, 310)">
    <line x1="0" y1="30" x2="0" y2="-10" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-4,-2 0,-10 4,-2" fill="#3b82f6"/>
    <text x="8" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#1d4ed8">v₂</text>
  </g>

  <!-- Math Badge in center bottom -->
  <g transform="translate(290, 480)" filter="url(#shadow)">
    <rect x="-110" y="-18" width="220" height="36" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#065f46" text-anchor="middle">v₁ = v₂  |  h₁ = h₂</text>
  </g>
</svg>
