      <polygon points="486.0,137.0 522.0,165.0 594.0,165.0 558.0,137.0" fill="url(#emerald-dark)" stroke="#064e3b" stroke-width="2.2" stroke-linejoin="round"/>
        <polygon points="558.0,65.0 594.0,93.0 594.0,165.0 558.0,137.0" fill="url(#emerald-right)" stroke="#059669" stroke-width="2.2" stroke-linejoin="round"/>
        <polygon points="486.0,65.0 558.0,65.0 558.0,137.0 486.0,137.0" fill="url(#emerald-front)" stroke="#047857" stroke-width="2.2" stroke-linejoin="round"/>
        <polygon points="526.0,149.4 550.0,149.4 554.0,152.6 530.0,152.6" fill="#ffffff"/>
        <polygon points="530.0,146.3 538.0,146.3 550.0,155.7 542.0,155.7" fill="#ffffff"/>
