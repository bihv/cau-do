        <polygon points="530.0,341.3 538.0,341.3 550.0,350.7 542.0,350.7" fill="#ffffff"/>
        <polygon points="565.0,284.1 574.0,291.1 574.0,297.1 565.0,290.1" fill="#064e3b"/>
        <polygon points="568.0,280.4 571.0,282.7 571.0,300.7 568.0,298.4" fill="#064e3b"/>
        <polygon points="578.0,322.9 587.0,329.9 587.0,335.9 578.0,328.9" fill="#064e3b"/>
        <polygon points="581.0,319.3 584.0,321.6 584.0,339.6 581.0,337.3" fill="#064e3b"/>
        <polygon points="507.0,291.0 537.0,291.0 537.0,301.0 507.0,301.0" fill="#ffffff"/>
        <polygon points="517.0,281.0 527.0,281.0 527.0,311.0 517.0,311.0" fill="#ffffff"/>
      <circle cx="540.0" cy="422" r="16" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
      <text x="540.0" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#047857" text-anchor="middle" dominant-baseline="central">C</text>
      <circle cx="611" cy="244" r="11" fill="#10b981"/>
      <path d="M 607 244 L 610 247 L 615 240" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Option D -->
    <g opacity="0.38">
      <rect x="655" y="230" width="170" height="160" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <g filter="url(#shape-depth)">
        <polygon points="686.0,288.0 722.0,260.0 794.0,260.0 758.0,288.0" fill="#475569" stroke="#334155" stroke-width="1.8" stroke-linejoin="round"/>
