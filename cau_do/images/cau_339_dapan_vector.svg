<svg xmlns="http://www.w3.org/2000/svg" viewBox="220 35 435 470" width="100%" height="100%">
  <defs>
    <!-- Emerald Path Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>

    <!-- Dot Gradient -->
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>

    <!-- Dot Shadow -->
    <filter id="dotShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 6 Continuous Connected Line Segments -->
  <!-- Path: (280, 470) -> (280, 70) -> (600, 390) -> (360, 390) -> (360, 150) -> (600, 150) -> (280, 470) -->
  <g filter="url(#emeraldGlow)">
    <polyline points="280,470 280,70 600,390 360,390 360,150 600,150 280,470"
              fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Corner Turn Nodes -->
  <g fill="#ffffff" stroke="#047857" stroke-width="2.5">
    <circle cx="280" cy="470" r="6"/>
    <circle cx="280" cy="70" r="6"/>
    <circle cx="600" cy="390" r="6"/>
    <circle cx="360" cy="390" r="6"/>
    <circle cx="360" cy="150" r="6"/>
    <circle cx="600" cy="150" r="6"/>
  </g>

  <!-- 16 Dots on the Grid -->
  <g filter="url(#dotShadow)">
    <!-- Row 1 (y = 150) -->
    <circle cx="280" cy="150" r="13" fill="url(#dotGrad)"/>
    <circle cx="360" cy="150" r="13" fill="url(#dotGrad)"/>
    <circle cx="440" cy="150" r="13" fill="url(#dotGrad)"/>
    <circle cx="520" cy="150" r="13" fill="url(#dotGrad)"/>

    <!-- Row 2 (y = 230) -->
    <circle cx="280" cy="230" r="13" fill="url(#dotGrad)"/>
    <circle cx="360" cy="230" r="13" fill="url(#dotGrad)"/>
    <circle cx="440" cy="230" r="13" fill="url(#dotGrad)"/>
    <circle cx="520" cy="230" r="13" fill="url(#dotGrad)"/>

    <!-- Row 3 (y = 310) -->
    <circle cx="280" cy="310" r="13" fill="url(#dotGrad)"/>
    <circle cx="360" cy="310" r="13" fill="url(#dotGrad)"/>
    <circle cx="440" cy="310" r="13" fill="url(#dotGrad)"/>
    <circle cx="520" cy="310" r="13" fill="url(#dotGrad)"/>

    <!-- Row 4 (y = 390) -->
    <circle cx="280" cy="390" r="13" fill="url(#dotGrad)"/>
    <circle cx="360" cy="390" r="13" fill="url(#dotGrad)"/>
    <circle cx="440" cy="390" r="13" fill="url(#dotGrad)"/>
    <circle cx="520" cy="390" r="13" fill="url(#dotGrad)"/>
  </g>

  <!-- White Highlights on Dots -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="276" cy="146" r="3.5"/>
    <circle cx="356" cy="146" r="3.5"/>
    <circle cx="436" cy="146" r="3.5"/>
    <circle cx="516" cy="146" r="3.5"/>

    <circle cx="276" cy="226" r="3.5"/>
    <circle cx="356" cy="226" r="3.5"/>
    <circle cx="436" cy="226" r="3.5"/>
    <circle cx="516" cy="226" r="3.5"/>

    <circle cx="276" cy="306" r="3.5"/>
    <circle cx="356" cy="306" r="3.5"/>
    <circle cx="436" cy="306" r="3.5"/>
    <circle cx="516" cy="306" r="3.5"/>

    <circle cx="276" cy="386" r="3.5"/>
    <circle cx="356" cy="386" r="3.5"/>
    <circle cx="436" cy="386" r="3.5"/>
    <circle cx="516" cy="386" r="3.5"/>
  </g>
</svg>