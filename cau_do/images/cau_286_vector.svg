    <rect x="168" y="178.25" width="76" height="7.5" rx="3.75" fill="url(#wood-h)" stroke="#b45309" stroke-width="0.8"/>
    <rect x="233" y="176.75" width="13" height="10.5" rx="5" fill="url(#sulfur-red)"/>
