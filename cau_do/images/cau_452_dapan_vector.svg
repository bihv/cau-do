<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <!-- Shadow for Matchsticks (objectBoundingBox) -->
    <filter id="stickShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>

    <!-- Glow for Added Solution Matchsticks (objectBoundingBox) -->
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>

    <!-- Matchstick Gradient (Wood Amber - Outer) -->
    <linearGradient id="stickWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Solution Matchstick Gradient (Emerald 500 - 600) -->
    <linearGradient id="stickSolution" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Grid Origin: x0 = 190, y0 = 70, Unit U = 70. x in [0..6] (190..610), y in [0..4] (70..350) -->

  <!-- 3 Colored Congruent Pentomino Regions -->
  <!-- Region 1 (Indigo Tint): (0,0), (1,0), (2,0), (0,1), (2,1) -->
  <path d="M 190 70 L 400 70 L 400 210 L 330 210 L 330 140 L 260 140 L 260 210 L 190 210 Z"
        fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" opacity="0.85"/>

  <!-- Region 2 (Amber Tint): (3,1), (4,1), (5,1), (3,2), (5,2) -->
  <path d="M 400 140 L 610 140 L 610 280 L 540 280 L 540 210 L 470 210 L 470 280 L 400 280 Z"
        fill="#fef3c7" stroke="#fde68a" stroke-width="2" opacity="0.85"/>

  <!-- Region 3 (Emerald Tint): (2,2), (2,3), (3,3), (4,2), (4,3) -->
  <path d="M 330 210 L 400 210 L 400 280 L 470 280 L 470 210 L 540 210 L 540 350 L 330 350 Z"
        fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" opacity="0.85"/>

  <!-- Subtle Inner Grid Reference -->
  <g opacity="0.2" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3">
    <line x1="190" y1="70" x2="190" y2="350"/>
    <line x1="260" y1="70" x2="260" y2="350"/>
    <line x1="330" y1="70" x2="330" y2="350"/>
    <line x1="400" y1="70" x2="400" y2="350"/>
    <line x1="470" y1="70" x2="470" y2="350"/>
    <line x1="540" y1="70" x2="540" y2="350"/>
    <line x1="610" y1="70" x2="610" y2="350"/>
    <line x1="190" y1="70" x2="610" y2="70"/>
    <line x1="190" y1="140" x2="610" y2="140"/>
    <line x1="190" y1="210" x2="610" y2="210"/>
    <line x1="190" y1="280" x2="610" y2="280"/>
    <line x1="190" y1="350" x2="610" y2="350"/>
  </g>

  <!-- Region Badges: 1, 2, 3 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" text-anchor="middle">
    <!-- Badge 1 -->
    <circle cx="295" cy="105" r="15" fill="#3b82f6" filter="url(#stickShadow)"/>
    <text x="295" y="110" font-size="14" fill="#ffffff">1</text>

    <!-- Badge 2 -->
    <circle cx="505" cy="175" r="15" fill="#d97706" filter="url(#stickShadow)"/>
    <text x="505" y="180" font-size="14" fill="#ffffff">2</text>

    <!-- Badge 3 -->
    <circle cx="400" cy="315" r="15" fill="#059669" filter="url(#stickShadow)"/>
    <text x="400" y="320" font-size="14" fill="#ffffff">3</text>
  </g>

  <!-- 22 Outer Matchsticks (Wood Amber, slightly lowered opacity to highlight inner 7) -->
  <g filter="url(#stickShadow)" opacity="0.6">
    <!-- Horizontal -->
    <rect x="193" y="67" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="263" y="67" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="333" y="67" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="263" y="137" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="403" y="137" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="473" y="137" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="543" y="137" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="193" y="207" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="543" y="277" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="333" y="347" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="403" y="347" width="64" height="6" rx="3" fill="url(#stickWood)"/>
    <rect x="473" y="347" width="64" height="6" rx="3" fill="url(#stickWood)"/>

    <!-- Vertical -->
    <rect x="187" y="73" width="6" height="64" rx="3" fill="url(#stickWood)"/>
    <rect x="187" y="143" width="6" height="64" rx="3" fill="url(#stickWood)"/>
    <rect x="257" y="143" width="6" height="64" rx="3" fill="url(#stickWood)"/>
    <rect x="327" y="143" width="6" height="64" rx="3" fill="url(#stickWood)"/>
    <rect x="327" y="213" width="6" height="64" rx="3" fill="url(#stickWood)"/>
    <rect x="327" y="283" width="6" height="64" rx="3" fill="url(#stickWood)"/>
    <rect x="397" y="73" width="6" height="64" rx="3" fill="url(#stickWood)"/>
    <rect x="537" y="283" width="6" height="64" rx="3" fill="url(#stickWood)"/>
    <rect x="607" y="143" width="6" height="64" rx="3" fill="url(#stickWood)"/>
    <rect x="607" y="213" width="6" height="64" rx="3" fill="url(#stickWood)"/>
  </g>

  <!-- THE 7 ADDED MATCHSTICKS (Highlight Emerald with Glow) -->
  <g filter="url(#glowEmerald)">
    <!-- 1. Horizontal: (2,2) -> (3,2) -->
    <rect x="333" y="206" width="64" height="8" rx="4" fill="url(#stickSolution)"/>
    <!-- 2. Horizontal: (4,2) -> (5,2) -->
    <rect x="473" y="206" width="64" height="8" rx="4" fill="url(#stickSolution)"/>
    <!-- 3. Horizontal: (3,3) -> (4,3) -->
    <rect x="403" y="276" width="64" height="8" rx="4" fill="url(#stickSolution)"/>

    <!-- 4. Vertical: (3,1) -> (3,2) -->
    <rect x="396" y="143" width="8" height="64" rx="4" fill="url(#stickSolution)"/>
    <!-- 5. Vertical: (3,2) -> (3,3) -->
    <rect x="396" y="213" width="8" height="64" rx="4" fill="url(#stickSolution)"/>
    <!-- 6. Vertical: (4,2) -> (4,3) -->
    <rect x="466" y="213" width="8" height="64" rx="4" fill="url(#stickSolution)"/>
    <!-- 7. Vertical: (5,2) -> (5,3) -->
    <rect x="536" y="213" width="8" height="64" rx="4" fill="url(#stickSolution)"/>
  </g>

  <!-- Joint Dots (Outer & Inner) -->
  <g fill="#0f172a">
    <!-- Outer vertices -->
    <circle cx="190" cy="70" r="5" opacity="0.6"/>
    <circle cx="260" cy="70" r="5" opacity="0.6"/>
    <circle cx="330" cy="70" r="5" opacity="0.6"/>
    <circle cx="400" cy="70" r="5" opacity="0.6"/>
    <circle cx="190" cy="140" r="5" opacity="0.6"/>
    <circle cx="260" cy="140" r="5" opacity="0.6"/>
    <circle cx="330" cy="140" r="5" opacity="0.6"/>
    <circle cx="470" cy="140" r="5" opacity="0.6"/>
    <circle cx="540" cy="140" r="5" opacity="0.6"/>
    <circle cx="610" cy="140" r="5" opacity="0.6"/>
    <circle cx="190" cy="210" r="5" opacity="0.6"/>
    <circle cx="260" cy="210" r="5" opacity="0.6"/>
    <circle cx="330" cy="210" r="5" opacity="0.6"/>
    <circle cx="610" cy="210" r="5" opacity="0.6"/>
    <circle cx="330" cy="280" r="5" opacity="0.6"/>
    <circle cx="540" cy="280" r="5" opacity="0.6"/>
    <circle cx="610" cy="280" r="5" opacity="0.6"/>
    <circle cx="330" cy="350" r="5" opacity="0.6"/>
    <circle cx="400" cy="350" r="5" opacity="0.6"/>
    <circle cx="470" cy="350" r="5" opacity="0.6"/>
    <circle cx="540" cy="350" r="5" opacity="0.6"/>

    <!-- Solution Inner Vertices (Highlighted with Emerald Ring) -->
    <circle cx="400" cy="140" r="6" fill="#10b981"/>
    <circle cx="400" cy="210" r="6" fill="#10b981"/>
    <circle cx="470" cy="210" r="6" fill="#10b981"/>
    <circle cx="540" cy="210" r="6" fill="#10b981"/>
    <circle cx="400" cy="280" r="6" fill="#10b981"/>
    <circle cx="470" cy="280" r="6" fill="#10b981"/>
  </g>

  <!-- Winner Badge Top Right -->
  <g transform="translate(685, 55)">
    <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#10b981" filter="url(#cardShadow)"/>
    <circle cx="-38" cy="0" r="10" fill="#ffffff"/>
    <path d="M -42 0 L -39 3 L -34 -4" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">+7 que diêm</text>
  </g>
</svg>
