<svg xmlns="http://www.w3.org/2000/svg" viewBox="190 60 340 350" width="100%" height="100%">
  <defs>
    <!-- Standard Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <!-- Emerald Winner Sphere Gradient -->
    <radialGradient id="emeraldGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>

    <!-- Sphere Shadow -->
    <filter id="sphereShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Motion Arrows for the 3 Spheres -->
  <g stroke="#059669" stroke-width="3.5" stroke-linecap="round">
    <!-- 1. Top Apex (360, 100) -> Destination (240, 166) -->
    <line x1="345" y1="110" x2="258" y2="158" marker-end="url(#arrowEmerald)"/>

    <!-- 2. Bottom Right (480, 298) -> Destination (480, 166) -->
    <line x1="480" y1="275" x2="480" y2="188" marker-end="url(#arrowEmerald)"/>

    <!-- 3. Bottom Left (240, 298) -> Destination (360, 364) -->
    <line x1="255" y1="308" x2="342" y2="354" marker-end="url(#arrowEmerald)"/>
  </g>

  <!-- 3 Original Positions (Hollow Faded Rings) -->
  <circle cx="360" cy="100" r="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="480" cy="298" r="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="240" cy="298" r="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 7 Stationary Spheres (Deep Slate) -->
  <g filter="url(#sphereShadow)">
    <!-- Row 2 middle: (320, 166), (400, 166) -->
    <circle cx="320" cy="166" r="18" fill="url(#sphereGrad)"/>
    <circle cx="400" cy="166" r="18" fill="url(#sphereGrad)"/>

    <!-- Row 3: (280, 232), (360, 232), (440, 232) -->
    <circle cx="280" cy="232" r="18" fill="url(#sphereGrad)"/>
    <circle cx="360" cy="232" r="18" fill="url(#sphereGrad)"/>
    <circle cx="440" cy="232" r="18" fill="url(#sphereGrad)"/>

    <!-- Row 4 middle: (320, 298), (400, 298) -->
    <circle cx="320" cy="298" r="18" fill="url(#sphereGrad)"/>
    <circle cx="400" cy="298" r="18" fill="url(#sphereGrad)"/>
  </g>

  <!-- Specular Highlights on Stationary Spheres -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="314" cy="160" r="5"/>
    <circle cx="394" cy="160" r="5"/>
    <circle cx="274" cy="226" r="5"/>
    <circle cx="354" cy="226" r="5"/>
    <circle cx="434" cy="226" r="5"/>
    <circle cx="314" cy="292" r="5"/>
    <circle cx="394" cy="292" r="5"/>
  </g>

  <!-- 3 Moved Spheres in NEW POSITIONS (Glowing Emerald) -->
  <g filter="url(#sphereShadow)">
    <!-- Destination 1: (240, 166) -->
    <circle cx="240" cy="166" r="19" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="2"/>
    <!-- Destination 2: (480, 166) -->
    <circle cx="480" cy="166" r="19" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="2"/>
    <!-- Destination 3: (360, 364) -->
    <circle cx="360" cy="364" r="19" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Highlights on Emerald Spheres -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="234" cy="160" r="5"/>
    <circle cx="474" cy="160" r="5"/>
    <circle cx="354" cy="358" r="5"/>
  </g>
</svg>