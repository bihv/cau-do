<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Light theme default */
      .acrobat-adult-head { fill: #1e40af; }
      .acrobat-adult-body { stroke: #1d4ed8; fill: none; }
      .acrobat-adult-shoulder { stroke: #2563eb; fill: none; }
      .acrobat-adult-joint { fill: #1e40af; }

      .acrobat-child-head { fill: #059669; }
      .acrobat-child-body { stroke: #10b981; fill: none; }
      .acrobat-child-shoulder { stroke: #34d399; fill: none; }
      .acrobat-child-joint { fill: #059669; }

      .floor-line { stroke: #94a3b8; }
      .tier-badge { fill: #f8fafc; stroke: #cbd5e1; }
      .tier-text { fill: #475569; }

      .card-adult { fill: #eff6ff; stroke: #bfdbfe; }
      .card-adult-text { fill: #1d4ed8; }
      .card-child { fill: #ecfdf5; stroke: #a7f3d0; }
      .card-child-text { fill: #047857; }

      .callout-box { fill: #fef3c7; stroke: #f59e0b; }
      .callout-text { fill: #b45309; }

      /* Dark theme */
      @media (prefers-color-scheme: dark) {
        .acrobat-adult-head { fill: #93c5fd; }
        .acrobat-adult-body { stroke: #60a5fa; fill: none; }
        .acrobat-adult-shoulder { stroke: #3b82f6; fill: none; }
        .acrobat-adult-joint { fill: #93c5fd; }

        .acrobat-child-head { fill: #6ee7b7; }
        .acrobat-child-body { stroke: #34d399; fill: none; }
        .acrobat-child-shoulder { stroke: #10b981; fill: none; }
        .acrobat-child-joint { fill: #6ee7b7; }

        .floor-line { stroke: #475569; }
        .tier-badge { fill: #1e293b; stroke: #334155; }
        .tier-text { fill: #94a3b8; }

        .card-adult { fill: #172554; stroke: #3b82f6; }
        .card-adult-text { fill: #93c5fd; }
        .card-child { fill: #064e3b; stroke: #10b981; }
        .card-child-text { fill: #a7f3d0; }

        .callout-box { fill: #451a03; stroke: #f59e0b; }
        .callout-text { fill: #fde68a; }
      }
    ]]></style>

    <!-- Shadow filter (objectBoundingBox) -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Adult Acrobat Symbol (Blue / Indigo Theme) -->
    <g id="acrobatAdult">
      <circle class="acrobat-adult-head" cx="0" cy="-22" r="13"/>
      <line class="acrobat-adult-body" x1="0" y1="-9" x2="0" y2="24" stroke-width="5" stroke-linecap="round"/>
      <line class="acrobat-adult-shoulder" x1="-28" y1="-4" x2="28" y2="-4" stroke-width="5.5" stroke-linecap="round"/>
      <circle class="acrobat-adult-joint" cx="-24" cy="-4" r="3.5"/>
      <circle class="acrobat-adult-joint" cx="24" cy="-4" r="3.5"/>
      <line class="acrobat-adult-body" x1="0" y1="24" x2="-24" y2="60" stroke-width="5" stroke-linecap="round"/>
      <line class="acrobat-adult-body" x1="0" y1="24" x2="24" y2="60" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Child Acrobat Symbol (Emerald Theme, smaller head/thinner) -->
    <g id="acrobatChild">
      <circle class="acrobat-child-head" cx="0" cy="-20" r="10.5"/>
      <line class="acrobat-child-body" x1="0" y1="-9" x2="0" y2="24" stroke-width="4" stroke-linecap="round"/>
      <line class="acrobat-child-shoulder" x1="-28" y1="-4" x2="28" y2="-4" stroke-width="4.5" stroke-linecap="round"/>
      <circle class="acrobat-child-joint" cx="-24" cy="-4" r="3"/>
      <circle class="acrobat-child-joint" cx="24" cy="-4" r="3"/>
      <line class="acrobat-child-body" x1="0" y1="24" x2="-24" y2="60" stroke-width="4" stroke-linecap="round"/>
      <line class="acrobat-child-body" x1="0" y1="24" x2="24" y2="60" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Arrow Marker -->
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 5 8 L 9 1 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Tier Labels on Left -->
  <g transform="translate(45, 0)">
    <!-- Tier 4 -->
    <g transform="translate(0, 95)">
      <rect class="tier-badge" x="0" y="-15" width="115" height="30" rx="7" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text class="tier-text" x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Tầng 4</text>
      <text class="card-child-text" x="100" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="end">1 trẻ</text>
    </g>
    <!-- Tier 3 -->
    <g transform="translate(0, 185)">
      <rect class="tier-badge" x="0" y="-15" width="115" height="30" rx="7" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text class="tier-text" x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Tầng 3</text>
      <text class="card-child-text" x="100" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="end">2 trẻ</text>
    </g>
    <!-- Tier 2 -->
    <g transform="translate(0, 275)">
      <rect class="tier-badge" x="0" y="-15" width="115" height="30" rx="7" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text class="tier-text" x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Tầng 2</text>
      <text class="card-adult-text" x="100" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="end">1 lớn, 2 trẻ</text>
    </g>
    <!-- Tier 1 -->
    <g transform="translate(0, 365)">
      <rect class="tier-badge" x="0" y="-15" width="115" height="30" rx="7" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text class="tier-text" x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Tầng 1</text>
      <text class="card-adult-text" x="100" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="end">4 lớn</text>
    </g>
  </g>

  <!-- Ground Line (y = 425) -->
  <line class="floor-line" x1="180" y1="425" x2="680" y2="425" stroke-width="3" stroke-linecap="round"/>

  <!-- TẦNG 1 (4 NGƯỜI LỚN) -->
  <use href="#acrobatAdult" x="270" y="365"/>
  <use href="#acrobatAdult" x="370" y="365"/>
  <use href="#acrobatAdult" x="470" y="365"/>
  <use href="#acrobatAdult" x="570" y="365"/>

  <!-- TẦNG 2 (2 TRẺ EM Ở BIÊN + 1 NGƯỜI LỚN Ở GIỮA) -->
  <use href="#acrobatChild" x="320" y="275"/>
  <use href="#acrobatAdult" x="420" y="275"/>
  <use href="#acrobatChild" x="520" y="275"/>

  <!-- TẦNG 3 (2 TRẺ EM) -->
  <use href="#acrobatChild" x="370" y="185"/>
  <use href="#acrobatChild" x="470" y="185"/>

  <!-- TẦNG 4 (1 TRẺ EM - ĐỈNH THÁP) -->
  <use href="#acrobatChild" x="420" y="95"/>

  <!-- 2 Force Arrows pushing down on Center Person shoulders of Tier 2 -->
  <line x1="396" y1="245" x2="396" y2="265" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="444" y1="245" x2="444" y2="265" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- Callout Explanation for Center Tier 2 Person -->
  <g transform="translate(620, 255)">
    <rect class="callout-box" x="0" y="0" width="225" height="52" rx="8" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text class="callout-text" x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Chịu lực cả 2 vai:</text>
    <text class="callout-text" x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">Bắt buộc là Người lớn!</text>
  </g>

  <!-- Legend at Right Top -->
  <g transform="translate(620, 95)">
    <!-- Legend Box -->
    <!-- Adult Legend -->
    <rect class="card-adult" x="0" y="0" width="225" height="54" rx="10" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="28" cy="27" r="10" fill="#2563eb"/>
    <text class="card-adult-text" x="48" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">5 Người lớn</text>
    <text class="card-adult-text" x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">M, N, O, P, Q (Tầng 1 và giữa T2)</text>

    <!-- Child Legend -->
    <rect class="card-child" x="0" y="66" width="225" height="54" rx="10" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="28" cy="93" r="10" fill="#10b981"/>
    <text class="card-child-text" x="48" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">5 Trẻ em</text>
    <text class="card-child-text" x="48" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">V, W, X, Y, Z (T3, T4 và 2 biên T2)</text>
  </g>

</svg>
