<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <filter id="board-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="success-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>

    <pattern id="modern-hatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" class="hatch-stroke" stroke-width="2.5" stroke-linecap="square"/>
    </pattern>

    <!-- Plus Symbol Definition (Centered at 0,0, size 20x20) -->
    <path id="plus-icon" d="M -3 -10 H 3 V -3 H 10 V 3 H 3 V 10 H -3 V 3 H -10 V -3 H -3 Z" class="plus-dark"/>

    <style><![CDATA[
      /* Universal Dual-Mode Styling: Seamless on both Light and Dark backgrounds */
      .matrix-bezel { fill: none; stroke: #6366f1; stroke-width: 2; }
      
      .cell-tile { fill: rgba(148, 163, 184, 0.08); stroke: #64748b; stroke-width: 1.5; }
      .cell-shaded { fill: rgba(100, 116, 139, 0.18); stroke: #64748b; stroke-width: 1.5; }
      .hatch-stroke { stroke: #64748b; }

      /* Dual-Contrast Shapes */
      .shape-white { fill: #ffffff; stroke: #0f172a; stroke-width: 2.6; stroke-linejoin: round; }
      .shape-dark { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.8; stroke-linejoin: round; }
      .plus-dark { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.2; stroke-linejoin: round; }

      /* Option Cards */
      .card-option-muted { fill: rgba(148, 163, 184, 0.03); stroke: #64748b; stroke-width: 1.2; opacity: 0.65; }
      .card-option-winner { fill: rgba(16, 185, 129, 0.14); stroke: #10b981; stroke-width: 2.8; }

      .badge-muted-bg { fill: rgba(148, 163, 184, 0.12); stroke: #64748b; stroke-width: 1; }
      .badge-muted-text { fill: #94a3b8; font-weight: 700; }
      .badge-winner-bg { fill: #10b981; }
      .badge-winner-text { fill: #ffffff; font-weight: 800; }

      /* Solved Target Cell */
      .target-solved-bg { fill: rgba(16, 185, 129, 0.14); stroke: #10b981; stroke-width: 2.8; }

      @media (prefers-color-scheme: dark) {
        .cell-tile { fill: rgba(255, 255, 255, 0.06); stroke: #475569; }
        .cell-shaded { fill: rgba(148, 163, 184, 0.15); stroke: #475569; }
        .card-option-muted { fill: rgba(255, 255, 255, 0.02); stroke: #334155; opacity: 0.5; }
      }
    ]]></style>
  </defs>

  <!-- LEFT 3x3 MATRIX CONTAINER (TRANSPARENT OUTLINED STRUCTURE) -->
  <g filter="url(#board-shadow)">
    <!-- Matrix Outer Border -->
    <rect x="52" y="47" width="364" height="364" rx="18" class="matrix-bezel"/>

    <!-- ================= ROW 1 (Large Square & Plus Symbol Moving Right) ================= -->
    <!-- Cell (1,1): Plus inside Square -->
    <g>
      <rect x="64" y="59" width="108" height="108" rx="12" class="cell-tile"/>
      <rect x="91" y="86" width="54" height="54" rx="3" class="shape-white"/>
      <use href="#plus-icon" x="118" y="113"/>
    </g>

    <!-- Cell (1,2): Plus on right edge of Square -->
    <g>
      <rect x="180" y="59" width="108" height="108" rx="12" class="cell-tile"/>
      <rect x="207" y="86" width="54" height="54" rx="3" class="shape-white"/>
      <use href="#plus-icon" x="261" y="113"/>
    </g>

    <!-- Cell (1,3): Plus outside right edge of Square -->
    <g>
      <rect x="296" y="59" width="108" height="108" rx="12" class="cell-tile"/>
      <rect x="315" y="86" width="54" height="54" rx="3" class="shape-white"/>
      <use href="#plus-icon" x="384" y="113"/>
    </g>

    <!-- ================= ROW 2 (Large Circle & Small Square Moving Down) ================= -->
    <!-- Cell (2,1): Shaded Cell -->
    <g>
      <rect x="64" y="175" width="108" height="108" rx="12" class="cell-shaded"/>
      <rect x="64" y="175" width="108" height="108" rx="12" fill="url(#modern-hatch)"/>
    </g>

    <!-- Cell (2,2): Small Square on bottom edge of Circle -->
    <g>
      <rect x="180" y="175" width="108" height="108" rx="12" class="cell-tile"/>
      <circle cx="234" cy="224" r="27" class="shape-white"/>
      <rect x="226" y="243" width="16" height="16" rx="2" class="shape-white"/>
    </g>

    <!-- Cell (2,3): Small Square outside bottom edge of Circle -->
    <g>
      <rect x="296" y="175" width="108" height="108" rx="12" class="cell-tile"/>
      <circle cx="350" cy="218" r="27" class="shape-white"/>
      <rect x="342" y="252" width="16" height="16" rx="2" class="shape-white"/>
    </g>

    <!-- ================= ROW 3 (Large Triangle & Solid Dot Moving Right) ================= -->
    <!-- Cell (3,1): Solid Dot inside Triangle -->
    <g>
      <rect x="64" y="291" width="108" height="108" rx="12" class="cell-tile"/>
      <polygon points="118,320 144,366 92,366" class="shape-white"/>
      <circle cx="118" cy="351" r="6.5" class="shape-dark"/>
    </g>

    <!-- Cell (3,2): Shaded Cell -->
    <g>
      <rect x="180" y="291" width="108" height="108" rx="12" class="cell-shaded"/>
      <rect x="180" y="291" width="108" height="108" rx="12" fill="url(#modern-hatch)"/>
    </g>

    <!-- Cell (3,3): Solved Target Cell (Answer B - Emerald Glow) -->
    <g filter="url(#success-glow)">
      <rect x="296" y="291" width="108" height="108" rx="12" class="target-solved-bg"/>
      <polygon points="344,320 370,366 318,366" class="shape-white" stroke="#10b981" stroke-width="2.8"/>
      <circle cx="380" cy="348" r="6.5" fill="#10b981"/>
      <circle cx="392" cy="303" r="10" fill="#10b981"/>
      <path d="M 387.5 303 L 390.5 306 L 396.5 299.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ================= RIGHT OPTIONS A, B, C, D ================= -->
  <g>
    <!-- OPTION A (Muted) -->
    <g class="card-option-muted" filter="url(#card-shadow)">
      <rect x="460" y="65" width="140" height="120" rx="14"/>
      <circle cx="492" cy="125" r="16" class="badge-muted-bg"/>
      <text x="492" y="125" font-family="-apple-system, sans-serif" font-size="20" class="badge-muted-text" text-anchor="middle" dominant-baseline="central">A</text>
      <!-- Shapes for A: Triangle + Dot on LEFT edge (Muted) -->
      <polygon points="558,104 582,146 534,146" fill="#ffffff" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="522" cy="132" r="6.5" fill="#64748b"/>
    </g>

    <!-- OPTION B (WINNER HIGHLIGHTED - EMERALD) -->
    <g filter="url(#success-glow)">
      <rect x="630" y="65" width="140" height="120" rx="14" class="card-option-winner"/>
      <!-- Shapes for B: Triangle with Emerald stroke + Emerald Dot on right edge -->
      <polygon points="672,104 696,146 648,146" class="shape-white" stroke="#10b981" stroke-width="2.8" stroke-linejoin="round"/>
      <circle cx="708" cy="132" r="6.5" fill="#10b981"/>
      <!-- Letter 'B' Badge in Emerald -->
      <circle cx="738" cy="125" r="16" class="badge-winner-bg"/>
      <text x="738" y="125" font-family="-apple-system, sans-serif" font-size="20" class="badge-winner-text" text-anchor="middle" dominant-baseline="central">B</text>
      <!-- Checkmark Badge on Winner Card -->
      <circle cx="760" cy="75" r="12" fill="#10b981"/>
      <path d="M 755 75 L 758.5 78.5 L 765 71.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- OPTION C (Muted) -->
    <g class="card-option-muted" filter="url(#card-shadow)">
      <rect x="460" y="250" width="140" height="120" rx="14"/>
      <circle cx="492" cy="310" r="16" class="badge-muted-bg"/>
      <text x="492" y="310" font-family="-apple-system, sans-serif" font-size="20" class="badge-muted-text" text-anchor="middle" dominant-baseline="central">C</text>
      <!-- Shapes for C: Triangle + Dot on BOTTOM edge (Muted) -->
      <polygon points="556,285 580,327 532,327" fill="#ffffff" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="556" cy="343" r="6.5" fill="#64748b"/>
    </g>

    <!-- OPTION D (Muted) -->
    <g class="card-option-muted" filter="url(#card-shadow)">
      <rect x="630" y="250" width="140" height="120" rx="14"/>
      <!-- Shapes for D: Triangle + Dot on TOP apex (Muted) -->
      <polygon points="674,297 698,339 650,339" fill="#ffffff" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="674" cy="281" r="6.5" fill="#64748b"/>
      <circle cx="738" cy="310" r="16" class="badge-muted-bg"/>
      <text x="738" y="310" font-family="-apple-system, sans-serif" font-size="20" class="badge-muted-text" text-anchor="middle" dominant-baseline="central">D</text>
    </g>
  </g>
</svg>