<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <pattern id="holePattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- ==================== FIGURE A (LEFT) ==================== -->
  <g id="figureA" filter="url(#shadow)">
    <!-- Base card -->
    <rect x="70.0" y="60.0" width="260.0" height="312.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Grid lines -->
    <line x1="70.0" y1="60.0" x2="70.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="96.0" y1="60.0" x2="96.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="122.0" y1="60.0" x2="122.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="148.0" y1="60.0" x2="148.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="174.0" y1="60.0" x2="174.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="200.0" y1="60.0" x2="200.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="226.0" y1="60.0" x2="226.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="252.0" y1="60.0" x2="252.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="278.0" y1="60.0" x2="278.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="304.0" y1="60.0" x2="304.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="330.0" y1="60.0" x2="330.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="60.0" x2="330.0" y2="60.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="86.0" x2="330.0" y2="86.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="112.0" x2="330.0" y2="112.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="138.0" x2="330.0" y2="138.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="164.0" x2="330.0" y2="164.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="190.0" x2="330.0" y2="190.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="216.0" x2="330.0" y2="216.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="242.0" x2="330.0" y2="242.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="268.0" x2="330.0" y2="268.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="294.0" x2="330.0" y2="294.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="320.0" x2="330.0" y2="320.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="346.0" x2="330.0" y2="346.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="70.0" y1="372.0" x2="330.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 1. Top Left Triangle (2x5) -->
    <polygon points="200.0,60.0 200.0,190.0 148.0,190.0" 
             fill="#d1fae5" fill-opacity="0.75" stroke="#059669" stroke-width="2.5"/>

    <!-- 2. Top Right Triangle (2x5) -->
    <polygon points="200.0,60.0 200.0,190.0 252.0,190.0" 
             fill="#d1fae5" fill-opacity="0.75" stroke="#059669" stroke-width="2.5"/>

    <!-- 3. Bottom Left Wing (3x7) -->
    <polygon points="148.0,190.0 148.0,372.0 70.0,372.0" 
             fill="#dbeafe" fill-opacity="0.75" stroke="#2563eb" stroke-width="2.5"/>

    <!-- 4. Bottom Right Wing (3x7) -->
    <polygon points="252.0,190.0 252.0,372.0 330.0,372.0" 
             fill="#dbeafe" fill-opacity="0.75" stroke="#2563eb" stroke-width="2.5"/>

    <!-- 5. Central Piece 5 (Top Stepped Polyomino, Area 14) -->
    <polygon points="148.0,190.0 252.0,190.0 252.0,320.0 200.0,320.0 200.0,242.0 148.0,242.0" 
             fill="#fef3c7" fill-opacity="0.8" stroke="#d97706" stroke-width="2.5"/>

    <!-- 6. Central Piece 6 (Bottom Stepped Polyomino, Area 14) -->
    <polygon points="148.0,242.0 200.0,242.0 200.0,320.0 252.0,320.0 252.0,372.0 148.0,372.0" 
             fill="#ede9fe" fill-opacity="0.8" stroke="#7c3aed" stroke-width="2.5"/>

    <!-- Outer Frame -->
    <rect x="70.0" y="60.0" width="260.0" height="312.0" fill="none" stroke="#0f172a" stroke-width="2"/>

    <!-- Caption Badge A -->
    <rect x="182.0" y="386.0" width="36" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="200.0" y="407.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">A</text>
  </g>

  <!-- ==================== FIGURE B (RIGHT) ==================== -->
  <g id="figureB" filter="url(#shadow)">
    <!-- Base card -->
    <rect x="430.0" y="60.0" width="260.0" height="312.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Grid lines -->
    <line x1="430.0" y1="60.0" x2="430.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="456.0" y1="60.0" x2="456.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="482.0" y1="60.0" x2="482.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="508.0" y1="60.0" x2="508.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="534.0" y1="60.0" x2="534.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="560.0" y1="60.0" x2="560.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="586.0" y1="60.0" x2="586.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="612.0" y1="60.0" x2="612.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="638.0" y1="60.0" x2="638.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="664.0" y1="60.0" x2="664.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="690.0" y1="60.0" x2="690.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="60.0" x2="690.0" y2="60.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="86.0" x2="690.0" y2="86.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="112.0" x2="690.0" y2="112.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="138.0" x2="690.0" y2="138.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="164.0" x2="690.0" y2="164.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="190.0" x2="690.0" y2="190.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="216.0" x2="690.0" y2="216.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="242.0" x2="690.0" y2="242.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="268.0" x2="690.0" y2="268.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="294.0" x2="690.0" y2="294.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="320.0" x2="690.0" y2="320.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="346.0" x2="690.0" y2="346.0" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="430.0" y1="372.0" x2="690.0" y2="372.0" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 1. Top Left Triangle (now 3x7, swapped with bottom wing) -->
    <polygon points="560.0,60.0 560.0,242.0 482.0,242.0" 
             fill="#dbeafe" fill-opacity="0.75" stroke="#2563eb" stroke-width="2.5"/>

    <!-- 2. Top Right Triangle (now 3x7, swapped with bottom wing) -->
    <polygon points="560.0,60.0 560.0,242.0 638.0,242.0" 
             fill="#dbeafe" fill-opacity="0.75" stroke="#2563eb" stroke-width="2.5"/>

    <!-- 3. Bottom Left Wing (now 2x5, swapped with top triangle) -->
    <polygon points="482.0,242.0 482.0,372.0 430.0,372.0" 
             fill="#d1fae5" fill-opacity="0.75" stroke="#059669" stroke-width="2.5"/>

    <!-- 4. Bottom Right Wing (now 2x5, swapped with top triangle) -->
    <polygon points="638.0,242.0 638.0,372.0 690.0,372.0" 
             fill="#d1fae5" fill-opacity="0.75" stroke="#059669" stroke-width="2.5"/>

    <!-- 5. Central Piece 5 (Shifted to top-right of center: cols 4..7 rows 7..8 + cols 6..7 rows 9..11) -->
    <polygon points="534.0,242.0 638.0,242.0 638.0,372.0 586.0,372.0 586.0,294.0 534.0,294.0" 
             fill="#fef3c7" fill-opacity="0.8" stroke="#d97706" stroke-width="2.5"/>

    <!-- 6. Central Piece 6 (Shifted to bottom-left of center: cols 2..3 rows 7..9 + cols 2..5 rows 10..11) -->
    <polygon points="482.0,242.0 534.0,242.0 534.0,320.0 586.0,320.0 586.0,372.0 482.0,372.0" 
             fill="#ede9fe" fill-opacity="0.8" stroke="#7c3aed" stroke-width="2.5"/>

    <!-- 7. THE HOLE (2 missing cells at Row 9, Cols 4 and 5) -->
    <rect x="534.0" y="294.0" width="52.0" height="26.0" 
          fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="534.0" y="294.0" width="52.0" height="26.0" 
          fill="url(#holePattern)" stroke="none"/>
    <line x1="560.0" y1="294.0" x2="560.0" y2="320.0" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Outer Frame -->
    <rect x="430.0" y="60.0" width="260.0" height="312.0" fill="none" stroke="#0f172a" stroke-width="2"/>

    <!-- Caption Badge B -->
    <rect x="542.0" y="386.0" width="36" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="560.0" y="407.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">B</text>
  </g>
</svg>