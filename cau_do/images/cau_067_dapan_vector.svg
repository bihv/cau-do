        <polygon points="165.8,131.3 171.8,126.7 171.8,138.7 165.8,143.3" fill="#0f172a"/>
        <polygon points="180.2,120.1 186.2,115.5 186.2,127.5 180.2,132.1" fill="#0f172a"/>
        <polygon points="116.0,123.0 128.0,123.0 128.0,135.0 116.0,135.0" fill="#0f172a"/>
