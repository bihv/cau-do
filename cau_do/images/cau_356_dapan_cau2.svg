<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 70 640 280" width="100%" height="100%">
  <!-- Transition Arrow -->
  <g transform="translate(400, 210)" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-24" y1="0" x2="24" y2="0"/>
    <polyline points="14,-8 24,0 14,8"/>
  </g>

  <!-- LEFT: GREEK CROSS CUT INTO 3 PIECES (cx=210, cy=210) -->
  <g transform="translate(210, 210)" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round">
    <polygon points="-32.5,32.5 0,32.5 32.5,-32.5 32.5,-97.5 -32.5,-97.5 -32.5,-32.5 -97.5,-32.5 -97.5,32.5" fill="#34d399"/>
    <polygon points="-32.5,97.5 32.5,97.5 32.5,32.5 97.5,32.5 97.5,-32.5 32.5,-32.5" fill="#38bdf8"/>
    <polygon points="-32.5,97.5 -32.5,32.5 0,32.5" fill="#fbbf24"/>

    <!-- Cut lines highlighted with crisp white dashed overlay -->
    <line x1="-32.5" y1="97.5" x2="32.5" y2="-32.5" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5,4"/>
    <line x1="-32.5" y1="32.5" x2="0" y2="32.5" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5,4"/>
  </g>

  <!-- RIGHT: ASSEMBLED PARALLELOGRAM (cx=590, cy=210) -->
  <g transform="translate(590, 210)" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round">
    <polygon points="-113.75,65.0 -48.75,65.0 -48.75,0.0 16.25,0.0 16.25,-65.0 -48.75,-65.0" fill="#38bdf8"/>
    <polygon points="16.25,65.0 48.75,65.0 81.25,0.0 81.25,-65.0 16.25,-65.0 16.25,0.0 -48.75,0.0 -48.75,65.0" fill="#34d399"/>
    <polygon points="81.25,0.0 81.25,-65.0 113.75,-65.0" fill="#fbbf24"/>

    <!-- Outer Boundary Reinforcement -->
    <polygon points="-113.75,65.0 48.75,65.0 113.75,-65.0 -48.75,-65.0" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  </g>
</svg>