<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%">
  <defs>
    <!-- Shadows and Glows -->
    <filter id="board-shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="stick-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>

    <!-- Canvas Gradient -->
    <!-- Board Surface Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Matchstick Wood - Horizontal -->
    <linearGradient id="wood-h" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Matchstick Wood - Vertical -->
    <linearGradient id="wood-v" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Sulfur Red Tip -->
    <radialGradient id="sulfur-red" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="85%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
  </defs>

  <!-- Main Board Frame -->
  <rect x="30" y="30" width="800" height="380" rx="24" fill="url(#card-grad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#board-shadow)"/>

  <!-- ==================== LEFT SIDE: 100 ==================== -->
  <!-- Left Digit '1': (x=140, y from 182 to 258) -->
  <g filter="url(#stick-shadow)">
    <rect x="136.25" y="182" width="7.5" height="76" rx="3.75" fill="url(#wood-v)" stroke="#b45309" stroke-width="0.8"/>
    <rect x="134.75" y="180" width="10.5" height="13" rx="5" fill="url(#sulfur-red)"/>
    <ellipse cx="137.5" cy="186.5" rx="1.5" ry="3.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Left First '0': (x from 168 to 244, y from 182 to 258) -->
  <g filter="url(#stick-shadow)">
