<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="success-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
    <filter id="target-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.55"/>
    </filter>
    <style><![CDATA[
      /* Universal Dual-Mode Styling */
      .board-card { fill: rgba(99, 102, 241, 0.04); stroke: #6366f1; stroke-width: 2.2; }
      .board-inner { fill: rgba(148, 163, 184, 0.05); stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .side-card { fill: rgba(148, 163, 184, 0.07); stroke: #64748b; stroke-width: 1.6; }
      .side-card-winner { fill: rgba(16, 185, 129, 0.12); stroke: #10b981; stroke-width: 2.5; }
      
      .pyr-base-tri { fill: rgba(148, 163, 184, 0.1); stroke: #64748b; stroke-width: 1.2; }
      .pyr-up-tri { fill: #ffffff; stroke: #0f172a; stroke-width: 2.2; }
      
      .text-muted { fill: #94a3b8; font-weight: 800; }
      .pill-bg { fill: rgba(99, 102, 241, 0.15); stroke: #6366f1; }
    ]]></style>
  </defs>

  <!-- LEFT BOARD: 6-TIER PYRAMID (TRANSPARENT CANVAS - NO SOLID RECTANGLE) -->
  <g transform="translate(30, 25)" filter="url(#shadow)">
    <!-- Thin Indigo Outer Frame -->
    <rect width="500" height="440" rx="20" fill="none" stroke="#6366f1" stroke-width="2"/>

    <!-- Tier Labels T1..T6 -->
    <g font-family="-apple-system, sans-serif" font-size="11" font-weight="800" class="text-muted" text-anchor="end">
      <text x="235" y="112">T1</text>
      <text x="203" y="168">T2</text>
      <text x="171" y="224">T3</text>
      <text x="139" y="280">T4</text>
      <text x="107" y="336">T5</text>
      <text x="75" y="392">T6</text>
    </g>

    <!-- Outer Pyramid Frame -->
    <polygon points="280,80 88,416 472,416" fill="none" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>

    <!-- Inverted Triangles -->
      <polygon points="280,192 248,136 312,136" class="pyr-base-tri"/>
      <polygon points="248,248 216,192 280,192" class="pyr-base-tri"/>
      <polygon points="312,248 280,192 344,192" class="pyr-base-tri"/>
      <polygon points="216,304 184,248 248,248" class="pyr-base-tri"/>
      <polygon points="280,304 248,248 312,248" class="pyr-base-tri"/>
      <polygon points="344,304 312,248 376,248" class="pyr-base-tri"/>
      <polygon points="184,360 152,304 216,304" class="pyr-base-tri"/>
      <polygon points="248,360 216,304 280,304" class="pyr-base-tri"/>
      <polygon points="312,360 280,304 344,304" class="pyr-base-tri"/>
      <polygon points="376,360 344,304 408,304" class="pyr-base-tri"/>
      <polygon points="152,416 120,360 184,360" class="pyr-base-tri"/>
      <polygon points="216,416 184,360 248,360" class="pyr-base-tri"/>
      <polygon points="280,416 248,360 312,360" class="pyr-base-tri"/>
      <polygon points="344,416 312,360 376,360" class="pyr-base-tri"/>
      <polygon points="408,416 376,360 440,360" class="pyr-base-tri"/>

    <!-- Upward Triangles -->
      <polygon points="280,80 248,136 312,136" fill="rgba(244, 63, 94, 0.28)" stroke="#f43f5e" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="280.0" y="119.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#f43f5e" text-anchor="middle" dominant-baseline="central">1</text>
      <polygon points="248,136 216,192 280,192" fill="rgba(244, 63, 94, 0.28)" stroke="#f43f5e" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="248.0" y="175.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#f43f5e" text-anchor="middle" dominant-baseline="central">2</text>
      <polygon points="312,136 280,192 344,192" fill="rgba(244, 63, 94, 0.28)" stroke="#f43f5e" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="312.0" y="175.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#f43f5e" text-anchor="middle" dominant-baseline="central">3</text>
      <polygon points="216,192 184,248 248,248" fill="rgba(249, 115, 22, 0.28)" stroke="#f97316" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="216.0" y="231.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#f97316" text-anchor="middle" dominant-baseline="central">4</text>
      <polygon points="280,192 248,248 312,248" fill="rgba(249, 115, 22, 0.28)" stroke="#f97316" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="280.0" y="231.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#f97316" text-anchor="middle" dominant-baseline="central">5</text>
      <polygon points="344,192 312,248 376,248" fill="rgba(249, 115, 22, 0.28)" stroke="#f97316" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="344.0" y="231.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#f97316" text-anchor="middle" dominant-baseline="central">6</text>
      <polygon points="184,248 152,304 216,304" fill="rgba(234, 179, 8, 0.28)" stroke="#eab308" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="184.0" y="287.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#eab308" text-anchor="middle" dominant-baseline="central">7</text>
      <polygon points="248,248 216,304 280,304" fill="rgba(234, 179, 8, 0.28)" stroke="#eab308" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="248.0" y="287.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#eab308" text-anchor="middle" dominant-baseline="central">8</text>
      <polygon points="312,248 280,304 344,304" fill="rgba(234, 179, 8, 0.28)" stroke="#eab308" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="312.0" y="287.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#eab308" text-anchor="middle" dominant-baseline="central">9</text>
      <polygon points="376,248 344,304 408,304" fill="rgba(16, 185, 129, 0.28)" stroke="#10b981" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="376.0" y="287.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#10b981" text-anchor="middle" dominant-baseline="central">10</text>
      <polygon points="152,304 120,360 184,360" fill="rgba(16, 185, 129, 0.28)" stroke="#10b981" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="152.0" y="343.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#10b981" text-anchor="middle" dominant-baseline="central">11</text>
      <polygon points="216,304 184,360 248,360" fill="rgba(16, 185, 129, 0.28)" stroke="#10b981" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="216.0" y="343.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#10b981" text-anchor="middle" dominant-baseline="central">12</text>
      <polygon points="280,304 248,360 312,360" fill="rgba(6, 182, 212, 0.28)" stroke="#06b6d4" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="280.0" y="343.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#06b6d4" text-anchor="middle" dominant-baseline="central">13</text>
      <polygon points="344,304 312,360 376,360" fill="rgba(6, 182, 212, 0.28)" stroke="#06b6d4" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="344.0" y="343.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#06b6d4" text-anchor="middle" dominant-baseline="central">14</text>
      <polygon points="408,304 376,360 440,360" fill="rgba(6, 182, 212, 0.28)" stroke="#06b6d4" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="408.0" y="343.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#06b6d4" text-anchor="middle" dominant-baseline="central">15</text>
      <polygon points="120,360 88,416 152,416" fill="rgba(59, 130, 246, 0.28)" stroke="#3b82f6" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="120.0" y="399.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#3b82f6" text-anchor="middle" dominant-baseline="central">16</text>
      <polygon points="184,360 152,416 216,416" fill="rgba(59, 130, 246, 0.28)" stroke="#3b82f6" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="184.0" y="399.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#3b82f6" text-anchor="middle" dominant-baseline="central">17</text>
      <polygon points="248,360 216,416 280,416" fill="rgba(59, 130, 246, 0.28)" stroke="#3b82f6" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="248.0" y="399.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#3b82f6" text-anchor="middle" dominant-baseline="central">18</text>
      <polygon points="312,360 280,416 344,416" fill="rgba(139, 92, 246, 0.28)" stroke="#8b5cf6" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="312.0" y="399.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#8b5cf6" text-anchor="middle" dominant-baseline="central">19</text>
      <polygon points="376,360 344,416 408,416" fill="rgba(139, 92, 246, 0.28)" stroke="#8b5cf6" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="376.0" y="399.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#8b5cf6" text-anchor="middle" dominant-baseline="central">20</text>
      <polygon points="440,360 408,416 472,416" fill="rgba(139, 92, 246, 0.28)" stroke="#8b5cf6" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="440.0" y="399.5" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#8b5cf6" text-anchor="middle" dominant-baseline="central">21</text>
  </g>

    <!-- RIGHT SIDE: UNIT SAMPLE & 7 DIPS SOLUTION (CLEAN MATH SYMBOLS) -->
    <!-- Unit Sample Card: 1 = 3 ▲ -->
    <g transform="translate(560, 40)" filter="url(#shadow)">
      <rect width="320" height="150" rx="16" class="side-card"/>
      <g transform="translate(20, 16)">
        <rect width="90" height="24" rx="12" class="pill-bg"/>
        <text x="45" y="16" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#6366f1" text-anchor="middle">1 = 3 ▲</text>
      </g>
      <!-- Sample Triangle (3 small upward triangles) -->
      <polygon points="220,45 190,95 250,95" class="pyr-base-tri"/>
      <polygon points="220,45 205,70 235,70" fill="rgba(244, 63, 94, 0.28)" stroke="#f43f5e" stroke-width="2"/>
      <polygon points="205,70 190,95 220,95" fill="rgba(244, 63, 94, 0.28)" stroke="#f43f5e" stroke-width="2"/>
      <polygon points="235,70 220,95 250,95" fill="rgba(244, 63, 94, 0.28)" stroke="#f43f5e" stroke-width="2"/>
      <text x="160" y="128" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">1 lần chấm ⟹ 3 ▲ (9 đoạn nét)</text>
    </g>

    <!-- Solution Card (7 Dips Emerald Glow) -->
    <g transform="translate(560, 215)" filter="url(#success-glow)">
      <rect width="320" height="235" rx="18" class="side-card-winner"/>
      <!-- Header with checkmark -->
      <circle cx="36" cy="36" r="15" fill="#10b981"/>
      <path d="M 30 36 L 34.5 40.5 L 43 32" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#10b981">KẾT QUẢ</text>
      <text x="62" y="49" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#10b981">TỐI THIỂU = 7 LẦN CHẤM</text>

      <!-- 7 Color Badges Grid -->
      <g transform="translate(18, 70)" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">
        <rect x="0" y="0" width="86" height="24" rx="6" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e"/>
        <text x="43" y="16" fill="#f43f5e" text-anchor="middle">1: ▲1..3</text>
        <rect x="98" y="0" width="86" height="24" rx="6" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316"/>
        <text x="141" y="16" fill="#f97316" text-anchor="middle">2: ▲4..6</text>
        <rect x="196" y="0" width="86" height="24" rx="6" fill="rgba(234, 179, 8, 0.2)" stroke="#eab308"/>
        <text x="239" y="16" fill="#eab308" text-anchor="middle">3: ▲7..9</text>

        <rect x="0" y="32" width="86" height="24" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
        <text x="43" y="48" fill="#10b981" text-anchor="middle">4: ▲10..12</text>
        <rect x="98" y="32" width="86" height="24" rx="6" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4"/>
        <text x="141" y="48" fill="#06b6d4" text-anchor="middle">5: ▲13..15</text>
        <rect x="196" y="32" width="86" height="24" rx="6" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6"/>
        <text x="239" y="48" fill="#3b82f6" text-anchor="middle">6: ▲16..18</text>

        <rect x="98" y="64" width="86" height="24" rx="6" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6"/>
        <text x="141" y="80" fill="#8b5cf6" text-anchor="middle">7: ▲19..21</text>
      </g>

      <!-- Math Equation Pill -->
      <g transform="translate(18, 178)">
        <rect width="284" height="36" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.5"/>
        <text x="142" y="23" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#10b981" text-anchor="middle">
          21 ▲ ÷ 3 ▲ = 7
        </text>
      </g>
    </g>
</svg>