<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="100%" height="100%">
  <defs>
    <!-- Shadows & Glows -->
    <filter id="board-shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="target-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#b45309" flood-opacity="0.2"/>
    </filter>
    <filter id="ink-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="sample-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>

    <linearGradient id="target-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>

    <linearGradient id="pyr-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="amber-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <linearGradient id="blue-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- ==================== LEFT MAIN CARD: 6-TIER PYRAMID ==================== -->
  <rect x="30" y="30" width="520" height="520" rx="24" fill="url(#card-grad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#board-shadow)"/>

  <!-- Left Card Header Pill -->
  <g transform="translate(50, 52)">
    <rect x="0" y="0" width="168" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#3b82f6"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" letter-spacing="0.5">THÁP TAM GIÁC</text>
  </g>

  <!-- Tier Count Badge -->
  <g transform="translate(420, 52)">
    <rect x="0" y="0" width="110" height="32" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="55" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">6 TẦNG (N = 6)</text>
  </g>

  <!-- Pyramid Background Shape -->
  <polygon points="290,100 86,453.34 494,453.34" fill="url(#pyr-fill)"/>

  <!-- Subtle Alternating Tint for Upward Triangles -->
  <g fill="#f8fafc" stroke="none">
    <!-- Tier 1 -->
    <polygon points="290,100 256,158.89 324,158.89"/>
    <!-- Tier 2 -->
    <polygon points="256,158.89 222,217.78 290,217.78"/>
    <polygon points="324,158.89 290,217.78 358,217.78"/>
    <!-- Tier 3 -->
    <polygon points="222,217.78 188,276.67 256,276.67"/>
    <polygon points="290,217.78 256,276.67 324,276.67"/>
    <polygon points="358,217.78 324,276.67 392,276.67"/>
    <!-- Tier 4 -->
    <polygon points="188,276.67 154,335.56 222,335.56"/>
    <polygon points="256,276.67 222,335.56 290,335.56"/>
    <polygon points="324,276.67 290,335.56 358,335.56"/>
    <polygon points="392,276.67 358,335.56 426,335.56"/>
    <!-- Tier 5 -->
    <polygon points="154,335.56 120,394.45 188,394.45"/>
    <polygon points="222,335.56 188,394.45 256,394.45"/>
    <polygon points="290,335.56 256,394.45 324,394.45"/>
    <polygon points="358,335.56 324,394.45 392,394.45"/>
    <polygon points="426,335.56 392,394.45 460,394.45"/>
    <!-- Tier 6 -->
    <polygon points="120,394.45 86,453.34 154,453.34"/>
    <polygon points="188,394.45 154,453.34 222,453.34"/>
    <polygon points="256,394.45 222,453.34 290,453.34"/>
    <polygon points="324,394.45 290,453.34 358,453.34"/>
    <polygon points="392,394.45 358,453.34 426,453.34"/>
    <polygon points="460,394.45 426,453.34 494,453.34"/>
  </g>

  <!-- ==================== PYRAMID GRID LINES ==================== -->
  <!-- 1. Horizontal Lines (Internal, rows 1 to 5) -->
  <g stroke="#64748b" stroke-width="2.2" stroke-linecap="round">
    <line x1="256" y1="158.89" x2="324" y2="158.89"/>
    <line x1="222" y1="217.78" x2="358" y2="217.78"/>
    <line x1="188" y1="276.67" x2="392" y2="276.67"/>
    <line x1="154" y1="335.56" x2="426" y2="335.56"/>
    <line x1="120" y1="394.45" x2="460" y2="394.45"/>
  </g>

  <!-- 2. Diagonal Lines Down-Right (parallel to left edge, angle +60 deg) -->
  <g stroke="#64748b" stroke-width="2.2" stroke-linecap="round">
    <line x1="256" y1="158.89" x2="426" y2="453.34"/>
    <line x1="222" y1="217.78" x2="358" y2="453.34"/>
    <line x1="188" y1="276.67" x2="290" y2="453.34"/>
    <line x1="154" y1="335.56" x2="222" y2="453.34"/>
    <line x1="120" y1="394.45" x2="154" y2="453.34"/>
  </g>

  <!-- 3. Diagonal Lines Down-Left (parallel to right edge, angle -60 deg) -->
  <g stroke="#64748b" stroke-width="2.2" stroke-linecap="round">
    <line x1="324" y1="158.89" x2="154" y2="453.34"/>
    <line x1="358" y1="217.78" x2="222" y2="453.34"/>
    <line x1="392" y1="276.67" x2="290" y2="453.34"/>
    <line x1="426" y1="335.56" x2="358" y2="453.34"/>
    <line x1="460" y1="394.45" x2="426" y2="453.34"/>
  </g>

  <!-- Outer Perimeter Border (Crisp and Solid) -->
  <polygon points="290,100 86,453.34 494,453.34" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Tier Labels on Left Side (T1 - T6) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="end">
    <text x="246" y="133">T1</text>
    <text x="212" y="192">T2</text>
    <text x="178" y="251">T3</text>
    <text x="144" y="310">T4</text>
    <text x="110" y="369">T5</text>
    <text x="76" y="428">T6</text>
  </g>

  <!-- Small Geometric Indicator Points on Perimeter -->
  <circle cx="290" cy="100" r="4.5" fill="#0f172a"/>
  <circle cx="86" cy="453.34" r="4.5" fill="#0f172a"/>
  <circle cx="494" cy="453.34" r="4.5" fill="#0f172a"/>

  <!-- Bottom Info Pill for Main Card -->
  <g transform="translate(145, 485)">
    <rect x="0" y="0" width="290" height="36" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="145" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">
      Tổng cấu trúc: <tspan font-weight="800" fill="#0f172a">63 đoạn nét</tspan> (21 tam giác ▲)
    </text>
  </g>


  <!-- ==================== RIGHT TOP CARD: UNIT SAMPLE ==================== -->
  <rect x="580" y="30" width="330" height="260" rx="24" fill="url(#sample-card-grad)" stroke="#bae6fd" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- Unit Sample Header -->
  <g transform="translate(600, 52)">
    <rect x="0" y="0" width="165" height="30" rx="15" fill="url(#blue-badge-grad)" stroke="#7dd3fc" stroke-width="1"/>
    <!-- Ink Fountain Pen Nib Icon -->
    <path d="M14 19 L19 14 L22 17 L17 22 Z M19 14 L22 9 L24 11 L21 16 Z M14 19 L11 23 L15 20 Z" fill="#0284c7"/>
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0369a1" letter-spacing="0.4">CỤM MẪU ĐƠN VỊ</text>
  </g>

  <!-- Unit Sample Subtitle -->
  <text x="890" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7" text-anchor="end">1 LẦN CHẤM</text>

  <!-- Unit Sample Triangle (Side 2: apex 745,98; height 97px; base width 112px) -->
  <!-- Triangle Background -->
  <polygon points="745,98 689,195 801,195" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inside Inverted Triangle -->
  <polygon points="717,146.5 773,146.5 745,195" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner Dividing Lines -->
  <line x1="717" y1="146.5" x2="773" y2="146.5" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="717" y1="146.5" x2="745" y2="195" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="773" y1="146.5" x2="745" y2="195" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Unit Formula Pill -->
  <g transform="translate(605, 212)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <circle cx="17" cy="17" r="7" fill="#0284c7"/>
    <text x="17" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">
      1 Lần chấm = <tspan fill="#0284c7">9 đoạn nét</tspan> (3 tam giác ▲)
    </text>
  </g>


  <!-- ==================== RIGHT BOTTOM CARD: THE CHALLENGE ==================== -->
  <rect x="580" y="310" width="330" height="240" rx="24" fill="url(#target-card-grad)" stroke="#fcd34d" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- Challenge Header -->
  <g transform="translate(600, 332)">
    <rect x="0" y="0" width="136" height="30" rx="15" fill="url(#amber-badge-grad)" stroke="#f59e0b" stroke-width="1"/>
    <text x="68" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle" letter-spacing="0.4">CÂU HỎI ĐỐ</text>
  </g>

  <!-- Big Target Box with Illuminated Glow -->
  <g transform="translate(605, 375)">
    <!-- Container Card -->
    <rect x="0" y="0" width="280" height="100" rx="20" fill="#ffffff" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" filter="url(#target-glow)"/>

    <!-- Glowing Question Mark Badge -->
    <circle cx="50" cy="50" r="28" fill="url(#amber-badge-grad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="50" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#b45309" text-anchor="middle">?</text>

    <!-- Query Text -->
    <text x="96" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Số lần chấm mực</text>
    <text x="96" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d97706">ít nhất cần để vẽ?</text>
  </g>

  <!-- Bottom Hint Pill -->
  <g transform="translate(605, 490)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="140" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#78350f" text-anchor="middle">
      63 đoạn nét của tháp lớn = <tspan font-weight="800" fill="#b45309">? lần chấm</tspan>
    </text>
  </g>
</svg>
