        .grid-line { stroke: rgba(148, 163, 184, 0.25); }
        .cut-line { stroke: #f8fafc; }
        .text-title { fill: #f8fafc; }
        .text-dim { fill: #94a3b8; }
        .excess-tri { fill: #f8fafc; stroke: #f8fafc; }
