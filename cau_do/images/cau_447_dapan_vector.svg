<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Default: Light theme */
      .card-box { fill: #ffffff; stroke: #cbd5e1; }
      .card-subtle { fill: #f8fafc; stroke: #e2e8f0; }
      .card-text-primary { fill: #0f172a; }
      .card-text-secondary { fill: #64748b; }
      .card-amber { fill: #fef3c7; stroke: #f59e0b; }
      .card-amber-text { fill: #b45309; }
      .card-blue { fill: #eff6ff; stroke: #bfdbfe; }
      .card-blue-text { fill: #1d4ed8; }
      .card-blue-sub { fill: #3b82f6; }
      .card-emerald { fill: #ecfdf5; stroke: #10b981; }
      .card-emerald-text { fill: #047857; }
      .card-emerald-sub { fill: #065f46; }

      /* Dark theme: dark slate cards and glowing text */
      @media (prefers-color-scheme: dark) {
        .card-box { fill: #1e293b; stroke: #475569; }
        .card-subtle { fill: #0f172a; stroke: #334155; }
        .card-text-primary { fill: #f8fafc; }
        .card-text-secondary { fill: #94a3b8; }
        .card-amber { fill: rgba(245, 158, 11, 0.22); stroke: #fbbf24; }
        .card-amber-text { fill: #fde68a; }
        .card-blue { fill: rgba(59, 130, 246, 0.22); stroke: #60a5fa; }
        .card-blue-text { fill: #93c5fd; }
        .card-blue-sub { fill: #bfdbfe; }
        .card-emerald { fill: rgba(16, 185, 129, 0.2); stroke: #10b981; }
        .card-emerald-text { fill: #34d399; }
        .card-emerald-sub { fill: #6ee7b7; }
      }
    ]]></style>

    <!-- Card Shadow (using objectBoundingBox so it never clips) -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Pill Shadow for badges -->
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>

    <!-- Fruit Shadow -->
    <filter id="fruitShadow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>

    <!-- Apple 3D Gradient (Dark Slate / Ruby) -->
    <radialGradient id="appleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Pear 3D Gradient (Gold / Amber) -->
    <radialGradient id="pearGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Arrow Marker -->
    <marker id="arrowCw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Main Circle Center: cx = 330, cy = 250, R = 150 -->
  <!-- Circular Path Guide (Dotted) -->
  <circle cx="330" cy="250" r="150" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Clockwise Flow Arc (R = 105) -->
  <path d="M 330 145 A 105 105 0 1 1 230 215" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowCw)"/>
  <g transform="translate(330, 252)">
    <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Chiều đếm</text>
    <text x="0" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#3b82f6" text-anchor="middle">(cùng chiều kim)</text>
  </g>

  <!-- 13 FRUITS -->
  <!--
    Angles from -90 deg (top): step = 360 / 13 = 27.6923 deg.
    i = 0: angle -90.00 deg -> (330.0, 100.0) -> QUẢ LÊ (Pear - Position 8)
    i = 1: angle -62.31 deg -> (399.7, 117.3)
    i = 2: angle -34.62 deg -> (453.4, 164.8)
    i = 3: angle -6.92 deg  -> (478.9, 231.9)
    i = 4: angle 20.77 deg  -> (470.3, 303.2)
    i = 5: angle 48.46 deg  -> (429.5, 362.3)
    i = 6: angle 76.15 deg  -> (366.0, 395.6) -> START POINT (Position 1)!
    i = 7: angle 103.85 deg -> (293.7, 395.6)
    i = 8: angle 131.54 deg -> (230.5, 362.3)
    i = 9: angle 159.23 deg -> (189.7, 303.2)
    i = 10: angle 186.92 deg -> (181.1, 231.9)
    i = 11: angle 214.62 deg -> (206.6, 164.8)
    i = 12: angle 242.31 deg -> (260.3, 117.3)
  -->

  <g filter="url(#fruitShadow)">
    <!-- 12 Apples (Dark Slate Spheres with crisp border) -->
    <circle cx="399.7" cy="117.3" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="453.4" cy="164.8" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="478.9" cy="231.9" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="470.3" cy="303.2" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="429.5" cy="362.3" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- START APPLE (i = 6: cx = 366.0, cy = 395.6) - Highlighted with Blue Ring -->
    <circle cx="366.0" cy="395.6" r="14" fill="#2563eb" filter="url(#fruitShadow)"/>
    <circle cx="366.0" cy="395.6" r="11" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

    <circle cx="293.7" cy="395.6" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="230.5" cy="362.3" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="189.7" cy="303.2" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="181.1" cy="231.9" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="206.6" cy="164.8" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="260.3" cy="117.3" r="12" fill="url(#appleGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- QUẢ LÊ (Pear - Top position: cx = 330, cy = 100) -->
    <!-- Pear Body (Glowing Gold Sphere / Ring) -->
    <circle cx="330" cy="100" r="15" fill="url(#pearGrad)" filter="url(#glowGold)"/>
    <circle cx="330" cy="100" r="10" fill="#ffffff"/>
    <circle cx="330" cy="100" r="6" fill="#f59e0b"/>
    <!-- Little Pear Stem & Leaf -->
    <path d="M 330 85 Q 333 78 338 77" fill="none" stroke="#78350f" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 333 80 Q 340 76 342 81 Q 338 84 333 80 Z" fill="#10b981"/>
  </g>

  <!-- Specular Highlights on Apples -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="396" cy="113" r="3"/>
    <circle cx="450" cy="161" r="3"/>
    <circle cx="475" cy="228" r="3"/>
    <circle cx="467" cy="299" r="3"/>
    <circle cx="426" cy="358" r="3"/>
    <circle cx="363" cy="392" r="3"/>
    <circle cx="290" cy="392" r="3"/>
    <circle cx="227" cy="358" r="3"/>
    <circle cx="186" cy="299" r="3"/>
    <circle cx="178" cy="228" r="3"/>
    <circle cx="203" cy="161" r="3"/>
    <circle cx="257" cy="113" r="3"/>
  </g>

  <!-- START CALLOUT (Speech Bubble pointing to Start Apple at 366, 395.6) -->
  <g transform="translate(366, 415)">
    <!-- Pointer triangle -->
    <path d="M 0 0 L -8 15 L 8 15 Z" fill="#2563eb"/>
    <!-- Capsule Badge -->
    <rect x="-120" y="15" width="240" height="38" rx="19" fill="#2563eb" filter="url(#pillShadow)"/>
    <text x="0" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Bắt đầu đếm từ đây (Số 1)</text>
  </g>

  <!-- PEAR LABEL (Above Top Position) -->
  <g transform="translate(330, 52)">
    <rect class="card-amber" x="-60" y="-15" width="120" height="30" rx="15" stroke-width="1.5"/>
    <text class="card-amber-text" x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Quả lê (Số 8)</text>
  </g>

  <!-- EXPLANATION / SUMMARY PANEL ON THE RIGHT -->
  <g transform="translate(560, 70)">
    <!-- Header Card -->
    <rect class="card-box" x="0" y="0" width="205" height="350" rx="14" stroke-width="1.5" filter="url(#cardShadow)"/>

    <text class="card-text-primary" x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Bài toán Josephus</text>
    <text class="card-text-secondary" x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">13 quả, bước đếm k = 13</text>

    <line x1="20" y1="68" x2="185" y2="68" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

    <!-- Key Insight 1: Start Point -->
    <g transform="translate(20, 85)">
      <circle cx="12" cy="12" r="12" class="card-blue"/>
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#2563eb" text-anchor="middle">1</text>
      <text class="card-text-primary" x="34" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Điểm bắt đầu:</text>
      <text x="34" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#3b82f6">Quả táo số 1</text>
    </g>

    <!-- Key Insight 2: Pear Position -->
    <g transform="translate(20, 145)">
      <circle cx="12" cy="12" r="12" class="card-amber"/>
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#d97706" text-anchor="middle">8</text>
      <text class="card-text-primary" x="34" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Vị trí quả lê:</text>
      <text x="34" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Vị trí thứ 8</text>
    </g>

    <!-- Key Insight 3: Formula -->
    <g transform="translate(20, 205)">
      <rect class="card-subtle" x="0" y="0" width="165" height="55" rx="8" stroke-width="1"/>
      <text class="card-text-secondary" x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Khoảng cách:</text>
      <text class="card-text-primary" x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">7 quả ngược chiều</text>
    </g>

    <!-- Result Banner -->
    <g transform="translate(20, 280)">
      <rect class="card-emerald" x="0" y="0" width="165" height="50" rx="10" stroke-width="1.5"/>
      <circle cx="22" cy="25" r="10" fill="#10b981"/>
      <path d="M 18 25 L 21 28 L 26 22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="card-emerald-text" x="40" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">Quả lê còn lại</text>
      <text class="card-emerald-sub" x="40" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">Sau cùng (✓)</text>
    </g>
  </g>
</svg>
