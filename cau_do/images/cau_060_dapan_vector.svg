<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <filter id="board-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="success-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>

    <pattern id="modern-hatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" class="hatch-stroke" stroke-width="2.5" stroke-linecap="square"/>
    </pattern>

    <!-- Star Definitions -->
    <polygon id="star-icon" points="0,-8.5 2.23,-3.07 8.08,-2.63 3.61,1.17 5.00,6.88 0,3.8 -5.00,6.88 -3.61,1.17 -8.08,-2.63 -2.23,-3.07" class="star-dark"/>
    <polygon id="star-inactive" points="0,-8.5 2.23,-3.07 8.08,-2.63 3.61,1.17 5.00,6.88 0,3.8 -5.00,6.88 -3.61,1.17 -8.08,-2.63 -2.23,-3.07" fill="#64748b"/>

    <style><![CDATA[
      /* Universal Dual-Mode Styling: Seamless on both Light and Dark backgrounds */
      .matrix-bezel { fill: none; stroke: #6366f1; stroke-width: 2; }
      
      .cell-tile { fill: rgba(148, 163, 184, 0.08); stroke: #64748b; stroke-width: 1.5; }
      .cell-shaded { fill: rgba(100, 116, 139, 0.18); stroke: #64748b; stroke-width: 1.5; }
      .hatch-stroke { stroke: #64748b; }

      /* Dual-Contrast Shapes */
      .shape-white { fill: #ffffff; stroke: #0f172a; stroke-width: 2.6; stroke-linejoin: round; }
      .shape-dark { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.8; stroke-linejoin: round; }
      .star-dark { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.2; stroke-linejoin: round; }

      /* Option Cards */
      .card-option-muted { fill: rgba(148, 163, 184, 0.03); stroke: #64748b; stroke-width: 1.2; opacity: 0.65; }
      .card-option-winner { fill: rgba(16, 185, 129, 0.14); stroke: #10b981; stroke-width: 2.8; }

      .badge-muted-bg { fill: rgba(148, 163, 184, 0.12); stroke: #64748b; stroke-width: 1; }
      .badge-muted-text { fill: #94a3b8; font-weight: 700; }
      .badge-winner-bg { fill: #10b981; }
      .badge-winner-text { fill: #ffffff; font-weight: 800; }

      /* Solved Target Cell */
      .target-solved-bg { fill: rgba(16, 185, 129, 0.14); stroke: #10b981; stroke-width: 2.8; }

      @media (prefers-color-scheme: dark) {
        .cell-tile { fill: rgba(255, 255, 255, 0.06); stroke: #475569; }
        .cell-shaded { fill: rgba(148, 163, 184, 0.15); stroke: #475569; }
        .card-option-muted { fill: rgba(255, 255, 255, 0.02); stroke: #334155; opacity: 0.5; }
      }
    ]]></style>
  </defs>

  <!-- LEFT 3x3 MATRIX CONTAINER (TRANSPARENT OUTLINED STRUCTURE) -->
  <g filter="url(#board-shadow)">
    <!-- Matrix Outer Border -->
    <rect x="52" y="47" width="364" height="364" rx="18" class="matrix-bezel"/>

    <!-- ================= ROW 1 (White Circles) ================= -->
    <!-- Cell (1,1): Star (left) + White Circle -->
    <g>
      <rect x="64" y="59" width="108" height="108" rx="12" class="cell-tile"/>
      <use href="#star-icon" x="88" y="113"/>
      <circle cx="124" cy="113" r="22" class="shape-white"/>
    </g>

    <!-- Cell (1,2): White Circle alone -->
    <g>
      <rect x="180" y="59" width="108" height="108" rx="12" class="cell-tile"/>
      <circle cx="234" cy="113" r="22" class="shape-white"/>
    </g>

    <!-- Cell (1,3): White Circle + Black Dot (top-right) -->
    <g>
      <rect x="296" y="59" width="108" height="108" rx="12" class="cell-tile"/>
      <circle cx="344" cy="115" r="22" class="shape-white"/>
      <circle cx="366" cy="93" r="5.5" class="shape-dark"/>
    </g>

    <!-- ================= ROW 2 (Black Squares) ================= -->
    <!-- Cell (2,1): Star (left) + Black Square -->
    <g>
      <rect x="64" y="175" width="108" height="108" rx="12" class="cell-tile"/>
      <use href="#star-icon" x="88" y="229"/>
      <rect x="104" y="209" width="40" height="40" rx="4" class="shape-dark"/>
    </g>

    <!-- Cell (2,2): Black Square alone -->
    <g>
      <rect x="180" y="175" width="108" height="108" rx="12" class="cell-tile"/>
      <rect x="214" y="209" width="40" height="40" rx="4" class="shape-dark"/>
    </g>

    <!-- Cell (2,3): Shaded Cell -->
    <g>
      <rect x="296" y="175" width="108" height="108" rx="12" class="cell-shaded"/>
      <rect x="296" y="175" width="108" height="108" rx="12" fill="url(#modern-hatch)"/>
    </g>

    <!-- ================= ROW 3 (White Triangles) ================= -->
    <!-- Cell (3,1): Shaded Cell -->
    <g>
      <rect x="64" y="291" width="108" height="108" rx="12" class="cell-shaded"/>
      <rect x="64" y="291" width="108" height="108" rx="12" fill="url(#modern-hatch)"/>
    </g>

    <!-- Cell (3,2): White Triangle alone -->
    <g>
      <rect x="180" y="291" width="108" height="108" rx="12" class="cell-tile"/>
      <polygon points="234,323 257,363 211,363" class="shape-white"/>
    </g>

    <!-- Cell (3,3): Solved Target Cell (Answer C - Emerald Glow) -->
    <g filter="url(#success-glow)">
      <rect x="296" y="291" width="108" height="108" rx="12" class="target-solved-bg"/>
      <polygon points="346,323 369,363 323,363" class="shape-white" stroke="#10b981" stroke-width="2.8"/>
      <circle cx="370" cy="316" r="5.5" fill="#10b981"/>
      <circle cx="392" cy="303" r="10" fill="#10b981"/>
      <path d="M 387.5 303 L 390.5 306 L 396.5 299.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ================= RIGHT OPTIONS A, B, C, D ================= -->
  <g>
    <!-- OPTION A (Muted) -->
    <g class="card-option-muted" filter="url(#card-shadow)">
      <rect x="460" y="65" width="140" height="120" rx="14"/>
      <circle cx="492" cy="125" r="16" class="badge-muted-bg"/>
      <text x="492" y="125" font-family="-apple-system, sans-serif" font-size="20" class="badge-muted-text" text-anchor="middle" dominant-baseline="central">A</text>
      <!-- Shapes for A: Black Triangle + Black Dot top-right (Muted) -->
      <polygon points="548,105 570,145 526,145" fill="#64748b" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="572" cy="98" r="5.5" fill="#64748b"/>
    </g>

    <!-- OPTION B (Muted) -->
    <g class="card-option-muted" filter="url(#card-shadow)">
      <rect x="630" y="65" width="140" height="120" rx="14"/>
      <!-- Shapes for B: White Circle + Black Dot top-right (Muted) -->
      <circle cx="676" cy="127" r="22" fill="#ffffff" stroke="#64748b" stroke-width="2.6"/>
      <circle cx="698" cy="105" r="5.5" fill="#64748b"/>
      <circle cx="738" cy="125" r="16" class="badge-muted-bg"/>
      <text x="738" y="125" font-family="-apple-system, sans-serif" font-size="20" class="badge-muted-text" text-anchor="middle" dominant-baseline="central">B</text>
    </g>

    <!-- OPTION C (WINNER HIGHLIGHTED - EMERALD) -->
    <g filter="url(#success-glow)">
      <rect x="460" y="250" width="140" height="120" rx="14" class="card-option-winner"/>
      <circle cx="492" cy="310" r="16" class="badge-winner-bg"/>
      <text x="492" y="310" font-family="-apple-system, sans-serif" font-size="20" class="badge-winner-text" text-anchor="middle" dominant-baseline="central">C</text>
      <!-- Shapes for C: White Triangle + Emerald Dot top-right -->
      <polygon points="548,290 570,330 526,330" class="shape-white" stroke="#10b981" stroke-width="2.8" stroke-linejoin="round"/>
      <circle cx="572" cy="283" r="5.5" fill="#10b981"/>
      <!-- Checkmark Badge -->
      <circle cx="590" cy="260" r="12" fill="#10b981"/>
      <path d="M 585 260 L 588.5 263.5 L 595 256.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- OPTION D (Muted) -->
    <g class="card-option-muted" filter="url(#card-shadow)">
      <rect x="630" y="250" width="140" height="120" rx="14"/>
      <!-- Shapes for D: White Triangle + Star top-right (Muted) -->
      <polygon points="676,290 698,330 654,330" fill="#ffffff" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round"/>
      <use href="#star-inactive" x="696" y="281"/>
      <circle cx="738" cy="310" r="16" class="badge-muted-bg"/>
      <text x="738" y="310" font-family="-apple-system, sans-serif" font-size="20" class="badge-muted-text" text-anchor="middle" dominant-baseline="central">D</text>
    </g>
  </g>
</svg>