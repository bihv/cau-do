      <rect x="455" y="230" width="170" height="160" rx="16" fill="url(#success-bg)" stroke="#10b981" stroke-width="2.8"/>
      <polygon points="486.0,332.0 522.0,360.0 594.0,360.0 558.0,332.0" fill="url(#emerald-dark)" stroke="#064e3b" stroke-width="2.2" stroke-linejoin="round"/>
        <polygon points="558.0,260.0 594.0,288.0 594.0,360.0 558.0,332.0" fill="url(#emerald-right)" stroke="#059669" stroke-width="2.2" stroke-linejoin="round"/>
        <polygon points="486.0,260.0 558.0,260.0 558.0,332.0 486.0,332.0" fill="url(#emerald-front)" stroke="#047857" stroke-width="2.2" stroke-linejoin="round"/>
