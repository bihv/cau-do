<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <!-- Soft Shadows & Glows -->
    <filter id="box-shadow" x="-10%" y="-10%" width="120%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="success-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
    <filter id="shape-depth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- Premium Dark Fill (Deep Indigo Slate) -->
    <linearGradient id="dark-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Success Cell Gradient -->
    <linearGradient id="success-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <!-- ==================================================== -->
  <!-- TOP ROW: SEQUENCE OF 4 CARDS (WITH SOLVED CARD 4)    -->
  <!-- Box Centers: 184, 328, 472, 616 (y=110)              -->
  <!-- ==================================================== -->
  <g filter="url(#box-shadow)">
    <!-- Card at (184, 110) -->
    <rect x="124" y="50" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <g filter="url(#shape-depth)">
      <path d="M 144 70 L 224 70 L 224 150 L 144 150" fill="none" stroke="url(#dark-fill)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 157.5 83.5 L 157.5 136.5 L 210.5 136.5 L 210.5 83.5" fill="none" stroke="url(#dark-fill)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 197 97 L 171 97 L 171 123 L 197 123" fill="none" stroke="url(#dark-fill)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Card at (328, 110) -->
    <rect x="268" y="50" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <g filter="url(#shape-depth)">
      <path d="M 288 70 L 288 150 L 368 150 L 368 70" fill="none" stroke="url(#dark-fill)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 301.5 136.5 L 301.5 83.5 L 354.5 83.5 L 354.5 136.5" fill="none" stroke="url(#dark-fill)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 315 97 L 315 123 L 341 123 L 341 97" fill="none" stroke="url(#dark-fill)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Card at (472, 110) -->
    <rect x="412" y="50" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <g filter="url(#shape-depth)">
      <path d="M 512 70 L 432 70 L 432 150 L 512 150" fill="none" stroke="url(#dark-fill)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 445.5 83.5 L 445.5 136.5 L 498.5 136.5 L 498.5 83.5" fill="none" stroke="url(#dark-fill)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 459 97 L 485 97 L 485 123 L 459 123" fill="none" stroke="url(#dark-fill)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Card 4: SOLVED TARGET CELL (Option D - Emerald) -->
    <g filter="url(#success-glow)">
      <rect x="556" y="50" width="120" height="120" rx="16" fill="url(#success-bg)" stroke="#10b981" stroke-width="2.8"/>
      <g>
        <path d="M 576 150 L 576 70 L 656 70 L 656 150" fill="none" stroke="#047857" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 589.5 136.5 L 589.5 83.5 L 642.5 83.5 L 642.5 136.5" fill="none" stroke="#047857" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 603 123 L 603 97 L 629 97 L 629 123" fill="none" stroke="#047857" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- Small Victory Badge at top-right of Card 4 -->
      <circle cx="666" cy="54" r="10" fill="#10b981"/>
      <path d="M 662.5 54 L 665 56.5 L 670 51" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ==================================================== -->
  <!-- BOTTOM ROW: 4 MULTIPLE CHOICE OPTIONS WITH D WON     -->
  <!-- Box Centers: 184, 328, 472, 616 (y=270)              -->
  <!-- ==================================================== -->
  <g filter="url(#box-shadow)">
    <!-- Option A (Inactive) -->
    <g opacity="0.38">
      <rect x="124" y="210" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 144 230 L 224 230 L 224 310 L 144 310" fill="none" stroke="#64748b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 210.5 243.5 L 157.5 243.5 L 157.5 296.5 L 210.5 296.5" fill="none" stroke="#64748b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 171 257 L 197 257 L 197 283 L 171 283" fill="none" stroke="#64748b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="184" cy="368" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="184" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#64748b" text-anchor="middle" dominant-baseline="central">A</text>
    </g>
    <!-- Option B (Inactive) -->
    <g opacity="0.38">
      <rect x="268" y="210" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 288 310 L 288 230 L 368 230 L 368 310" fill="none" stroke="#64748b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 301.5 296.5 L 301.5 243.5 L 354.5 243.5 L 354.5 296.5" fill="none" stroke="#64748b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 315 257 L 315 283 L 341 283 L 341 257" fill="none" stroke="#64748b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="328" cy="368" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="328" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#64748b" text-anchor="middle" dominant-baseline="central">B</text>
    </g>
    <!-- Option C (Inactive) -->
    <g opacity="0.38">
      <rect x="412" y="210" width="120" height="120" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 432 230 L 432 310 L 512 310 L 512 230" fill="none" stroke="#64748b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 445.5 243.5 L 445.5 296.5 L 498.5 296.5 L 498.5 243.5" fill="none" stroke="#64748b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 459 257 L 459 283 L 485 283 L 485 257" fill="none" stroke="#64748b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="472" cy="368" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="472" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#64748b" text-anchor="middle" dominant-baseline="central">C</text>
    </g>
    <!-- Option D (WINNER HIGHLIGHTED - MINT GREEN) -->
    <g filter="url(#success-glow)">
      <!-- Winner Card Backing -->
      <rect x="556" y="210" width="120" height="120" rx="16" fill="url(#success-bg)" stroke="#10b981" stroke-width="2.8"/>
      <!-- 3 Downward U-shapes in Emerald -->
      <path d="M 576 310 L 576 230 L 656 230 L 656 310" fill="none" stroke="#047857" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 589.5 296.5 L 589.5 243.5 L 642.5 243.5 L 642.5 296.5" fill="none" stroke="#047857" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 603 283 L 603 257 L 629 257 L 629 283" fill="none" stroke="#047857" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Letter 'D' Badge in Emerald -->
      <circle cx="616" cy="368" r="16" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
      <text x="616" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#047857" text-anchor="middle" dominant-baseline="central">D</text>
      <!-- Small Victory Badge at top-right of Option D -->
      <circle cx="666" cy="214" r="10" fill="#10b981"/>
      <path d="M 662.5 214 L 665 216.5 L 670 211" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>