<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Multi-tier Drop Shadows & Glows -->
    <filter id="node-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>

    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>

    <filter id="laser-glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#047857" flood-opacity="0.35"/>
    </filter>

    <!-- Canvas Background Gradient -->
    <!-- Emerald Success Theme for Connected Nodes -->
    <linearGradient id="emerald-dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Amber Badge Gradient -->
    <linearGradient id="amber-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- ==================== 2 BREAKOUT RADAR BEACONS (OUTSIDE THE GRID) ==================== -->
  <!-- Breakout Vertex 1: (160, 160) - Top-Left Outside -->
  <g id="breakout-vertex-1" transform="translate(160, 160)">
    <!-- Amber halo rings -->
    <circle cx="0" cy="0" r="28" fill="#fffbeb" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#b45309"/>
    <!-- Crosshairs -->
    <line x1="-34" y1="0" x2="-18" y2="0" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="34" y2="0" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="0" y1="-34" x2="0" y2="-18" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="0" y1="18" x2="0" y2="34" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Breakout 1 Pill Badge -->
  <g transform="translate(52, 105)" filter="url(#badge-shadow)">
    <rect x="0" y="0" width="115" height="26" rx="13" fill="url(#amber-badge-grad)" stroke="#fde68a" stroke-width="1.2"/>
    <text x="57" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#b45309" letter-spacing="0.5" text-anchor="middle">ĐIỂM NGOÀI 1</text>
    <!-- Pointer to vertex -->
    <line x1="95" y1="26" x2="108" y2="45" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="2,2"/>
  </g>

  <!-- Breakout Vertex 2: (640, 640) - Bottom-Right Outside -->
  <g id="breakout-vertex-2" transform="translate(640, 640)">
    <!-- Amber halo rings -->
    <circle cx="0" cy="0" r="28" fill="#fffbeb" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#b45309"/>
    <!-- Crosshairs -->
    <line x1="-34" y1="0" x2="-18" y2="0" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="34" y2="0" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="0" y1="-34" x2="0" y2="-18" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="0" y1="18" x2="0" y2="34" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Breakout 2 Pill Badge -->
  <g transform="translate(635, 690)" filter="url(#badge-shadow)">
    <rect x="0" y="0" width="115" height="26" rx="13" fill="url(#amber-badge-grad)" stroke="#fde68a" stroke-width="1.2"/>
    <text x="57" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#b45309" letter-spacing="0.5" text-anchor="middle">ĐIỂM NGOÀI 2</text>
    <!-- Pointer to vertex -->
    <line x1="20" y1="0" x2="10" y2="-20" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="2,2"/>
  </g>

  <!-- ==================== 4 CONNECTED LINE SEGMENTS (LASER GLOW STROKE) ==================== -->
  <g id="solution-lines">
    <!-- Outer Glow Polyline -->
    <polyline points="320,480 640,160 160,160 640,640 640,160" 
              fill="none" stroke="#10b981" stroke-width="14" stroke-opacity="0.25" 
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sharp Main Polyline -->
    <polyline points="320,480 640,160 160,160 640,640 640,160" 
              fill="none" stroke="#059669" stroke-width="6" 
              stroke-linecap="round" stroke-linejoin="round"
              filter="url(#laser-glow)"/>

    <!-- Inner Core Polyline Highlight -->
    <polyline points="320,480 640,160 160,160 640,640 640,160" 
              fill="none" stroke="#ecfdf5" stroke-width="2" 
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== DIRECTION ARROWS ON SEGMENTS ==================== -->
  <g id="stroke-arrows">
    <!-- Arrow 1: On Segment 1, pointing up-right (-45 deg) -->
    <g transform="translate(560, 240) rotate(-45)">
      <polygon points="9,0 -6,-6 -2,0 -6,6" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
    </g>

    <!-- Arrow 2: On Segment 2 (breakout stretch), pointing left (180 deg) -->
    <g transform="translate(240, 160) rotate(180)">
      <polygon points="9,0 -6,-6 -2,0 -6,6" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
    </g>

    <!-- Arrow 3: On Segment 3 (breakout stretch), pointing down-right (+45 deg) -->
    <g transform="translate(560, 560) rotate(45)">
      <polygon points="9,0 -6,-6 -2,0 -6,6" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
    </g>

    <!-- Arrow 4: On Segment 4, pointing straight up (-90 deg) -->
    <g transform="translate(640, 400) rotate(-90)">
      <polygon points="9,0 -6,-6 -2,0 -6,6" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
    </g>
  </g>

  <!-- ==================== 9 CIRCULAR DOTS (ON TOP OF LINES - PERFECTLY CENTERED) ==================== -->
  <g id="nine-dots-activated" filter="url(#node-shadow)">
    <!-- Row 1: Top (y = 160) -->
    <!-- Dot (1,1): Top-Left (320, 160) [Hit by Line 2] -->
    <g transform="translate(320, 160)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#emerald-dot-grad)" stroke="#047857" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#a7f3d0"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (1,2): Top-Middle (480, 160) [Hit by Line 2] -->
    <g transform="translate(480, 160)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#emerald-dot-grad)" stroke="#047857" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#a7f3d0"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (1,3): Top-Right (640, 160) [Hit by Line 1, Line 2, Line 4] -->
    <g transform="translate(640, 160)">
      <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#059669" stroke-width="3"/>
      <circle cx="0" cy="0" r="19" fill="url(#emerald-dot-grad)" stroke="#047857" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5.5" fill="#6ee7b7"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Row 2: Middle (y = 320) -->
    <!-- Dot (2,1): Middle-Left (320, 320) [Hit by Line 3] -->
    <g transform="translate(320, 320)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#emerald-dot-grad)" stroke="#047857" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#a7f3d0"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (2,2): Center (480, 320) [Hit by Line 1] -->
    <g transform="translate(480, 320)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#emerald-dot-grad)" stroke="#047857" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#a7f3d0"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (2,3): Middle-Right (640, 320) [Hit by Line 4] -->
    <g transform="translate(640, 320)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#emerald-dot-grad)" stroke="#047857" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#a7f3d0"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Row 3: Bottom (y = 480) -->
    <!-- Dot (3,1): Bottom-Left (320, 480) [Start Point - Hit by Line 1] -->
    <g transform="translate(320, 480)">
      <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#059669" stroke-width="3"/>
      <circle cx="0" cy="0" r="19" fill="url(#emerald-dot-grad)" stroke="#047857" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5.5" fill="#6ee7b7"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (3,2): Bottom-Middle (480, 480) [Hit by Line 3] -->
    <g transform="translate(480, 480)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#emerald-dot-grad)" stroke="#047857" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#a7f3d0"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>

    <!-- Dot (3,3): Bottom-Right (640, 480) [Hit by Line 4] -->
    <g transform="translate(640, 480)">
      <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#emerald-dot-grad)" stroke="#047857" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="5" fill="#a7f3d0"/>
      <ellipse cx="-5" cy="-5" rx="4.5" ry="3" fill="#ffffff" opacity="0.45" transform="rotate(-30, -5, -5)"/>
    </g>
  </g>

  <!-- ==================== START BADGE AT (320, 480) ==================== -->
  <g transform="translate(195, 464)" filter="url(#badge-shadow)">
    <rect x="0" y="0" width="96" height="32" rx="16" fill="#059669" stroke="#ffffff" stroke-width="2"/>
    <!-- Play Triangle -->
    <polygon points="15,10 15,22 25,16" fill="#ffffff"/>
    <text x="29" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">BẮT ĐẦU</text>
    <!-- Pointer -->
    <line x1="96" y1="16" x2="110" y2="16" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ==================== STROKE STEP NUMBER BADGES (1, 2, 3, 4) ==================== -->
  <!-- Badge 1: On Line 1 -->
  <g transform="translate(525, 275)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="16" fill="#047857" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- Badge 2: On Line 2 -->
  <g transform="translate(400, 115)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="16" fill="#047857" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  <!-- Badge 3: On Line 3 -->
  <g transform="translate(220, 260)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="16" fill="#047857" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  </g>

  <!-- Badge 4: On Line 4 -->
  <g transform="translate(685, 400)" filter="url(#badge-shadow)">
    <circle cx="0" cy="0" r="16" fill="#047857" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
  </g>
</svg>
