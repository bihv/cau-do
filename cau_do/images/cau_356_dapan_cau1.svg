<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 70 640 280" width="100%" height="100%">
  <!-- Transition Arrow -->
  <g transform="translate(400, 210)" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-24" y1="0" x2="24" y2="0"/>
    <polyline points="14,-8 24,0 14,8"/>
  </g>

  <!-- LEFT: GREEK CROSS CUT INTO 4 PIECES (cx=210, cy=210) -->
  <g transform="translate(210, 210)" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round">
    <polygon points="0,0 -32.5,-65 -32.5,-97.5 32.5,-97.5 32.5,-32.5 65,-32.5" fill="#38bdf8"/>
    <polygon points="0,0 65,-32.5 97.5,-32.5 97.5,32.5 32.5,32.5 32.5,65" fill="#34d399"/>
    <polygon points="0,0 32.5,65 32.5,97.5 -32.5,97.5 -32.5,32.5 -65,32.5" fill="#fbbf24"/>
    <polygon points="0,0 -65,32.5 -97.5,32.5 -97.5,-32.5 -32.5,-32.5 -32.5,-65" fill="#f87171"/>

    <!-- Cut lines highlighted with crisp white dashed overlay -->
    <line x1="-32.5" y1="-65" x2="32.5" y2="65" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5,4"/>
    <line x1="-65" y1="32.5" x2="65" y2="-32.5" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5,4"/>

    <!-- Center Pivot -->
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- RIGHT: ASSEMBLED SQUARE (cx=590, cy=210) -->
  <g transform="translate(590, 210)" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round">
    <polygon points="-72.67,72.67 -72.67,0.0 -58.14,-29.07 0.0,0.0 -29.07,58.14 0.0,72.67" fill="#38bdf8"/>
    <polygon points="-72.67,-72.67 -0.0,-72.67 29.07,-58.14 0.0,0.0 -58.14,-29.07 -72.67,0.0" fill="#34d399"/>
    <polygon points="72.67,-72.67 72.67,-0.0 58.14,29.07 -0.0,0.0 29.07,-58.14 -0.0,-72.67" fill="#fbbf24"/>
    <polygon points="72.67,72.67 0.0,72.67 -29.07,58.14 0.0,-0.0 58.14,29.07 72.67,-0.0" fill="#f87171"/>

    <!-- Outer Square Boundary Reinforcement -->
    <rect x="-72.67" y="-72.67" width="145.34" height="145.34" fill="none" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Center Pivot -->
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>
</svg>