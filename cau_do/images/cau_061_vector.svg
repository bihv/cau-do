<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <!-- Soft Shadows & Glows -->
    <filter id="box-shadow" x="-8%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="target-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
    <filter id="shape-depth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Premium Dark Fill (Deep Indigo Slate) -->
    <linearGradient id="dark-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Target Cell Gradient -->
    <linearGradient id="target-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Shaded Cell Base Gradient -->
    <linearGradient id="shaded-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Modern Diagonal Hatching Pattern -->
    <pattern id="modern-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#475569" stroke-width="2.2" stroke-linecap="square"/>
    </pattern>

    <!-- Plus Symbol Definition (Centered at 0,0, size 20x20) -->
    <path id="plus-icon" d="M -3 -10 H 3 V -3 H 10 V 3 H 3 V 10 H -3 V 3 H -10 V -3 H -3 Z" fill="url(#dark-fill)"/>

    <!-- Clip Path for Matrix Outer Frame -->
    <clipPath id="matrix-clip">
      <rect x="60" y="55" width="348" height="348" rx="16"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- ==================================================== -->
  <!-- LEFT SIDE: 3x3 IQ MATRIX CONTAINER                   -->
  <!-- Box: x=60, y=55, w=348, h=348                        -->
  <!-- Cell Size: 116x116 each                              -->
  <!-- ==================================================== -->
  <g filter="url(#box-shadow)">
    <!-- Base Matrix Background Card -->
    <rect x="60" y="55" width="348" height="348" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>

    <!-- Clipped Area for Interior Shaded Patterns -->
    <g clip-path="url(#matrix-clip)">
      <!-- Shaded Cell (2,1) Background & Hatching -->
      <rect x="60" y="171" width="116" height="116" fill="url(#shaded-base)"/>
      <rect x="60" y="171" width="116" height="116" fill="url(#modern-hatch)"/>

      <!-- Shaded Cell (3,2) Background & Hatching -->
      <rect x="176" y="287" width="116" height="116" fill="url(#shaded-base)"/>
      <rect x="176" y="287" width="116" height="116" fill="url(#modern-hatch)"/>
    </g>

    <!-- Target Empty Cell (3,3) Warm Glow Styling -->
    <rect x="296" y="291" width="108" height="108" rx="12" fill="url(#target-bg)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#target-glow)"/>
    <text x="350" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#d97706" text-anchor="middle" dominant-baseline="central">?</text>

    <!-- Grid Divider Lines -->
    <line x1="176" y1="55" x2="176" y2="403" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="292" y1="55" x2="292" y2="403" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="60" y1="171" x2="408" y2="171" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="60" y1="287" x2="408" y2="287" stroke="#cbd5e1" stroke-width="2"/>

    <!-- ================= ROW 1 (Large Square & Plus Symbol Moving Right) ================= -->
    <!-- Cell (1,1): Plus inside Square -->
    <g filter="url(#shape-depth)">
      <rect x="91" y="86" width="54" height="54" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
      <use href="#plus-icon" x="118" y="113"/>
    </g>

    <!-- Cell (1,2): Plus on right edge of Square -->
    <g filter="url(#shape-depth)">
      <rect x="207" y="86" width="54" height="54" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
      <use href="#plus-icon" x="261" y="113"/>
    </g>

    <!-- Cell (1,3): Plus outside right edge of Square -->
    <g filter="url(#shape-depth)">
      <rect x="315" y="86" width="54" height="54" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
      <use href="#plus-icon" x="384" y="113"/>
    </g>

    <!-- ================= ROW 2 (Large Circle & Small Square Moving Down) ================= -->
    <!-- Cell (2,1): Shaded cell (already rendered above) -->

    <!-- Cell (2,2): Small Square on bottom edge of Circle -->
    <g filter="url(#shape-depth)">
      <circle cx="234" cy="224" r="27" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
      <rect x="226" y="243" width="16" height="16" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
    </g>

    <!-- Cell (2,3): Small Square outside bottom edge of Circle -->
    <g filter="url(#shape-depth)">
      <circle cx="350" cy="218" r="27" fill="#ffffff" stroke="#0f172a" stroke-width="2.6"/>
      <rect x="342" y="252" width="16" height="16" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="2.2"/>
    </g>

    <!-- ================= ROW 3 (Large Triangle & Solid Dot Moving Right) ================= -->
    <!-- Cell (3,1): Solid Dot inside Triangle -->
    <g filter="url(#shape-depth)">
      <polygon points="118,320 144,366 92,366" fill="#ffffff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="118" cy="351" r="6.5" fill="url(#dark-fill)"/>
    </g>

    <!-- Cell (3,2): Shaded cell (already rendered above) -->

    <!-- Cell (3,3): Target empty cell (already rendered above) -->
  </g>

  <!-- ==================================================== -->
  <!-- RIGHT SIDE: 4 MULTIPLE CHOICE OPTIONS A, B, C, D     -->
  <!-- Layout: A (top-left), B (top-right)                  -->
  <!--         C (bottom-left), D (bottom-right)            -->
  <!-- ==================================================== -->
  <g filter="url(#box-shadow)">
    <!-- OPTION A (Top Left) -->
    <g>
      <rect x="460" y="65" width="140" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Letter 'A' Badge on LEFT -->
      <circle cx="492" cy="125" r="16" fill="#eff6ff"/>
      <text x="492" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="central">A</text>
      <!-- Shapes for A: Triangle + Dot on LEFT edge -->
      <g filter="url(#shape-depth)">
        <polygon points="558,104 582,146 534,146" fill="#ffffff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
        <circle cx="522" cy="132" r="6.5" fill="url(#dark-fill)"/>
      </g>
    </g>

    <!-- OPTION B (Top Right - THE ANSWER) -->
    <g>
      <rect x="630" y="65" width="140" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Shapes for B: Triangle + Dot on RIGHT edge -->
      <g filter="url(#shape-depth)">
        <polygon points="672,104 696,146 648,146" fill="#ffffff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
        <circle cx="708" cy="132" r="6.5" fill="url(#dark-fill)"/>
      </g>
      <!-- Letter 'B' Badge on RIGHT -->
      <circle cx="738" cy="125" r="16" fill="#eff6ff"/>
      <text x="738" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="central">B</text>
    </g>

    <!-- OPTION C (Bottom Left) -->
    <g>
      <rect x="460" y="250" width="140" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Letter 'C' Badge on LEFT -->
      <circle cx="492" cy="310" r="16" fill="#eff6ff"/>
      <text x="492" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="central">C</text>
      <!-- Shapes for C: Triangle + Dot on BOTTOM edge -->
      <g filter="url(#shape-depth)">
        <polygon points="556,285 580,327 532,327" fill="#ffffff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
        <circle cx="556" cy="343" r="6.5" fill="url(#dark-fill)"/>
      </g>
    </g>

    <!-- OPTION D (Bottom Right) -->
    <g>
      <rect x="630" y="250" width="140" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.8"/>
      <!-- Shapes for D: Triangle + Dot on TOP apex -->
      <g filter="url(#shape-depth)">
        <polygon points="674,297 698,339 650,339" fill="#ffffff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
        <circle cx="674" cy="281" r="6.5" fill="url(#dark-fill)"/>
      </g>
      <!-- Letter 'D' Badge on RIGHT -->
      <circle cx="738" cy="310" r="16" fill="#eff6ff"/>
      <text x="738" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#2563eb" text-anchor="middle" dominant-baseline="central">D</text>
    </g>
  </g>
</svg>
