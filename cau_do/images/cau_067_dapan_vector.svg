        <polygon points="286.0,288.0 358.0,288.0 358.0,360.0 286.0,360.0" fill="#94a3b8" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="326.0,275.6 350.0,275.6 354.0,272.4 330.0,272.4" fill="#f8fafc"/>
        <polygon points="330.0,278.7 338.0,278.7 350.0,269.3 342.0,269.3" fill="#f8fafc"/>
        <polygon points="376.0,293.0 368.4,325.3 383.6,313.4" fill="#334155"/>
        <polygon points="307.0,319.0 337.0,319.0 337.0,329.0 307.0,329.0" fill="#334155"/>
        <polygon points="317.0,309.0 327.0,309.0 327.0,339.0 317.0,339.0" fill="#334155"/>
      </g>
      <circle cx="340.0" cy="422" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="340.0" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#64748b" text-anchor="middle" dominant-baseline="central">B</text>
    </g>
    <!-- Option C (Winner) -->
