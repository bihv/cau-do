<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      /* Light theme default */
      .card-box { fill: #ffffff; stroke: #cbd5e1; }
      .card-text-primary { fill: #0f172a; }
      .card-text-secondary { fill: #64748b; }

      .badge-emerald { fill: #ecfdf5; stroke: #10b981; }
      .badge-emerald-text { fill: #047857; }

      .group-1-card { fill: #eff6ff; stroke: #bfdbfe; }
      .group-1-title { fill: #1d4ed8; }

      .group-2-card { fill: #fef3c7; stroke: #fde68a; }
      .group-2-title { fill: #b45309; }

      .action-arrow { stroke: #3b82f6; fill: none; }
      .action-text { fill: #2563eb; }

      .result-pill { fill: #ecfdf5; stroke: #10b981; }
      .result-text { fill: #047857; }

      /* Dark theme */
      @media (prefers-color-scheme: dark) {
        .card-box { fill: #1e293b; stroke: #475569; }
        .card-text-primary { fill: #f8fafc; }
        .card-text-secondary { fill: #94a3b8; }

        .badge-emerald { fill: #064e3b; stroke: #10b981; }
        .badge-emerald-text { fill: #a7f3d0; }

        .group-1-card { fill: #172554; stroke: #3b82f6; }
        .group-1-title { fill: #93c5fd; }

        .group-2-card { fill: #451a03; stroke: #f59e0b; }
        .group-2-title { fill: #fde68a; }

        .action-arrow { stroke: #60a5fa; fill: none; }
        .action-text { fill: #93c5fd; }

        .result-pill { fill: #064e3b; stroke: #10b981; }
        .result-text { fill: #34d399; }
      }
    ]]></style>

    <!-- Drop Shadow Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="coinShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>

    <!-- Gold Coin Heads Gradient -->
    <radialGradient id="goldHeads" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Gold Coin Tails Gradient -->
    <radialGradient id="goldTails" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Arrow Marker -->
    <marker id="arrowAction" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Transparent Background (No Card Rect) -->

  <!-- Top Winner Badge -->
  <g transform="translate(430, 40)">
    <rect class="badge-emerald" x="-270" y="-18" width="540" height="36" rx="18" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="-245" cy="0" r="10" fill="#10b981"/>
    <path d="M -249 0 L -246 3 L -241 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="badge-emerald-text" x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">Chiến thuật: Chia nhóm 13 &amp; nhóm 10, rồi lật ngược toàn bộ nhóm 10</text>
  </g>

  <!-- 2 GROUP CARDS -->

  <!-- GROUP 1 (13 COINS): LEFT (x = 60..420) -->
  <g transform="translate(60, 85)">
    <rect class="group-1-card" x="0" y="0" width="340" height="270" rx="14" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- Title -->
    <text class="group-1-title" x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">Nhóm 1: Gồm 13 đồng xu</text>
    <text class="card-text-secondary" x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">(Giữ nguyên, không lật)</text>

    <!-- Composition Breakdown -->
    <g transform="translate(20, 80)">
      <!-- Heads Up: x coins -->
      <circle cx="20" cy="20" r="14" fill="url(#goldHeads)" stroke="#ca8a04" stroke-width="1.2" filter="url(#coinShadow)"/>
      <path d="M 20 14 L 21.5 18 L 25 18 L 22 20.5 L 23.5 24.5 L 20 22 L 16.5 24.5 L 18 20.5 L 15 18 L 18.5 18 Z" fill="#ffffff" opacity="0.95"/>
      <text class="card-text-primary" x="50" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">x đồng ngửa</text>

      <!-- Tails Down: 13 - x coins -->
      <circle cx="20" cy="70" r="14" fill="url(#goldTails)" stroke="#92400e" stroke-width="1.2" filter="url(#coinShadow)"/>
      <circle cx="20" cy="70" r="4" fill="#451a03"/>
      <text class="card-text-primary" x="50" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">13 - x đồng sấp</text>
    </g>

    <!-- Result Box for Group 1 -->
    <g transform="translate(20, 195)">
      <rect class="result-pill" x="0" y="0" width="300" height="50" rx="10" stroke-width="1.2"/>
      <text class="result-text" x="150" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Số đồng ngửa sau cùng:</text>
      <text class="result-text" x="150" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Đúng x đồng (✓)</text>
    </g>
  </g>

  <!-- GROUP 2 (10 COINS): RIGHT (x = 440..800) -->
  <g transform="translate(440, 85)">
    <rect class="group-2-card" x="0" y="0" width="360" height="270" rx="14" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- Title -->
    <text class="group-2-title" x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">Nhóm 2: Gồm 10 đồng xu</text>
    <text class="action-text" x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">↷ LẬT NGƯỢC TOÀN BỘ 10 ĐỒNG</text>

    <!-- Before Flip -->
    <g transform="translate(20, 75)">
      <text class="card-text-secondary" x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Trước khi lật:</text>
      <!-- 10 - x heads -->
      <circle cx="15" cy="22" r="11" fill="url(#goldHeads)" stroke="#ca8a04" stroke-width="1"/>
      <text class="card-text-primary" x="35" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">10 - x ngửa</text>

      <!-- x tails -->
      <circle cx="15" cy="52" r="11" fill="url(#goldTails)" stroke="#92400e" stroke-width="1"/>
      <text class="card-text-primary" x="35" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">x đồng sấp</text>
    </g>

    <!-- Flip Action Arrow -->
    <g transform="translate(165, 110)">
      <path class="action-arrow" d="M 0 0 C 15 -15, 35 -15, 50 0" stroke-width="2.5" marker-end="url(#arrowAction)"/>
      <text class="action-text" x="25" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Lật mặt</text>
    </g>

    <!-- After Flip -->
    <g transform="translate(235, 75)">
      <text class="action-text" x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Sau khi lật:</text>
      <!-- x tails turned to x HEADS! -->
      <circle cx="15" cy="22" r="12" fill="url(#goldHeads)" stroke="#ca8a04" stroke-width="1.5" filter="url(#coinShadow)"/>
      <path d="M 15 17 L 16 20 L 19 20 L 16.5 22 L 17.5 25 L 15 23 L 12.5 25 L 13.5 22 L 11 20 L 14 20 Z" fill="#ffffff"/>
      <text class="result-text" x="35" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">x đồng ngửa!</text>

      <!-- 10 - x turned to tails -->
      <circle cx="15" cy="52" r="11" fill="url(#goldTails)" stroke="#92400e" stroke-width="1"/>
      <text class="card-text-secondary" x="35" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">10 - x sấp</text>
    </g>

    <!-- Result Box for Group 2 -->
    <g transform="translate(20, 195)">
      <rect class="result-pill" x="0" y="0" width="320" height="50" rx="10" stroke-width="1.2"/>
      <text class="result-text" x="160" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Số đồng ngửa sau cùng:</text>
      <text class="result-text" x="160" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Đúng x đồng (✓)</text>
    </g>
  </g>

  <!-- Final Equivalence Bar at Bottom -->
  <g transform="translate(430, 400)">
    <rect class="card-box" x="-320" y="-20" width="640" height="46" rx="12" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text class="result-text" x="0" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle">✓ Kết luận: Số đồng ngửa Nhóm 1 (x) = Số đồng ngửa Nhóm 2 (x)</text>
  </g>

</svg>
