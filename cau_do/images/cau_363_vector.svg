<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" width="100%" height="100%">
  <defs>
    <linearGradient id="shapeGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="shapeGradB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Triangle A (Floor) -->
  <g filter="url(#shadow)">
    <polygon points="50,250 230,90 330,250" fill="url(#shapeGradA)" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <circle cx="50" cy="250" r="4" fill="#0369a1"/>
  <circle cx="230" cy="90" r="4" fill="#0369a1"/>
  <circle cx="330" cy="250" r="4" fill="#0369a1"/>
  <text x="190" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0369a1" text-anchor="middle">Nền nhà (A)</text>

  <!-- Triangle B (Carpet - Mirror image) -->
  <g filter="url(#shadow)">
    <polygon points="410,250 510,90 690,250" fill="url(#shapeGradB)" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <circle cx="410" cy="250" r="4" fill="#b45309"/>
  <circle cx="510" cy="90" r="4" fill="#b45309"/>
  <circle cx="690" cy="250" r="4" fill="#b45309"/>
  <text x="550" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">Tấm thảm (B)</text>

  <!-- Dashed mirror axis indicator in middle -->
  <line x1="370" y1="60" x2="370" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="370" cy="165" r="3" fill="#64748b"/>
</svg>
